<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 300" width="800" height="300" role="img">
  <title>Day 5 reward — Amethyst Rider room entry (bike entrance, 9s loop)</title>
  <defs>
    <path id="e5-spark" d="M0 -1 C.14 -.32 .32 -.14 1 0 C.32 .14 .14 .32 0 1 C-.14 .32 -.32 .14 -1 0 C-.32 -.14 -.14 -.32 0 -1 Z"/>
    <linearGradient id="e5-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="e5-banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c6ff"/><stop offset=".45" stop-color="#9a6ce0"/><stop offset="1" stop-color="#4a2d80"/>
    </linearGradient>
    <linearGradient id="e5-tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#d9a93c"/>
    </linearGradient>
    <radialGradient id="e5-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient stage glow -->
  <ellipse cx="400" cy="150" rx="310" ry="130" fill="url(#e5-glow)">
    <animate attributeName="opacity" values=".45;.8;.45" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- checkered flag poles -->
  <g stroke-linecap="round">
    <line x1="296" y1="244" x2="296" y2="170" stroke="#c9a6ff" stroke-width="3"/>
    <circle cx="296" cy="168" r="2.6" fill="#ffd76e"/>
    <g transform="translate(296 170)"><g>
      <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="1.05s" repeatCount="indefinite"/>
      <rect width="26" height="17" fill="#efe8ff"/>
      <rect width="8.7" height="8.5" fill="#241238"/><rect x="17.3" width="8.7" height="8.5" fill="#241238"/>
      <rect x="8.7" y="8.5" width="8.7" height="8.5" fill="#241238"/>
    </g></g>
    <line x1="504" y1="244" x2="504" y2="170" stroke="#c9a6ff" stroke-width="3"/>
    <circle cx="504" cy="168" r="2.6" fill="#ffd76e"/>
    <g transform="translate(504 170)"><g>
      <animateTransform attributeName="transform" type="rotate" values="6;-6;6" dur="1.2s" repeatCount="indefinite"/>
      <rect width="26" height="17" fill="#efe8ff"/>
      <rect width="8.7" height="8.5" fill="#241238"/><rect x="17.3" width="8.7" height="8.5" fill="#241238"/>
      <rect x="8.7" y="8.5" width="8.7" height="8.5" fill="#241238"/>
    </g></g>
  </g>

  <!-- road: appears as the rider enters, fades away after they leave -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.07;.86;.94;1" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 0;0 18" keyTimes="0;.86;1" dur="9s" repeatCount="indefinite"/>
    <rect x="64" y="240" width="672" height="7" rx="3.5" fill="#241238" opacity=".35"/>
    <line x1="84" y1="243.5" x2="716" y2="243.5" stroke="#c9a6ff" stroke-width="2" stroke-dasharray="16 30" opacity=".3"/>
  </g>

  <!-- ===================== THE BIKE ===================== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-300 244;-300 244;400 244;400 244;1120 244;1120 244"
      keyTimes="0;.06;.34;.6;.86;1" calcMode="spline"
      keySplines="0 0 1 1;.15 .75 .25 1;0 0 1 1;.6 .05 .85 .5;0 0 1 1"
      dur="9s" repeatCount="indefinite"/>

    <ellipse cx="2" cy="2" rx="56" ry="5.5" fill="#000" opacity=".28"/>

    <!-- speed lines (only while moving) -->
    <g stroke="#c9a6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 22" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;1;1;0;0"
        keyTimes="0;.06;.10;.30;.35;.57;.62;.66;.82;.87;1" dur="9s" repeatCount="indefinite"/>
      <line x1="-150" y1="-8" x2="-64" y2="-8"><animate attributeName="stroke-dashoffset" values="0;-52" dur=".45s" repeatCount="indefinite"/></line>
      <line x1="-138" y1="-20" x2="-58" y2="-20"><animate attributeName="stroke-dashoffset" values="0;-52" dur=".45s" repeatCount="indefinite"/></line>
      <line x1="-152" y1="-32" x2="-70" y2="-32"><animate attributeName="stroke-dashoffset" values="0;-52" dur=".45s" repeatCount="indefinite"/></line>
    </g>

    <!-- headlight beam -->
    <polygon points="50,-54 190,-86 190,-22" fill="url(#e5-beam)">
      <animate attributeName="opacity" values=".55;.95;.6;.95;.55" dur="1.6s" repeatCount="indefinite"/>
    </polygon>

    <!-- dust bursts at stop + launch -->
    <g transform="translate(-44 -3)"><g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;-16 -7;-40 -13;-40 -13;0 0;-14 -6;-36 -12;-36 -12"
        keyTimes="0;.34;.38;.46;.60;.64;.72;1" dur="9s" repeatCount="indefinite"/>
      <circle r="3" fill="#cbb3f5" opacity="0">
        <animate attributeName="opacity" values="0;0;.85;0;0;.85;0;0" keyTimes="0;.34;.38;.46;.60;.64;.72;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;3;13;22;3;3;12;20" keyTimes="0;.34;.38;.46;.60;.64;.72;1" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g></g>
    <g transform="translate(-60 -9)"><g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;-14 -8;-36 -14;-36 -14;0 0;-12 -7;-32 -13;-32 -13"
        keyTimes="0;.36;.40;.48;.605;.645;.725;1" dur="9s" repeatCount="indefinite"/>
      <circle r="3" fill="#cbb3f5" opacity="0">
        <animate attributeName="opacity" values="0;0;.75;0;0;.75;0;0" keyTimes="0;.36;.40;.48;.605;.645;.725;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;3;11;19;3;3;10;17" keyTimes="0;.36;.40;.48;.605;.645;.725;1" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g></g>
    <g transform="translate(-30 -2)"><g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;-18 -6;-42 -11;-42 -11;0 0;-16 -5;-38 -10;-38 -10"
        keyTimes="0;.345;.385;.465;.60;.635;.715;1" dur="9s" repeatCount="indefinite"/>
      <circle r="3" fill="#cbb3f5" opacity="0">
        <animate attributeName="opacity" values="0;0;.7;0;0;.7;0;0" keyTimes="0;.345;.385;.465;.60;.635;.715;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;3;12;20;3;3;11;18" keyTimes="0;.345;.385;.465;.60;.635;.715;1" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g></g>

    <!-- idle exhaust puff -->
    <g transform="translate(-52 -14)"><g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-16 -10;-16 -10" keyTimes="0;.3;1" dur=".9s" repeatCount="indefinite"/>
      <circle r="3" fill="#cbb3f5">
        <animate attributeName="opacity" values="0;.55;0" keyTimes="0;.3;1" dur=".9s" repeatCount="indefinite"/>
        <animate attributeName="r" values="2;7;9" keyTimes="0;.3;1" dur=".9s" repeatCount="indefinite"/>
      </circle>
    </g></g>

    <!-- bike art (with suspension bounce) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;0 5;0 -2;0 1;0 0;0 0;0 -3;0 0;0 0"
        keyTimes="0;.33;.36;.40;.44;.48;.58;.615;.65;1" dur="9s" repeatCount="indefinite"/>

      <!-- wheels -->
      <g transform="translate(-34 -16)">
        <circle r="16" fill="#1b0f2e" stroke="#c9a6ff" stroke-width="2"/>
        <circle r="10.5" fill="none" stroke="#6d3fc0" stroke-width="2"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;0;2340;2340;4680;4680"
            keyTimes="0;.06;.34;.6;.86;1" calcMode="spline"
            keySplines="0 0 1 1;.15 .75 .25 1;0 0 1 1;.6 .05 .85 .5;0 0 1 1"
            dur="9s" repeatCount="indefinite"/>
          <path d="M0 -10 V10 M-10 0 H10 M-7 -7 L7 7 M-7 7 L7 -7" stroke="#c9a6ff" stroke-width="1.4"/>
          <circle r="2.6" fill="#e6dbff"/>
        </g>
      </g>
      <g transform="translate(34 -16)">
        <circle r="16" fill="#1b0f2e" stroke="#c9a6ff" stroke-width="2"/>
        <circle r="10.5" fill="none" stroke="#6d3fc0" stroke-width="2"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;0;2340;2340;4680;4680"
            keyTimes="0;.06;.34;.6;.86;1" calcMode="spline"
            keySplines="0 0 1 1;.15 .75 .25 1;0 0 1 1;.6 .05 .85 .5;0 0 1 1"
            dur="9s" repeatCount="indefinite"/>
          <path d="M0 -10 V10 M-10 0 H10 M-7 -7 L7 7 M-7 7 L7 -7" stroke="#c9a6ff" stroke-width="1.4"/>
          <circle r="2.6" fill="#e6dbff"/>
        </g>
      </g>

      <!-- frame / engine / exhaust -->
      <path d="M-34 -16 L-14 -34 L12 -34 L34 -16" fill="none" stroke="#4a2d80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-12" y="-28" width="22" height="13" rx="4" fill="#6d3fc0" stroke="#241238" stroke-width="1.5"/>
      <path d="M8 -17 C-14 -13 -32 -12 -50 -13" fill="none" stroke="#c9a6ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-51" cy="-13" r="2.2" fill="#e6dbff"/>
      <rect x="-24" y="-42" width="20" height="7" rx="3.5" fill="#241238"/>
      <line x1="34" y1="-16" x2="44" y2="-50" stroke="#4a2d80" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 -53 L56 -57" stroke="#4a2d80" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="56" cy="-57" r="1.8" fill="#241238"/>
      <circle cx="47" cy="-49" r="4.5" fill="#ffd76e" stroke="#8a5a14" stroke-width="1">
        <animate attributeName="opacity" values="1;.5;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>

      <!-- rider -->
      <path d="M-12 -39 C-8 -30 -3 -23 3 -19" fill="none" stroke="#241238" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-14 -41 C-15 -52 -8 -58 1 -57" fill="none" stroke="#241238" stroke-width="5" stroke-linecap="round"/>
      <path d="M-1 -54 C14 -57 30 -55 45 -52" fill="none" stroke="#241238" stroke-width="4" stroke-linecap="round"/>
      <circle cx="4" cy="-62" r="7" fill="#241238"/>
      <path d="M8 -66 A7 7 0 0 1 11 -59" fill="none" stroke="#ffd76e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1.5" cy="-65" r="1.2" fill="#c9a6ff"/>
      <path fill="none" stroke="#ffd76e" stroke-width="2" stroke-linecap="round" d="M0 -57 C-8 -60 -14 -56 -22 -59">
        <animate attributeName="d" dur=".55s" repeatCount="indefinite"
          values="M0 -57 C-8 -60 -14 -56 -22 -59;M0 -57 C-8 -54 -14 -61 -22 -55;M0 -57 C-8 -60 -14 -56 -22 -59"/>
      </path>
    </g>

    <!-- VROOM! -->
    <text x="-88" y="-64" transform="rotate(-8 -88 -64)" font-family="Verdana, 'DejaVu Sans', sans-serif"
          font-size="14" font-style="italic" font-weight="bold" fill="#e6dbff" opacity="0">VROOM!
      &lt;animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.07;.11;.24;.30;1" dur="9s" repeatCount="indefinite"/&gt;
    </text>
  </g>

  <!-- ===================== WELCOME BANNER (no name needed) ===================== -->
  <g transform="translate(400 92)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0;0;1.14;.96;1;1;0;0" keyTimes="0;.355;.40;.44;.47;.56;.60;1"
        calcMode="spline" keySplines="0 0 1 1;.2 .9 .3 1;.4 0 .6 1;0 0 1 1;0 0 1 1;.5 0 .8 .4;0 0 1 1"
        dur="9s" repeatCount="indefinite"/>

      <!-- sparkle burst -->
      <g><animateTransform attributeName="transform" type="scale" values="0;0;1;0;0" keyTimes="0;.37;.41;.50;1" dur="9s" repeatCount="indefinite"/><g transform="translate(-186 -26)"><use href="#e5-spark" xlink:href="#e5-spark" transform="scale(8)" fill="#ffe9b0"/></g></g>
      <g><animateTransform attributeName="transform" type="scale" values="0;0;1;0;0" keyTimes="0;.395;.435;.525;1" dur="9s" repeatCount="indefinite"/><g transform="translate(188 -30)"><use href="#e5-spark" xlink:href="#e5-spark" transform="scale(7)" fill="#ffe9b0"/></g></g>
      <g><animateTransform attributeName="transform" type="scale" values="0;0;1;0;0" keyTimes="0;.42;.46;.55;1" dur="9s" repeatCount="indefinite"/><g transform="translate(-150 28)"><use href="#e5-spark" xlink:href="#e5-spark" transform="scale(6)" fill="#ffd76e"/></g></g>
      <g><animateTransform attributeName="transform" type="scale" values="0;0;1;0;0" keyTimes="0;.445;.485;.575;1" dur="9s" repeatCount="indefinite"/><g transform="translate(152 32)"><use href="#e5-spark" xlink:href="#e5-spark" transform="scale(8)" fill="#ffe9b0"/></g></g>
      <g><animateTransform attributeName="transform" type="scale" values="0;0;1;0;0" keyTimes="0;.41;.45;.54;1" dur="9s" repeatCount="indefinite"/><g transform="translate(-52 -50)"><use href="#e5-spark" xlink:href="#e5-spark" transform="scale(6)" fill="#ffd76e"/></g></g>
      <g><animateTransform attributeName="transform" type="scale" values="0;0;1;0;0" keyTimes="0;.43;.47;.56;1" dur="9s" repeatCount="indefinite"/><g transform="translate(48 -52)"><use href="#e5-spark" xlink:href="#e5-spark" transform="scale(7)" fill="#ffe9b0"/></g></g>
      <g><animateTransform attributeName="transform" type="scale" values="0;0;1;0;0" keyTimes="0;.46;.50;.59;1" dur="9s" repeatCount="indefinite"/><g transform="translate(0 44)"><use href="#e5-spark" xlink:href="#e5-spark" transform="scale(6)" fill="#ffd76e"/></g></g>

      <path d="M-176 -34 L-198 -26 L-176 -18 Z" fill="#3a2168"/>
      <path d="M176 -34 L198 -26 L176 -18 Z" fill="#3a2168"/>
      <rect x="-176" y="-34" width="352" height="64" rx="14" fill="url(#e5-banner)" stroke="#241238" stroke-width="2"/>
      <rect x="-168" y="-26" width="336" height="48" rx="10" fill="none" stroke="#ffe9b0" stroke-width="1" opacity=".45"/>
      <g transform="translate(0 -36)">
        <path d="M-13 2 L-9 -9 L-4.5 -3 L0 -12 L4.5 -3 L9 -9 L13 2 Z" fill="#ffd76e" stroke="#8a5a14" stroke-width="1"/>
      </g>
      <text x="0" y="-2" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif"
            font-size="26" font-weight="bold" letter-spacing="1.5" fill="#fff6d8">GUESS WHO'S HERE!</text>
      <text x="0" y="19" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif"
            font-size="13" letter-spacing="3" fill="#e6dbff">RODE IN TO SAY HI</text>
    </g>
  </g>

  <!-- daily bonus tag -->
  <rect x="340" y="262" width="120" height="18" rx="9" fill="url(#e5-tag)" stroke="#8a5a14" stroke-width="1"/>
  <text x="400" y="274.5" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif"
        font-size="9" font-weight="bold" letter-spacing="2" fill="#3a2606">DAILY BONUS</text>
</svg>