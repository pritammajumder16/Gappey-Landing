<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="280" height="96" role="img">
  <title>Day 7 reward — Sovereign chat bubble (stretch to any text size; set width/height attrs)</title>
  <defs>
    <linearGradient id="b7-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffedb0"/><stop offset=".45" stop-color="#f2c14e"/><stop offset="1" stop-color="#b07a1c"/>
    </linearGradient>
    <linearGradient id="b7-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3c0c" stop-opacity="0"/>
      <stop offset=".72" stop-color="#5c3c0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#5c3c0c" stop-opacity=".3"/>
    </linearGradient>
    <clipPath id="b7-clip"><rect x="0" y="0" width="100%" height="100%" rx="20" ry="20"/></clipPath>
    <filter id="b7-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="b7-spark" d="M0 -1 C.14 -.32 .32 -.14 1 0 C.32 .14 .14 .32 0 1 C-.14 .32 -.32 .14 -1 0 C-.32 -.14 -.14 -.32 0 -1 Z"/>
  </defs>

  <!-- soft outer glow (delete this rect if you show many bubbles in a scrolling list) -->
  <rect width="100%" height="100%" rx="20" ry="20" fill="#f2c14e" opacity=".3" filter="url(#b7-soft)"/>

  <g clip-path="url(#b7-clip)">
    <rect width="100%" height="100%" rx="20" ry="20" fill="url(#b7-fill)"/>
    <rect width="100%" height="100%" fill="url(#b7-shade)"/>

    <!-- glinting dots -->
    <circle cx="16%" cy="30%" r="2.2" fill="#fff6d8"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="46%" cy="76%" r="1.6" fill="#fff6d8"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="72%" cy="24%" r="1.8" fill="#fff6d8"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin="-1.1s" repeatCount="indefinite"/></circle>

    <!-- left sparkles -->
    <g transform="translate(16 22)"><g>
      <animateTransform attributeName="transform" type="scale" values=".2;.9;.2" dur="2.6s" repeatCount="indefinite"/>
      <use href="#b7-spark" xlink:href="#b7-spark" transform="scale(7)" fill="#fff6d8"/>
    </g></g>
    <g transform="translate(26 74)"><g>
      <animateTransform attributeName="transform" type="scale" values=".9;.2;.9" dur="3.1s" begin="-1.2s" repeatCount="indefinite"/>
      <use href="#b7-spark" xlink:href="#b7-spark" transform="scale(5)" fill="#ffe9b0"/>
    </g></g>

    <!-- right-anchored sparkles (x=100% pins them to the right edge at ANY width) -->
    <g transform="translate(-13 26)">
      <use href="#b7-spark" xlink:href="#b7-spark" x="100%" transform="scale(6)" fill="#ffe9b0">
        <animate attributeName="opacity" values=".2;1;.2" dur="2.9s" begin="-0.6s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(-16 72)">
      <use href="#b7-spark" xlink:href="#b7-spark" x="100%" transform="scale(4.5)" fill="#fff6d8">
        <animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="-1.5s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- double rim (outer half of each stroke self-clips at the viewport edge) -->
  <rect width="100%" height="100%" rx="20" ry="20" fill="none" stroke="#8a5a14" stroke-width="4"/>
  <rect width="100%" height="100%" rx="20" ry="20" fill="none" stroke="#fff6d8" stroke-width="1.2" opacity=".7"/>

  <!-- send-in pop: replays automatically whenever you re-insert this node for a new message -->
  <animate attributeName="opacity" values="0;1" dur=".25s" fill="freeze" repeatCount="1"/>

  <!-- SAMPLE TEXT — delete me and render text in your app layer instead
  <text x="50%" y="50%" dy=".35em" text-anchor="middle" font-family="Verdana, sans-serif"
        font-size="17" font-weight="bold" fill="#3a2606">Hey! joining the party</text>
  -->
</svg>