<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 240 240" width="240" height="240" role="img">
  <title>Day 3 reward — Frost Silver daily bonus frame (hollow center for avatar overlay)</title>
  <defs>
    <clipPath id="s-ribclip"><rect x="52" y="202" width="136" height="28" rx="14"/></clipPath>
    <path id="s-spark" d="M0 -1 C.14 -.32 .32 -.14 1 0 C.32 .14 .14 .32 0 1 C-.14 .32 -.32 .14 -1 0 C-.32 -.14 -.14 -.32 0 -1 Z"/>
    <linearGradient id="s-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6f9"/><stop offset=".45" stop-color="#bcc6cf"/>
      <stop offset=".8" stop-color="#6f7a85"/><stop offset="1" stop-color="#a8b3bc"/>
    </linearGradient>
    <linearGradient id="s-rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f6"/><stop offset=".5" stop-color="#b6c1ca"/><stop offset="1" stop-color="#7d8892"/>
    </linearGradient>
    <radialGradient id="s-stud" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#c9d8de"/><stop offset="1" stop-color="#7c98a3"/>
    </radialGradient>
    <linearGradient id="s-sweep" gradientUnits="userSpaceOnUse" x1="32" y1="120" x2="208" y2="120">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".38" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="s-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <circle cx="120" cy="120" r="88" fill="none" stroke="#bfe0e8" stroke-width="12" filter="url(#s-blur)" opacity=".07">
    <animate attributeName="opacity" values=".04;.14;.04" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#s-metal)" stroke-width="11"/>
  <circle cx="120" cy="120" r="93.8" fill="none" stroke="#f2f6f9" stroke-width="1" opacity=".7"/>
  <circle cx="120" cy="120" r="82.2" fill="none" stroke="#3f4852" stroke-width="1.4" opacity=".85"/>
  <circle cx="120" cy="120" r="78" fill="none" stroke="#49535d" stroke-width="2"/>

  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#s-sweep)" stroke-width="11">
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(153.7 38.7) rotate(22.5)"><path d="M0 -5.2 L3.6 0 L0 5.2 L-3.6 0 Z" fill="url(#s-stud)" stroke="#5f7b86" stroke-width=".8"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" begin="0s" repeatCount="indefinite"/></path></g>
  <g transform="translate(201.3 86.3) rotate(67.5)"><path d="M0 -5.2 L3.6 0 L0 5.2 L-3.6 0 Z" fill="url(#s-stud)" stroke="#5f7b86" stroke-width=".8"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" begin="-0.35s" repeatCount="indefinite"/></path></g>
  <g transform="translate(201.3 153.7) rotate(112.5)"><path d="M0 -5.2 L3.6 0 L0 5.2 L-3.6 0 Z" fill="url(#s-stud)" stroke="#5f7b86" stroke-width=".8"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/></path></g>
  <g transform="translate(153.7 201.3) rotate(157.5)"><path d="M0 -5.2 L3.6 0 L0 5.2 L-3.6 0 Z" fill="url(#s-stud)" stroke="#5f7b86" stroke-width=".8"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" begin="-1.05s" repeatCount="indefinite"/></path></g>
  <g transform="translate(86.3 201.3) rotate(202.5)"><path d="M0 -5.2 L3.6 0 L0 5.2 L-3.6 0 Z" fill="url(#s-stud)" stroke="#5f7b86" stroke-width=".8"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/></path></g>
  <g transform="translate(38.7 153.7) rotate(247.5)"><path d="M0 -5.2 L3.6 0 L0 5.2 L-3.6 0 Z" fill="url(#s-stud)" stroke="#5f7b86" stroke-width=".8"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" begin="-1.75s" repeatCount="indefinite"/></path></g>
  <g transform="translate(38.7 86.3) rotate(292.5)"><path d="M0 -5.2 L3.6 0 L0 5.2 L-3.6 0 Z" fill="url(#s-stud)" stroke="#5f7b86" stroke-width=".8"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" begin="-2.1s" repeatCount="indefinite"/></path></g>
  <g transform="translate(86.3 38.7) rotate(337.5)"><path d="M0 -5.2 L3.6 0 L0 5.2 L-3.6 0 Z" fill="url(#s-stud)" stroke="#5f7b86" stroke-width=".8"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" begin="-2.45s" repeatCount="indefinite"/></path></g>

  <circle cx="120" cy="120" r="101" fill="none" stroke="#cfe0e6" stroke-width="1.6" stroke-dasharray="10 7" opacity=".7">
    <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="34s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="12s" repeatCount="indefinite"/>
    <g transform="translate(120 16)">
      <g>
        <use href="#s-spark" xlink:href="#s-spark" transform="scale(6.5)" fill="#eef7f9"/>
        <animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="rotate(180 120 120)">
      <g transform="translate(120 16)">
        <g>
          <use href="#s-spark" xlink:href="#s-spark" transform="scale(4.5)" fill="#cfe0e6"/>
          <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(120 26)">
    <animate attributeName="opacity" values=".7;1;.7" dur="3.4s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <g stroke="#e6f3f6" stroke-width="1.6" stroke-linecap="round">
        <path d="M0 -8 V8"/><path d="M-6.9 -4 L6.9 4"/><path d="M-6.9 4 L6.9 -4"/>
      </g>
      <circle r="1.6" fill="#e6f3f6"/>
    </g>
  </g>

  <g>
    <rect x="52" y="202" width="136" height="28" rx="14" fill="url(#s-rib)" stroke="#4a545e" stroke-width="1.2"/>
    <rect x="55.5" y="205.5" width="129" height="21" rx="10.5" fill="none" stroke="#ffffff" stroke-width="1" opacity=".55"/>
    <g clip-path="url(#s-ribclip)">
      <path d="M0 202 L12 202 L0 230 L-12 230 Z" fill="#fff" opacity=".3">
        <animateTransform attributeName="transform" type="translate"
          values="-46 0;-46 0;246 0;246 0" keyTimes="0;.12;.55;1" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="120" y="220.5" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', Geneva, sans-serif"
          font-size="11.5" font-weight="bold" letter-spacing="2" fill="#2c3640">DAILY BONUS</text>
  </g>
</svg>