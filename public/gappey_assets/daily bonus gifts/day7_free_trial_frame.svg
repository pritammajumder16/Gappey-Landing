<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 240 240" width="240" height="240" role="img">
  <title>Day 7 reward — Sovereign Gold daily bonus frame (hollow center for avatar overlay)</title>
  <defs>
    <clipPath id="g-ribclip"><rect x="52" y="202" width="136" height="28" rx="14"/></clipPath>
    <path id="g-spark" d="M0 -1 C.14 -.32 .32 -.14 1 0 C.32 .14 .14 .32 0 1 C-.14 .32 -.32 .14 -1 0 C-.32 -.14 -.14 -.32 0 -1 Z"/>
    <linearGradient id="g-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffedbb"/><stop offset=".42" stop-color="#f2c14e"/>
      <stop offset=".8" stop-color="#9c6a1a"/><stop offset="1" stop-color="#e3b04b"/>
    </linearGradient>
    <linearGradient id="g-rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#eebe4e"/><stop offset="1" stop-color="#b3831c"/>
    </linearGradient>
    <radialGradient id="g-bead" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#fff6d8"/><stop offset=".5" stop-color="#f2c14e"/><stop offset="1" stop-color="#8a5a14"/>
    </radialGradient>
    <radialGradient id="g-gem" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#fff3cd"/><stop offset=".55" stop-color="#ffd76e"/><stop offset="1" stop-color="#b07a1c"/>
    </radialGradient>
    <linearGradient id="g-sweep" gradientUnits="userSpaceOnUse" x1="32" y1="120" x2="208" y2="120">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".38" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <circle cx="120" cy="120" r="88" fill="none" stroke="#f2c14e" stroke-width="18" filter="url(#g-blur)" opacity=".08">
    <animate attributeName="opacity" values=".05;.2;.05" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#g-metal)" stroke-width="12"/>
  <circle cx="120" cy="120" r="94.4" fill="none" stroke="#ffedbb" stroke-width="1" opacity=".8"/>
  <circle cx="120" cy="120" r="81.6" fill="none" stroke="#5c3c0c" stroke-width="1.5" opacity=".85"/>
  <circle cx="120" cy="120" r="78" fill="none" stroke="#7a5514" stroke-width="2"/>

  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#g-sweep)" stroke-width="12">
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="120" cy="120" r="98" fill="none" stroke="#ffe9b0" stroke-width="1.6" stroke-dasharray="1 9" stroke-linecap="round" opacity=".9">
    <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="20s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="30s" repeatCount="indefinite"/>
    <circle cx="226" cy="120" r="4.6" fill="url(#g-bead)"/>
    <circle cx="211.8" cy="173" r="4.6" fill="url(#g-bead)"/>
    <circle cx="173" cy="211.8" r="4.6" fill="url(#g-bead)"/>
    <circle cx="120" cy="226" r="4.6" fill="url(#g-bead)"/>
    <circle cx="67" cy="211.8" r="4.6" fill="url(#g-bead)"/>
    <circle cx="28.2" cy="173" r="4.6" fill="url(#g-bead)"/>
    <circle cx="14" cy="120" r="4.6" fill="url(#g-bead)"/>
    <circle cx="28.2" cy="67" r="4.6" fill="url(#g-bead)"/>
    <circle cx="67" cy="28.2" r="4.6" fill="url(#g-bead)"/>
    <circle cx="120" cy="14" r="4.6" fill="url(#g-bead)"/>
    <circle cx="173" cy="28.2" r="4.6" fill="url(#g-bead)"/>
    <circle cx="211.8" cy="67" r="4.6" fill="url(#g-bead)"/>
  </g>

  <g transform="translate(120 27)">
    <g transform="translate(-13 4) rotate(-18)"><path d="M0 -4.4 L3 0 L0 4.4 L-3 0 Z" fill="url(#g-gem)" stroke="#8a5a14" stroke-width=".8"/></g>
    <g transform="translate(13 4) rotate(18)"><path d="M0 -4.4 L3 0 L0 4.4 L-3 0 Z" fill="url(#g-gem)" stroke="#8a5a14" stroke-width=".8"/></g>
    <g>
      <animate attributeName="opacity" values=".8;1;.8" dur="2.6s" repeatCount="indefinite"/>
      <path d="M0 -8 L5 0 L0 8 L-5 0 Z" fill="url(#g-gem)" stroke="#8a5a14" stroke-width="1"/>
    </g>
  </g>

  <g transform="translate(198 44)"><g><animateTransform attributeName="transform" type="scale" values=".25;1;.25" dur="3.1s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="3.1s" begin="-1.2s" repeatCount="indefinite"/><use href="#g-spark" xlink:href="#g-spark" transform="scale(6.5)" fill="#ffd76e"/></g></g>
  <g transform="translate(206 194)"><g><animateTransform attributeName="transform" type="scale" values=".25;1;.25" dur="2.9s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="2.9s" begin="-0.6s" repeatCount="indefinite"/><use href="#g-spark" xlink:href="#g-spark" transform="scale(9)" fill="#fff3cd"/></g></g>
  <g transform="translate(52 182)"><g><animateTransform attributeName="transform" type="scale" values=".25;1;.25" dur="3.4s" begin="-2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="3.4s" begin="-2.1s" repeatCount="indefinite"/><use href="#g-spark" xlink:href="#g-spark" transform="scale(6)" fill="#ffd76e"/></g></g>
  <g transform="translate(150 10)"><g><animateTransform attributeName="transform" type="scale" values=".25;1;.25" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/><use href="#g-spark" xlink:href="#g-spark" transform="scale(5.5)" fill="#fff3cd"/></g></g>
  <g transform="translate(70 20)"><g><animateTransform attributeName="transform" type="scale" values=".25;1;.25" dur="2.8s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="2.8s" begin="-0.9s" repeatCount="indefinite"/><use href="#g-spark" xlink:href="#g-spark" transform="scale(6)" fill="#fff3cd"/></g></g>

  <!-- chat bubble sticker: pops in, typing dots, pops out -->
  <g transform="translate(50 58)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0;0;1.18;1;1;0;0" keyTimes="0;.03;.1;.16;.8;.88;1"
        calcMode="spline" keySplines=".3 0 .3 1;.3 0 .3 1;.3 0 .3 1;.3 0 .3 1;.3 0 .3 1;.3 0 .3 1"
        dur="8s" repeatCount="indefinite"/>
      <path d="M -13 -16 H 13 A 9 9 0 0 1 22 -7 V 5 A 9 9 0 0 1 13 14 H 9 L 4 24 L -3 14 H -13 A 9 9 0 0 1 -22 5 V -7 A 9 9 0 0 1 -13 -16 Z"
            fill="#fff6dc" stroke="#8a5a14" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="-9" cy="-1" r="2.7" fill="#b07a1c"><animate attributeName="opacity" values=".25;1;.25" dur="1.35s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="-1" r="2.7" fill="#b07a1c"><animate attributeName="opacity" values=".25;1;.25" dur="1.35s" begin=".45s" repeatCount="indefinite"/></circle>
      <circle cx="9" cy="-1" r="2.7" fill="#b07a1c"><animate attributeName="opacity" values=".25;1;.25" dur="1.35s" begin=".9s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g>
    <rect x="52" y="202" width="136" height="28" rx="14" fill="url(#g-rib)" stroke="#7a5514" stroke-width="1.2"/>
    <rect x="55.5" y="205.5" width="129" height="21" rx="10.5" fill="none" stroke="#fff6d8" stroke-width="1" opacity=".6"/>
    <g clip-path="url(#g-ribclip)">
      <path d="M0 202 L12 202 L0 230 L-12 230 Z" fill="#fff" opacity=".3">
        <animateTransform attributeName="transform" type="translate"
          values="-46 0;-46 0;246 0;246 0" keyTimes="0;.12;.55;1" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="120" y="220.5" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', Geneva, sans-serif"
          font-size="11.5" font-weight="bold" letter-spacing="2" fill="#3a2606">DAILY BONUS</text>
  </g>
</svg>