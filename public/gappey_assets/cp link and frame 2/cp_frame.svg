<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <title>CP Couple Ring Frame</title>
  <defs>
    <radialGradient id="lGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ff6fa5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff6fa5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9ea"/>
      <stop offset="0.5" stop-color="#ff8fb8"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#e8a13a"/>
    </linearGradient>
    <path id="hrt" d="M0 4.5 C -4 1 -8 -2 -8 -6 C -8 -9.5 -4.8 -11 -2.2 -9.6 C -1 -9 -0.4 -8 0 -7 C 0.4 -8 1 -9 2.2 -9.6 C 4.8 -11 8 -9.5 8 -6 C 8 -2 4 1 0 4.5 Z"/>
    <path id="gemS" d="M0 -5.5 L4.2 -2 L2.6 4.5 L-2.6 4.5 L-4.2 -2 Z"/>
    <path id="stS" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#fff8e1"/>
    <path id="petalFly" d="M0 -5 C 4.5 -3 5.5 2 3 5.5 C 1 7.5 -2.5 6 -3.5 3 C -4.3 0 -2.5 -3.5 0 -5 Z"/>
    <g id="bfly">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;0.3 1;1 1" dur="0.4s" repeatCount="indefinite"/>
        <ellipse cx="-5.5" cy="-1" rx="6" ry="3.6" fill="#ff9ec4" stroke="#c2185b" stroke-width="0.6" transform="rotate(-28)"/>
        <ellipse cx="5.5" cy="-1" rx="6" ry="3.6" fill="#ffd1e3" stroke="#c2185b" stroke-width="0.6" transform="rotate(28)"/>
      </g>
      <ellipse cx="0" cy="0" rx="1.1" ry="4.2" fill="#4a0e2e"/>
    </g>
  </defs>

  <!-- breathing glow -->
  <circle cx="130" cy="130" r="127" fill="url(#lGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- base rings -->
  <circle cx="130" cy="130" r="100" fill="none" stroke="#2d0a1e" stroke-width="26"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="url(#rgold)" stroke-width="14"/>
  <circle cx="130" cy="130" r="113" fill="none" stroke="url(#goldG)" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="87" fill="none" stroke="#c2185b" stroke-width="2"/>
  <circle cx="130" cy="130" r="90" fill="none" stroke="#ffd1e3" stroke-width="1.5">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="130" r="100" fill="none" stroke="url(#goldG)" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#7a1040" stroke-width="4" stroke-dasharray="2 11" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating gem collar -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="22s" repeatCount="indefinite"/>
    <g>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      <use xlink:href="#gemS" transform="rotate(0 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(60 130 130) translate(130 30)" fill="#ff6fa5" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(120 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(180 130 130) translate(130 30)" fill="#ff6fa5" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(240 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(300 130 130) translate(130 30)" fill="#ff6fa5" stroke="#ffd54f" stroke-width="1"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.3s" begin="-0.6s" repeatCount="indefinite"/>
      <use xlink:href="#gemS" transform="rotate(30 130 130) translate(130 30) scale(0.8)" fill="#ffd1e3" stroke="#c2185b" stroke-width="0.8"/>
      <use xlink:href="#gemS" transform="rotate(90 130 130) translate(130 30) scale(0.8)" fill="#ffe082" stroke="#c2185b" stroke-width="0.8"/>
      <use xlink:href="#gemS" transform="rotate(150 130 130) translate(130 30) scale(0.8)" fill="#ffd1e3" stroke="#c2185b" stroke-width="0.8"/>
      <use xlink:href="#gemS" transform="rotate(210 130 130) translate(130 30) scale(0.8)" fill="#ffe082" stroke="#c2185b" stroke-width="0.8"/>
      <use xlink:href="#gemS" transform="rotate(270 130 130) translate(130 30) scale(0.8)" fill="#ffd1e3" stroke="#c2185b" stroke-width="0.8"/>
      <use xlink:href="#gemS" transform="rotate(330 130 130) translate(130 30) scale(0.8)" fill="#ffe082" stroke="#c2185b" stroke-width="0.8"/>
    </g>
  </g>

  <!-- counter-rotating pearl studs -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="16s" repeatCount="indefinite"/>
    <circle cx="130" cy="18" r="2.4" fill="#fdf6e3">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="18" r="2.4" fill="#fdf6e3" transform="rotate(45 130 130)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="-0.17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="18" r="2.4" fill="#fdf6e3" transform="rotate(90 130 130)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="-0.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="18" r="2.4" fill="#fdf6e3" transform="rotate(135 130 130)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="-0.52s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="18" r="2.4" fill="#fdf6e3" transform="rotate(180 130 130)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="-0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="18" r="2.4" fill="#fdf6e3" transform="rotate(225 130 130)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="-0.87s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="18" r="2.4" fill="#fdf6e3" transform="rotate(270 130 130)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="-1.05s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="18" r="2.4" fill="#fdf6e3" transform="rotate(315 130 130)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="-1.22s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- triple-heart crown at the top of the band -->
  <use xlink:href="#hrt" transform="translate(115 27) scale(0.85)" fill="#ff8fb8" stroke="#fff8e1" stroke-width="0.7">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#hrt" transform="translate(130 22) scale(1.05)" fill="#e91e63" stroke="#ffd1e3" stroke-width="0.8">
    <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" begin="-0.55s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#hrt" transform="translate(145 27) scale(0.85)" fill="#ff8fb8" stroke="#fff8e1" stroke-width="0.7">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
  </use>

  <!-- orbiting butterflies -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="21s" repeatCount="indefinite"/>
    <g transform="translate(130 8)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="0.7s" repeatCount="indefinite"/>
        <use xlink:href="#bfly" transform="scale(1.05)"/>
      </g>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="26s" begin="-8s" repeatCount="indefinite"/>
    <g transform="translate(130 13)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="7;-7;7" dur="0.6s" repeatCount="indefinite"/>
        <use xlink:href="#bfly" transform="scale(-0.9,0.9)"/>
      </g>
    </g>
  </g>

  <!-- sparkles on the band -->
  <use xlink:href="#stS" transform="translate(212 84) scale(0.75)">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.3s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(48 84) scale(0.7)">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(48 178) scale(0.7)">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="1.5s" begin="-0.8s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(212 178) scale(0.75)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-1s" repeatCount="indefinite"/>
  </use>

  <!-- falling petals (edge lanes only) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="38 -14;50 120;28 276" keyTimes="0;0.5;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ff9ec4" transform="scale(1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="222 -14;210 124;234 276" keyTimes="0;0.5;1" dur="9s" begin="-3s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ffd1e3" transform="scale(0.9)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- rising rose dust (far edges only) -->
  <g fill="#ffd1e3">
    <circle cx="22" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;44" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="22;30;16;22" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="238" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;40" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="238;230;244;238" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>