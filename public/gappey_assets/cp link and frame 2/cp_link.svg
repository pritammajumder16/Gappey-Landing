<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="100" viewBox="0 0 320 100" preserveAspectRatio="none">
  <title>CP Connection Link</title>
  <defs>
    <linearGradient id="rgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9ea"/>
      <stop offset="0.5" stop-color="#ff8fb8"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#e8a13a"/>
    </linearGradient>
    <radialGradient id="lGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8fb8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff8fb8" stop-opacity="0"/>
    </radialGradient>
    <path id="hrt" d="M0 4.5 C -4 1 -8 -2 -8 -6 C -8 -9.5 -4.8 -11 -2.2 -9.6 C -1 -9 -0.4 -8 0 -7 C 0.4 -8 1 -9 2.2 -9.6 C 4.8 -11 8 -9.5 8 -6 C 8 -2 4 1 0 4.5 Z"/>
    <path id="stS" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#fff8e1"/>
  </defs>

  <!-- soft glow along the connection -->
  <ellipse cx="160" cy="50" rx="150" ry="26" fill="url(#lGlow)" opacity="0.55">
    <animate attributeName="opacity" values="0.4;0.75;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating ambient hearts (gentle bob, no lines) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.1s" repeatCount="indefinite"/>
    <use xlink:href="#hrt" transform="translate(52 44) scale(0.55)" fill="#ff8fb8">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.1s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    <use xlink:href="#hrt" transform="translate(104 56) scale(0.5)" fill="#ffd1e3">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.2s" begin="-1s" repeatCount="indefinite"/>
    <use xlink:href="#hrt" transform="translate(216 55) scale(0.5)" fill="#ffd1e3">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.2s" begin="-1s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="2s" begin="-1.4s" repeatCount="indefinite"/>
    <use xlink:href="#hrt" transform="translate(268 43) scale(0.55)" fill="#ff8fb8">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="2s" begin="-1.4s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.3s" begin="-0.3s" repeatCount="indefinite"/>
    <use xlink:href="#hrt" transform="translate(78 58) scale(0.5)" fill="#ffd1e3">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="2.3s" begin="-0.3s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="2.5s" begin="-1.1s" repeatCount="indefinite"/>
    <use xlink:href="#hrt" transform="translate(242 42) scale(0.5)" fill="#ff8fb8">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.5s" begin="-1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- hearts travelling inward from each partner -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.12;0.85;1" dur="3s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="8 50;84 41;136 50" keyTimes="0;0.5;1" dur="3s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#hrt" fill="#ff6fa5" transform="scale(0.9)"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.12;0.85;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="312 50;236 41;184 50" keyTimes="0;0.5;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    <use xlink:href="#hrt" fill="#ffd1e3" transform="scale(0.9)"/>
  </g>
  <!-- spark trail behind each traveller -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.12;0.85;1" dur="3s" begin="-0.25s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="8 54;84 46;136 54" keyTimes="0;0.5;1" dur="3s" begin="-0.25s" repeatCount="indefinite"/>
    <circle r="1.8" fill="#ffe082"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.12;0.85;1" dur="3s" begin="-1.75s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="312 46;236 54;184 46" keyTimes="0;0.5;1" dur="3s" begin="-1.75s" repeatCount="indefinite"/>
    <circle r="1.8" fill="#ffe082"/>
  </g>

  <!-- ============ CENTER EMBLEM: interlocked rings + heart-lock ============ -->
  <g transform="translate(160 50)">
    <!-- arrival flash (every 1.5s = each heart's landing) -->
    <circle r="18" fill="none" stroke="#ffd1e3" stroke-width="2" opacity="0">
      <animate attributeName="r" values="16;30" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="url(#lGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- interlocked wedding bands -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.07;1" dur="1.5s" repeatCount="indefinite"/>
      <circle cx="-11" cy="0" r="14" fill="none" stroke="url(#goldG)" stroke-width="3.2"/>
      <circle cx="11" cy="0" r="14" fill="none" stroke="url(#goldG)" stroke-width="3.2"/>
      <path d="M-11 14 A 14 14 0 0 1 -11 -14" fill="none" stroke="url(#goldG)" stroke-width="3.2"/>
      <circle cx="-11" cy="-14" r="1.6" fill="#ffe082"/>
      <circle cx="11" cy="-14" r="1.6" fill="#ffe082"/>
      <!-- heart-lock over the bands -->
      <path d="M-4.5 -13 L-4.5 -17 A 4.5 4.5 0 0 1 4.5 -17 L4.5 -13" fill="none" stroke="#ffe082" stroke-width="2" stroke-linecap="round"/>
      <use xlink:href="#hrt" transform="scale(1.45)" fill="url(#rgold)" stroke="#8a1038" stroke-width="0.7"/>
      <circle cx="0" cy="-3.5" r="1.5" fill="#4a0e2e"/>
      <path d="M-1.4 -2.5 L1.4 -2.5 L2.2 3 L-2.2 3 Z" fill="#4a0e2e"/>
    </g>

    <!-- sparkles -->
    <use xlink:href="#stS" transform="translate(-24 -18) scale(0.55)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="translate(24 16) scale(0.5)">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.7s" begin="-0.6s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="translate(0 -26) scale(0.45)">
      <animate attributeName="opacity" values="1;0.1;1" dur="1.2s" begin="-0.3s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>