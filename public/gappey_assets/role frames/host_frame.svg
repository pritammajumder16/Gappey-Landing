<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <linearGradient id="hsRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9966"/><stop offset=".5" stop-color="#ff5e7e"/><stop offset="1" stop-color="#e6335a"/>
    </linearGradient>
    <filter id="hsSh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>

  <g fill="none" stroke="#ff5e7e">
    <circle cx="75" cy="75" r="72" stroke-width="2.5" stroke-opacity=".25">
      <animate attributeName="stroke-opacity" values=".1;.4;.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="75" r="74" stroke-width="2" stroke-opacity=".12">
      <animate attributeName="stroke-opacity" values=".05;.22;.05" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="75" cy="75" r="64" fill="none" stroke="#ffd0d8" stroke-width="2" stroke-dasharray="3 8" opacity=".8">
    <animateTransform attributeName="transform" type="rotate" from="360 75 75" to="0 75 75" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="57" fill="none" stroke="url(#hsRing)" stroke-width="6"/>
  <circle cx="75" cy="75" r="50" fill="none" stroke="#ffe3e9" stroke-width="1" opacity=".5"/>

  <circle cx="75" cy="13" r="12.5" fill="url(#hsRing)" stroke="#7a1030" stroke-width="1.5"/>
  <rect x="71.5" y="6.5" width="7" height="11" rx="3.5" fill="#ffffff"/>
  <path d="M67.5 13.5 a7.5 7.5 0 0 0 15 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="20.8" x2="75" y2="23.2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="71.5" y1="23.2" x2="78.5" y2="23.2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <g fill="none" stroke="#ff8fa3" stroke-width="2" stroke-linecap="round">
    <path d="M59 20 a9 9 0 0 1 0 -13"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M55 22 a12 12 0 0 1 0 -17"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="-.7s" repeatCount="indefinite"/></path>
    <path d="M91 20 a9 9 0 0 0 0 -13"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="-.35s" repeatCount="indefinite"/></path>
    <path d="M95 22 a12 12 0 0 0 0 -17"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="-1.05s" repeatCount="indefinite"/></path>
  </g>

  <g filter="url(#hsSh)">
    <rect x="47" y="123" width="56" height="19" rx="9.5" fill="url(#hsRing)" stroke="#7a1030" stroke-width="1"/>
    <text x="75" y="136.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="900" fill="#ffffff" letter-spacing="2.5">HOST</text>
