<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <linearGradient id="phRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2ff7"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#6a11cb"/>
    </linearGradient>
    <linearGradient id="phGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f6a723"/>
    </linearGradient>
    <filter id="phSh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>

  <g fill="none" stroke="#a259ff">
    <circle cx="75" cy="75" r="72" stroke-width="2.5" stroke-opacity=".25">
      <animate attributeName="stroke-opacity" values=".1;.4;.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="75" r="74" stroke-width="2" stroke-opacity=".12">
      <animate attributeName="stroke-opacity" values=".05;.22;.05" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="75" cy="75" r="66" fill="none" stroke="#b57bff" stroke-width="2.5" stroke-dasharray="14 8" opacity=".85">
    <animateTransform attributeName="transform" type="rotate" from="360 75 75" to="0 75 75" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="57" fill="none" stroke="url(#phRing)" stroke-width="6"/>
  <circle cx="75" cy="75" r="57" fill="none" stroke="#d8b4fe" stroke-width="1">
    <animate attributeName="opacity" values=".2;.85;.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="50" fill="none" stroke="#d8b4fe" stroke-width="1" opacity=".5"/>

  <g transform="translate(75,9)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1.5;0 0" dur="2.2s" repeatCount="indefinite"/>
      <path d="M-10 5 L-10 -3 L-5 .5 L0 -7 L5 .5 L10 -3 L10 5 Z" fill="url(#phGold)" stroke="#7a4a00" stroke-width="1"/>
      <circle cx="-5" cy="2.2" r="1.2" fill="#ff5e7e"/><circle cx="0" cy="2.8" r="1.2" fill="#4dd0e1"/><circle cx="5" cy="2.2" r="1.2" fill="#ff5e7e"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(132.2,42)"><path d="M0 -6 L4.5 0 L0 6 L-4.5 0 Z" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="1"/><line x1="0" y1="-6" x2="0" y2="6" stroke="#8b5cf6" stroke-width=".8" opacity=".6"/></g>
    <g transform="translate(75,141)"><path d="M0 -6 L4.5 0 L0 6 L-4.5 0 Z" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="1"/><line x1="0" y1="-6" x2="0" y2="6" stroke="#8b5cf6" stroke-width=".8" opacity=".6"/></g>
    <g transform="translate(17.8,42)"><path d="M0 -6 L4.5 0 L0 6 L-4.5 0 Z" fill="#e9d5ff" stroke="#8b5cf6" stroke-width="1"/><line x1="0" y1="-6" x2="0" y2="6" stroke="#8b5cf6" stroke-width=".8" opacity=".6"/></g>
  </g>

  <g filter="url(#phSh)">
    <rect x="36" y="123" width="78" height="19" rx="9.5" fill="url(#phRing)" stroke="#3b0764" stroke-width="1"/>
    <text x="75" y="136.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.5">TOP HOST</text>
  </g>
</svg>