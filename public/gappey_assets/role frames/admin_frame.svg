<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <linearGradient id="adBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ff"/><stop offset=".5" stop-color="#56ccf2"/><stop offset="1" stop-color="#1b6ef3"/>
    </linearGradient>
    <linearGradient id="adRibbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8bff"/><stop offset="1" stop-color="#1257d0"/>
    </linearGradient>
    <linearGradient id="adSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="adSh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>

  <!-- outer halo (stroke only — never touches the center) -->
  <g fill="none" stroke="#2f80ff">
    <circle cx="75" cy="75" r="72" stroke-width="2.5" stroke-opacity=".25">
      <animate attributeName="stroke-opacity" values=".1;.4;.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="75" r="74" stroke-width="2" stroke-opacity=".12">
      <animate attributeName="stroke-opacity" values=".05;.22;.05" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="75" cy="75" r="70" fill="none" stroke="#9cc7ff" stroke-width="1" stroke-dasharray="4 10" opacity=".5">
    <animateTransform attributeName="transform" type="rotate" from="360 75 75" to="0 75 75" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="66" fill="none" stroke="#9cc7ff" stroke-width="3" stroke-dasharray="26 14">
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="62" fill="none" stroke="#ffd166" stroke-width="1.2" opacity=".75"/>

  <circle cx="75" cy="75" r="57" fill="none" stroke="url(#adBlue)" stroke-width="7"/>
  <circle cx="75" cy="75" r="57" fill="none" stroke="url(#adSweep)" stroke-width="7" stroke-dasharray="70 288" stroke-linecap="round" opacity=".85">
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="50" fill="none" stroke="#cfe4ff" stroke-width="1" opacity=".5"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="7s" repeatCount="indefinite"/>
    <circle cx="75" cy="9" r="3" fill="#ffffff"/>
    <circle cx="75" cy="141" r="2.2" fill="#bfe0ff" opacity=".8"/>
  </g>

  <path transform="translate(30,32) scale(.8)" d="M0 -5 Q1.2 -1.2 5 0 Q1.2 1.2 0 5 Q-1.2 1.2 -5 0 Q-1.2 -1.2 0 -5 Z" fill="#dff0ff">
    <animate attributeName="opacity" values="1;.1;1" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path transform="translate(121,29) scale(.6)" d="M0 -5 Q1.2 -1.2 5 0 Q1.2 1.2 0 5 Q-1.2 1.2 -5 0 Q-1.2 -1.2 0 -5 Z" fill="#dff0ff">
    <animate attributeName="opacity" values=".1;1;.1" dur="2.3s" repeatCount="indefinite"/>
  </path>
  <path transform="translate(98,10) scale(.55)" d="M0 -5 Q1.2 -1.2 5 0 Q1.2 1.2 0 5 Q-1.2 1.2 -5 0 Q-1.2 -1.2 0 -5 Z" fill="#ffd166">
    <animate attributeName="opacity" values=".9;.1;.9" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- rotating seal rosette + self-drawing verified check -->
  <g filter="url(#adSh)">
    <g fill="#7db4ff">
      <animateTransform attributeName="transform" type="rotate" from="0 75 16" to="360 75 16" dur="24s" repeatCount="indefinite"/>
      <circle cx="86.5" cy="16" r="3.5"/><circle cx="85" cy="21.8" r="3.5"/><circle cx="80.75" cy="26" r="3.5"/>
      <circle cx="75" cy="27.5" r="3.5"/><circle cx="69.25" cy="26" r="3.5"/><circle cx="65" cy="21.8" r="3.5"/>
      <circle cx="63.5" cy="16" r="3.5"/><circle cx="65" cy="10.2" r="3.5"/><circle cx="69.25" cy="6" r="3.5"/>
      <circle cx="75" cy="4.5" r="3.5"/><circle cx="80.75" cy="6" r="3.5"/><circle cx="85" cy="10.2" r="3.5"/>
    </g>
    <circle cx="75" cy="16" r="15.5" fill="none" stroke="#ffd166" stroke-width="1.5"/>
    <circle cx="75" cy="16" r="11.5" fill="url(#adBlue)" stroke="#0b3fa0" stroke-width="1.5"/>
    <path d="M70 16.5 L74 20.5 L80.5 11.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100">
      <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;.45;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ribbon banner -->
  <g filter="url(#adSh)">
    <path d="M16 125 L34 125 L34 142 L16 142 L23 133.5 Z" fill="#0b3fa0"/>
    <path d="M134 125 L116 125 L116 142 L134 142 L127 133.5 Z" fill="#0b3fa0"/>
    <rect x="30" y="121" width="90" height="20" rx="3" fill="url(#adRibbon)" stroke="#0b3fa0" stroke-width="1.5"/>
    <text x="75" y="135.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="4">ADMIN</text>
  </g>
</svg>