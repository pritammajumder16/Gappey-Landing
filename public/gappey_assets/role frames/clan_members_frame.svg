<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <linearGradient id="clGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ecc71"/><stop offset=".5" stop-color="#a8e063"/><stop offset="1" stop-color="#159957"/>
    </linearGradient>
    <filter id="clSh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>

  <g fill="none" stroke="#2ecc71">
    <circle cx="75" cy="75" r="72" stroke-width="2.5" stroke-opacity=".25">
      <animate attributeName="stroke-opacity" values=".1;.4;.1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="75" r="74" stroke-width="2" stroke-opacity=".12">
      <animate attributeName="stroke-opacity" values=".05;.22;.05" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="75" cy="75" r="65" fill="none" stroke="#baf7c4" stroke-width="2.5" stroke-dasharray="1.5 8" stroke-linecap="round" opacity=".85">
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="57" fill="none" stroke="url(#clGreen)" stroke-width="6"/>
  <circle cx="75" cy="75" r="50" fill="none" stroke="#d9ffe3" stroke-width="1" opacity=".5"/>

  <circle cx="75" cy="13" r="12" fill="#14532d" stroke="url(#clGreen)" stroke-width="2"/>
  <g stroke="#eafbe7" stroke-width="2" stroke-linecap="round">
    <line x1="69.5" y1="7.5" x2="80.5" y2="18.5"/>
    <line x1="80.5" y1="7.5" x2="69.5" y2="18.5"/>
  </g>
  <circle cx="75" cy="13" r="1.6" fill="#ffd166"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 75 75" to="0 75 75" dur="11s" repeatCount="indefinite"/>
    <g transform="translate(75,8)">
      <path d="M0 -5.5 C4.5 -5.5 5.5 .5 0 5.5 C-5.5 .5 -4.5 -5.5 0 -5.5 Z" fill="#8ef0a5" stroke="#1c7c3c" stroke-width="1"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#1c7c3c" stroke-width=".8"/>
    </g>
  </g>

  <g filter="url(#clSh)">
    <rect x="47" y="123" width="56" height="19" rx="9.5" fill="url(#clGreen)" stroke="#0b4a24" stroke-width="1.5"/>
    <text x="75" y="136.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="900" fill="#ffffff" letter-spacing="2.5">CLAN</text>
  </g>
</svg>