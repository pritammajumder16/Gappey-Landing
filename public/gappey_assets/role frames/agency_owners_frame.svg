<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <linearGradient id="agRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#f4a300"/>
    </linearGradient>
    <filter id="agSh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>

  <g fill="none" stroke="#ffd166">
    <circle cx="75" cy="75" r="72" stroke-width="2.5" stroke-opacity=".25">
      <animate attributeName="stroke-opacity" values=".1;.4;.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="75" r="74" stroke-width="2" stroke-opacity=".12">
      <animate attributeName="stroke-opacity" values=".05;.22;.05" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="75" cy="75" r="67" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="1.5 9" stroke-linecap="round" opacity=".9">
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="57" fill="none" stroke="url(#agRing)" stroke-width="6"/>
  <circle cx="75" cy="75" r="50" fill="none" stroke="#ffe9a8" stroke-width="1" opacity=".55"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 75 75" to="0 75 75" dur="9s" repeatCount="indefinite"/>
    <path transform="translate(75,9)" d="M0 -6 Q1.4 -1.4 6 0 Q1.4 1.4 0 6 Q-1.4 1.4 -6 0 Q-1.4 -1.4 0 -6 Z" fill="#fff8dc">
      <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="24" cy="42" r="2" fill="#ffe9a8"><animate attributeName="opacity" values="1;.1;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="126" cy="46" r="1.7" fill="#ffe9a8"><animate attributeName="opacity" values=".1;1;.1" dur="2.3s" repeatCount="indefinite"/></circle>

  <g filter="url(#agSh)">
    <rect x="42" y="123" width="66" height="19" rx="9.5" fill="url(#agRing)" stroke="#8a5a00" stroke-width="1"/>
    <path transform="translate(51.5,132.5) scale(.5)" d="M0 -6 Q1.4 -1.4 6 0 Q1.4 1.4 0 6 Q-1.4 1.4 -6 0 Q-1.4 -1.4 0 -6 Z" fill="#8a5a00"/>
    <text x="77.5" y="136.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="900" fill="#5a3a00" letter-spacing="1.5">AGENCY</text>
    <path transform="translate(103.5,132.5) scale(.5)" d="M0 -6 Q1.4 -1.4 6 0 Q1.4 1.4 0 6 Q-1.4 1.4 -6 0 Q-1.4 -1.4 0 -6 Z" fill="#8a5a00"/>
  </g>
</svg>