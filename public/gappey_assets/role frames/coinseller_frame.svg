<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <linearGradient id="csGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d5"/><stop offset=".35" stop-color="#ffd700"/><stop offset=".7" stop-color="#b8860b"/><stop offset="1" stop-color="#ffe680"/>
    </linearGradient>
    <linearGradient id="csSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="csSh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>

  <g fill="none" stroke="#ffd700">
    <circle cx="75" cy="75" r="72" stroke-width="2.5" stroke-opacity=".25">
      <animate attributeName="stroke-opacity" values=".1;.4;.1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="75" r="74" stroke-width="2" stroke-opacity=".12">
      <animate attributeName="stroke-opacity" values=".05;.22;.05" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="75" cy="75" r="70" fill="none" stroke="#fff2b0" stroke-width="2" stroke-dasharray="80 360" stroke-linecap="round" opacity=".6">
    <animateTransform attributeName="transform" type="rotate" from="360 75 75" to="0 75 75" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="66" fill="none" stroke="#ffd700" stroke-width="1.5" opacity=".75"/>
  <circle cx="75" cy="75" r="66" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="61" fill="none" stroke="url(#csSweep)" stroke-width="5" stroke-dasharray="60 323" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="57" fill="none" stroke="url(#csGold)" stroke-width="7"/>
  <circle cx="75" cy="75" r="49" fill="none" stroke="#6b4a00" stroke-width="2" opacity=".8"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="9s" repeatCount="indefinite"/>
    <g transform="translate(75,8)">
      <g><animateTransform attributeName="transform" type="rotate" values="-14;14;-14" dur="1.6s" repeatCount="indefinite"/>
        <circle r="7.5" fill="url(#csGold)" stroke="#8a5a00" stroke-width="1.5"/><circle r="5" fill="none" stroke="#8a5a00" stroke-width="1" opacity=".7"/>
        <text y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#7a5200">$</text>
      </g>
    </g>
    <g transform="translate(133,108.5)">
      <g><animateTransform attributeName="transform" type="rotate" values="12;-12;12" dur="1.9s" repeatCount="indefinite"/>
        <circle r="6.5" fill="url(#csGold)" stroke="#8a5a00" stroke-width="1.5"/><circle r="4.2" fill="none" stroke="#8a5a00" stroke-width="1" opacity=".7"/>
        <text y="2.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#7a5200">$</text>
      </g>
    </g>
    <g transform="translate(17,108.5)">
      <g><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="2.2s" repeatCount="indefinite"/>
        <circle r="6.5" fill="url(#csGold)" stroke="#8a5a00" stroke-width="1.5"/><circle r="4.2" fill="none" stroke="#8a5a00" stroke-width="1" opacity=".7"/>
        <text y="2.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#7a5200">$</text>
      </g>
    </g>
  </g>

  <g transform="translate(14,58)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
      <circle r="3" fill="#ffd700" stroke="#8a5a00" stroke-width=".8"/>
    </g>
  </g>
  <g transform="translate(136,58)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14" dur="3.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="-1.2s" repeatCount="indefinite"/>
      <circle r="2.5" fill="#ffd700" stroke="#8a5a00" stroke-width=".8"/>
    </g>
  </g>

  <path transform="translate(30,32)" d="M0 -5 Q1.2 -1.2 5 0 Q1.2 1.2 0 5 Q-1.2 1.2 -5 0 Q-1.2 -1.2 0 -5 Z" fill="#fff8dc">
    <animate attributeName="opacity" values="1;.15;1" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path transform="translate(121,30)" d="M0 -5 Q1.2 -1.2 5 0 Q1.2 1.2 0 5 Q-1.2 1.2 -5 0 Q-1.2 -1.2 0 -5 Z" fill="#fff8dc">
    <animate attributeName="opacity" values=".15;1;.15" dur="1.9s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#csSh)">
    <rect x="30" y="123" width="90" height="20" rx="10" fill="url(#csGold)" stroke="#8a5a00" stroke-width="1.5"/>
    <circle cx="45" cy="133" r="6.2" fill="#b8860b" stroke="#6b4a00" stroke-width="1"/>
    <text x="45" y="136.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="900" fill="#ffe9a8">$</text>
    <text x="80.5" y="136.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#5a3a00" letter-spacing=".5">COIN SELLER</text>
  </g>
</svg>