<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" role="img" aria-labelledby="gb30t" style="overflow:visible">
  <title id="gb30t">Gifter Lv.30 chat bubble</title>
  <defs>
    <linearGradient id="g30bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E40AF"/><stop offset=".18" stop-color="#2563EB"/><stop offset=".5" stop-color="#3B82F6"/><stop offset=".82" stop-color="#2563EB"/><stop offset="1" stop-color="#1E40AF"/></linearGradient>
    <linearGradient id="g30gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity=".4"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <clipPath id="g30cp"><rect width="100%" height="64" rx="16"/></clipPath>
    <filter id="g30bl" x="-40%" y="-150%" width="180%" height="400%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="g30sp" d="M0 -5 Q1 -1 5 0 Q1 1 0 5 Q-1 1 -5 0 Q-1 -1 0 -5 Z"/>
  </defs>
  <style><![CDATA[
.aura{transform-box:view-box;transform-origin:50% 50%;animation:breathe 3.6s ease-in-out infinite alternate}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.2s ease-in-out infinite}
.tw2{animation-delay:-1.1s}.tw3{animation-delay:-.7s}.tw4{animation-delay:-1.6s}
@keyframes breathe{from{transform:scale(.97);opacity:.7}to{transform:scale(1.06);opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.aura,.tw{animation:none}}
  ]]></style>
  <rect class="aura" width="100%" height="64" rx="16" fill="#3B82F6" opacity=".55" filter="url(#g30bl)"/>
  <rect width="100%" height="64" rx="16" fill="url(#g30bg)" stroke="#93C5FD" stroke-width="1.5"/>
  <g clip-path="url(#g30cp)">
    <ellipse cx="50%" cy="8" rx="40%" ry="9" fill="url(#g30gl)" opacity=".55"/>
    <use href="#g30sp" x="22%" y="12" class="tw" fill="#BFDBFE"/>
    <use href="#g30sp" x="78%" y="12" class="tw tw2" fill="#BFDBFE"/>
    <use href="#g30sp" x="40%" y="52" class="tw tw3" fill="#93C5FD"/>
    <use href="#g30sp" x="60%" y="52" class="tw tw4" fill="#93C5FD"/>
  </g>
</svg>