<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <linearGradient id="enGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#f4a300"/>
    </linearGradient>
    <linearGradient id="enBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="enSh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>

  <!-- ══════════ BIKE: rides in, tosses the gift at center, rides out ══════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-170 96;75 96;320 96" keyTimes="0;.5;1"
      calcMode="spline" keySplines=".35 0 .55 1;.45 0 .8 .6" dur="2.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;.88;1" dur="2.2s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur=".45s" repeatCount="indefinite"/>

      <circle cx="-21" cy="-5" r="1" fill="#cfd8dc" opacity="0">
        <animate attributeName="r" values="1;3.2" dur=".8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur=".8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="-21;-26" dur=".8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-24" cy="-7" r="1" fill="#cfd8dc" opacity="0">
        <animate attributeName="r" values="1;3" dur=".8s" begin=".4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur=".8s" begin=".4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="-24;-29" dur=".8s" begin=".4s" repeatCount="indefinite"/>
      </circle>

      <g stroke="#9be8ef" stroke-width="1.2" stroke-linecap="round">
        <line x1="-26" y1="-9" x2="-32" y2="-9"><animate attributeName="opacity" values="0;1;0" dur=".35s" repeatCount="indefinite"/></line>
        <line x1="-27" y1="-2" x2="-34" y2="-2"><animate attributeName="opacity" values="0;1;0" dur=".35s" begin=".12s" repeatCount="indefinite"/></line>
        <line x1="-25" y1="-15" x2="-30" y2="-15"><animate attributeName="opacity" values="0;1;0" dur=".35s" begin=".24s" repeatCount="indefinite"/></line>
      </g>

      <path d="M-5.5 -9.5 L-1.5 -17 L1.5 -17 L3.5 -10 Z" fill="#14232b"/>
      <line x1="0.5" y1="-15.5" x2="7" y2="-11.5" stroke="#14232b" stroke-width="2" stroke-linecap="round"/>
      <line x1="-2" y1="-8.5" x2="-7.5" y2="-4" stroke="#14232b" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="1.5" cy="-19" r="3.4" fill="#0fc2d8" stroke="#065f70" stroke-width="1"/>
      <path d="M3.4 -20.6 A3.4 3.4 0 0 1 4.9 -17.8 L2.8 -18.4 Z" fill="#14232b"/>

      <rect x="-17" y="-6" width="8" height="2.5" rx="1" fill="#5c7a89"/>
      <line x1="13" y1="0" x2="9" y2="-11" stroke="#5c7a89" stroke-width="2" stroke-linecap="round"/>
      <line x1="9" y1="-11" x2="7" y2="-13.5" stroke="#14232b" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="7" cy="-13.5" r="1" fill="#ff7585"/>
      <path d="M-14 -7 L-3 -8.5 L4 -6 L8 -6 L13 -1.5 L13 .5 L9.5 .5 L4 -2.5 L-5 -2.5 Q-14 -2.5 -14 -7 Z" fill="url(#enBody)" stroke="#063a44" stroke-width=".8"/>
      <rect x="-11.5" y="-11" width="8" height="3.2" rx="1.6" fill="#14232b"/>
      <path d="M13.5 -10.5 L21 -12.5 L21 -7.5 L13.5 -8 Z" fill="#fff3b0">
        <animate attributeName="opacity" values=".15;.55;.15" dur=".6s" repeatCount="indefinite"/>
      </path>
      <circle cx="11.5" cy="-9" r="2" fill="#ffd166" stroke="#b8860b" stroke-width=".6"/>

      <g transform="translate(-13,0)">
        <circle r="6.5" fill="#14232b" stroke="#0fc2d8" stroke-width="1"/>
        <circle r="3.6" fill="none" stroke="#0fc2d8" stroke-width="1" opacity=".9"/>
        <g stroke="#9be8ef" stroke-width=".8">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".35s" repeatCount="indefinite"/>
          <line x1="-5" y1="0" x2="5" y2="0"/><line x1="-2.5" y1="-4.33" x2="2.5" y2="4.33"/><line x1="-2.5" y1="4.33" x2="2.5" y2="-4.33"/>
        </g>
        <circle r="1.2" fill="#9be8ef"/>
      </g>
      <g transform="translate(13,0)">
        <circle r="6.5" fill="#14232b" stroke="#0fc2d8" stroke-width="1"/>
        <circle r="3.6" fill="none" stroke="#0fc2d8" stroke-width="1" opacity=".9"/>
        <g stroke="#9be8ef" stroke-width=".8">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".35s" repeatCount="indefinite"/>
          <line x1="-5" y1="0" x2="5" y2="0"/><line x1="-2.5" y1="-4.33" x2="2.5" y2="4.33"/><line x1="-2.5" y1="4.33" x2="2.5" y2="-4.33"/>
        </g>
        <circle r="1.2" fill="#9be8ef"/>
      </g>
    </g>
  </g>

  <!-- ══════════ GIFT: tossed off the bike, bounces at center, lid pops ══════════ -->
  <g transform="translate(75,60)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".01s" begin="1.05s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-15 -18;0 -35;0 0;0 -6;0 0" keyTimes="0;.4;.75;.9;1"
        calcMode="spline" keySplines=".2 .7 .5 1;.55 0 .8 .4;.3 0 .6 1;.3 0 .5 1"
        dur=".95s" begin="1.05s" fill="freeze"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;-12;10;0;0" keyTimes="0;.35;.65;.9;1" dur=".95s" begin="1.05s" fill="freeze"/>
        <g filter="url(#enSh)">
          <rect x="-13" y="-8" width="26" height="20" rx="3" fill="#ff5e6c" stroke="#7a1030" stroke-width="1.4"/>
          <rect x="-2.5" y="-8" width="5" height="20" fill="url(#enGold)"/>
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0;3 -16" keyTimes="0;1"
              calcMode="spline" keySplines=".2 .7 .4 1" dur=".4s" begin="2.1s" fill="freeze"/>
            <animateTransform attributeName="transform" type="rotate" additive="sum" values="0;-22" dur=".4s" begin="2.1s" fill="freeze"/>
            <g transform="translate(-15.5,-14)">
              <rect x="0" y="0" width="31" height="9" rx="2" fill="#ff7585" stroke="#7a1030" stroke-width="1.4"/>
              <rect x="13" y="0" width="5" height="9" fill="url(#enGold)"/>
              <circle cx="9.5" cy="-.5" r="3.2" fill="url(#enGold)" stroke="#b8860b" stroke-width=".9"/>
              <circle cx="21.5" cy="-.5" r="3.2" fill="url(#enGold)" stroke="#b8860b" stroke-width=".9"/>
              <circle cx="15.5" cy=".8" r="2" fill="#f4a300" stroke="#b8860b" stroke-width=".9"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ══════════ SHOCKWAVE on landing ══════════ -->
  <circle cx="75" cy="62" r="8" fill="none" stroke="#7ef0dd" stroke-width="3" opacity="0">
    <animate attributeName="r" values="8;42" dur=".5s" begin="1.95s" fill="freeze"/>
    <animate attributeName="opacity" values=".8;0" dur=".5s" begin="1.95s" fill="freeze"/>
    <animate attributeName="stroke-width" values="3.5;1" dur=".5s" begin="1.95s" fill="freeze"/>
  </circle>

  <!-- ══════════ CONFETTI + COINS burst ══════════ -->
  <g transform="translate(75,58)">
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.3;1" dur=".8s" begin="1.95s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-34 -30" dur=".8s" begin="1.95s" fill="freeze" calcMode="spline" keySplines=".1 .7 .5 1"/><circle r="2" fill="#ffd166"/></g></g>
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.3;1" dur=".8s" begin="1.95s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;30 -32" dur=".8s" begin="1.95s" fill="freeze" calcMode="spline" keySplines=".1 .7 .5 1"/><rect x="-1.5" y="-1.5" width="3" height="3" fill="#14e0c8"/></g></g>
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.3;1" dur=".8s" begin="1.95s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-44 -4" dur=".8s" begin="1.95s" fill="freeze" calcMode="spline" keySplines=".1 .7 .5 1"/><circle r="1.6" fill="#ffffff"/></g></g>
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.3;1" dur=".8s" begin="1.95s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;44 -6" dur=".8s" begin="1.95s" fill="freeze" calcMode="spline" keySplines=".1 .7 .5 1"/><circle r="2" fill="#ff7585"/></g></g>
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.3;1" dur=".8s" begin="1.95s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-14 -42" dur=".8s" begin="1.95s" fill="freeze" calcMode="spline" keySplines=".1 .7 .5 1"/><rect x="-1.2" y="-2.5" width="2.5" height="5" fill="#ffd166" transform="rotate(30)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.3;1" dur=".8s" begin="1.95s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;16 -44" dur=".8s" begin="1.95s" fill="freeze" calcMode="spline" keySplines=".1 .7 .5 1"/><rect x="-1.2" y="-2.5" width="2.5" height="5" fill="#14e0c8" transform="rotate(-25)"/></g></g>
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.5;1" dur="1s" begin="1.95s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-28 24" dur="1s" begin="1.95s" fill="freeze" calcMode="spline" keySplines=".2 .6 .6 1"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".5s" repeatCount="indefinite"/><circle r="4.5" fill="url(#enGold)" stroke="#8a5a00" stroke-width="1"/></g></g></g>
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.5;1" dur="1s" begin="1.95s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;28 22" dur="1s" begin="1.95s" fill="freeze" calcMode="spline" keySplines=".2 .6 .6 1"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur=".5s" repeatCount="indefinite"/><circle r="4" fill="url(#enGold)" stroke="#8a5a00" stroke-width="1"/></g></g></g>
    <g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0;.5;1" dur="1s" begin="2.05s" fill="freeze"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 30" dur="1s" begin="2.05s" fill="freeze" calcMode="spline" keySplines=".3 0 .7 1"/>
        <circle r="3.5" fill="url(#enGold)" stroke="#8a5a00" stroke-width="1"/></g></g>
  </g>

  <!-- ══════════ WELCOME banner (box sized to cover icon + full text) ══════════ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".01s" begin="2.2s" fill="freeze"/>
    <g transform="translate(75,112)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="0;1.15;1" keyTimes="0;.7;1"
          calcMode="spline" keySplines=".2 .8 .3 1;.4 0 .6 1" dur=".45s" begin="2.2s" fill="freeze"/>
        <g transform="translate(-75,-112)" filter="url(#enSh)">
          <rect x="33" y="103" width="84" height="19" rx="9.5" fill="#0fc2d8" stroke="#0891b2" stroke-width="1.5"/>
          <g fill="#ffffff">
            <rect x="41" y="110.5" width="8" height="6.5" rx="1"/>
            <rect x="40" y="108.3" width="10" height="2.8" rx="1"/>
            <rect x="44.2" y="108.3" width="1.8" height="8.7"/>
          </g>
          <text x="83" y="116.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#ffffff" letter-spacing="1">WELCOME</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ══════════ ambient sparkles after entry ══════════ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0" dur=".01s" begin="2.5s" fill="freeze"/>
    <path transform="translate(48,42) scale(.55)" d="M0 -6 Q1.4 -1.4 6 0 Q1.4 1.4 0 6 Q-1.4 1.4 -6 0 Q-1.4 -1.4 0 -6 Z" fill="#d8fff7">
      <animate attributeName="opacity" values="1;.1;1" dur="1.5s" begin="2.5s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(104,38) scale(.45)" d="M0 -6 Q1.4 -1.4 6 0 Q1.4 1.4 0 6 Q-1.4 1.4 -6 0 Q-1.4 -1.4 0 -6 Z" fill="#ffd166">
      <animate attributeName="opacity" values=".1;1;.1" dur="1.9s" begin="2.5s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(75,30) scale(.5)" d="M0 -6 Q1.4 -1.4 6 0 Q1.4 1.4 0 6 Q-1.4 1.4 -6 0 Q-1.4 -1.4 0 -6 Z" fill="#d8fff7">
      <animate attributeName="opacity" values=".1;1;.1" dur="2.2s" begin="2.7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>