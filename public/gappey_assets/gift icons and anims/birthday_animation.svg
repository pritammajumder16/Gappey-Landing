<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <title>Janamdin Bash — full-screen gift animation</title>
  <defs>
    <radialGradient id="bdAsky" cx="50%" cy="38%" r="92%">
      <stop offset="0" stop-color="#1E0F16"/><stop offset=".55" stop-color="#100810"/><stop offset="1" stop-color="#070305"/>
    </radialGradient>
    <linearGradient id="bdAw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/><stop offset=".55" stop-color="#E4A93C"/><stop offset="1" stop-color="#B8791F"/>
    </linearGradient>
    <path id="bdAspk" d="M0 -11 Q2.2 -2.2 11 0 Q2.2 2.2 0 11 Q-2.2 2.2 -11 0 Q-2.2 -2.2 0 -11Z"/>
    <path id="bdAflag" d="M0 0 L16 5 L5 18 Z"/>
    <g id="bdAbal">
      <ellipse rx="22" ry="27"/>
      <ellipse cx="-6" cy="-8" rx="6" ry="8.5" fill="#FFF6E6" opacity=".4"/>
      <path d="M-4 27 L4 27 L0 34 Z"/>
      <path d="M0 34 C8 52 -8 66 2 88" fill="none" stroke="#F3EADA" stroke-width="1.5" opacity=".5"/>
    </g>
    <style>
      .bdA-cake{animation:bdCake 9s linear infinite}
      .bdA-fl{animation:bdFl 9s linear infinite}
      .bdA-flick{transform-box:fill-box;transform-origin:50% 85%;animation:bdFlick .55s ease-in-out infinite alternate}
      .bdA-smoke{transform-box:fill-box;transform-origin:center;opacity:0;animation:bdSmoke 9s linear infinite}
      .bdA-balw{animation:bdBal 9.5s linear infinite}
      .bdA-bsw{transform-box:fill-box;transform-origin:50% 15%;animation:bdBsw 2.8s ease-in-out infinite alternate}
      .bdA-b2{animation-duration:11s}.bdA-b3{animation-duration:12.5s}.bdA-b4{animation-duration:10.2s}
      .bdA-fall{animation:bdFall 4.4s linear infinite}
      .bdA-f1{animation-duration:3.6s}.bdA-f3{animation-duration:5.6s}
      .bdA-spin{transform-box:fill-box;transform-origin:center;animation:bdSpin 2.2s linear infinite}
      .bdA-spinR{animation-direction:reverse}
      .bdA-flash{fill:#FFF4DC;transform-box:fill-box;transform-origin:center;animation:bdFlash 9s linear infinite}
      .bdA-ring{fill:none;stroke:#F6D27A;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:bdRing 9s linear infinite}
      .bdA-sp{transform-box:fill-box;transform-origin:50% 100%;animation:bdSp 9s linear infinite}
      .bdA-w1{font:800 58px 'Arial Black','Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:url(#bdAw);stroke:#140A0E;stroke-width:8;paint-order:stroke;text-anchor:middle;transform-box:fill-box;transform-origin:center;opacity:0;animation:bdW 9s linear infinite}
      .bdA-w2{font:900 66px 'Arial Black','Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:url(#bdAw);stroke:#140A0E;stroke-width:9;paint-order:stroke;text-anchor:middle;transform-box:fill-box;transform-origin:center;opacity:0;animation:bdW 9s linear infinite;animation-delay:.14s}
      .bdA-sub{font:600 19px Georgia,'Times New Roman',serif;letter-spacing:8px;fill:#F2D48C;text-anchor:middle;opacity:0;animation:bdSub 9s linear infinite}
      .bdA-gar{transform-box:fill-box;transform-origin:50% 0;animation:bdGar 4.6s ease-in-out infinite alternate}
      .bdA-twk{transform-box:fill-box;transform-origin:center;animation:bdTw 3s ease-in-out infinite}
      @keyframes bdCake{
        0%{opacity:0;transform:translate(225px,900px) scale(.7)}
        5%{opacity:1}
        11%{transform:translate(225px,556px) scale(1.05)}
        14%{transform:translate(225px,560px) scale(.99,1.02)}
        16%,90%{opacity:1;transform:translate(225px,560px) scale(1,1)}
        96%,100%{opacity:0;transform:translate(225px,560px) scale(1,1)}}
      @keyframes bdFl{0%,61%{opacity:1}61.8%,100%{opacity:0}}
      @keyframes bdFlick{from{transform:scaleY(.92) rotate(-2deg)}to{transform:scaleY(1.1) rotate(2.5deg)}}
      @keyframes bdSmoke{0%,61%{opacity:0;transform:translateY(6px) scale(.5)}64%{opacity:.5;transform:translateY(0) scale(.9)}78%{opacity:0;transform:translateY(-70px) scale(1.5)}100%{opacity:0;transform:translateY(-70px) scale(1.5)}}
      @keyframes bdBal{from{transform:translateY(0)}to{transform:translateY(-1100px)}}
      @keyframes bdBsw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
      @keyframes bdFall{from{transform:translateY(-50px)}to{transform:translateY(870px)}}
      @keyframes bdSpin{to{transform:rotate(360deg)}}
      @keyframes bdFlash{0%,61.5%{opacity:0;transform:scale(.3)}64%{opacity:.7}71%{opacity:0;transform:scale(1.1)}100%{opacity:0}}
      @keyframes bdRing{0%,62%{opacity:.95;transform:scale(.12)}79%{opacity:0;transform:scale(3)}100%{opacity:0;transform:scale(3)}}
      @keyframes bdSp{0%,62%{opacity:0;transform:scale(.3)}66%{opacity:1;transform:scale(1)}74%,100%{opacity:0;transform:scale(.4)}}
      @keyframes bdW{0%,64.5%{opacity:0;transform:scale(.4) rotate(-5deg)}67.5%{opacity:1;transform:scale(1.12) rotate(2deg)}70%{transform:scale(.97) rotate(0)}71.5%,88%{opacity:1;transform:scale(1) rotate(0)}94%,100%{opacity:0;transform:scale(1) rotate(0)}}
      @keyframes bdSub{0%,70%{opacity:0}75%{opacity:1}88%{opacity:1}94%,100%{opacity:0}}
      @keyframes bdGar{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
      @keyframes bdTw{0%,100%{opacity:.07;transform:scale(.6)}50%{opacity:.8;transform:scale(1)}}
    </style>
