<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <title>Gappey Mic Drop — full-screen gift animation</title>
  <defs>
    <radialGradient id="gmCsky" cx="50%" cy="36%" r="92%">
      <stop offset="0" stop-color="#1C1712"/><stop offset=".55" stop-color="#0E0B08"/><stop offset="1" stop-color="#060403"/>
    </radialGradient>
    <radialGradient id="gmChead" cx=".38" cy=".32" r=".95">
      <stop offset="0" stop-color="#5A524A"/><stop offset="1" stop-color="#2A241F"/>
    </radialGradient>
    <linearGradient id="gmCgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/><stop offset=".5" stop-color="#E9B94F"/><stop offset="1" stop-color="#B8791F"/>
    </linearGradient>
    <linearGradient id="gmCw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/><stop offset=".55" stop-color="#E4A93C"/><stop offset="1" stop-color="#B8791F"/>
    </linearGradient>
    <radialGradient id="gmCfloor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D9A441" stop-opacity=".18"/><stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <style>
      .gmC-scene{animation:gmFade 8s linear infinite}
      .gmC-cone{fill:#F3EADA;animation:gmCone 3.6s ease-in-out infinite alternate}
      .gmC-eq{fill:#D9A441;transform-box:fill-box;transform-origin:50% 100%;animation:gmEq .8s ease-in-out infinite alternate}
      .gmC-mic{transform-box:fill-box;transform-origin:center;animation:gmMic 8s linear infinite}
      .gmC-gl{transform-box:fill-box;transform-origin:center;animation:gmGl 1.6s ease-in-out infinite alternate}
      .gmC-ring1,.gmC-ring2{fill:none;stroke:#F3EADA;transform-box:fill-box;transform-origin:center}
      .gmC-ring1{stroke-width:3;animation:gmR1 8s linear infinite}
      .gmC-ring2{stroke-width:2;animation:gmR2 8s linear infinite}
      .gmC-ir{fill:none;stroke:#F6D27A;stroke-width:6;transform-box:fill-box;transform-origin:center;animation:gmIR 8s linear infinite}
      .gmC-ir2{fill:none;stroke:#F3EADA;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:gmIR2 8s linear infinite}
      .gmC-flash{fill:#FFF4DC;transform-box:fill-box;transform-origin:center;animation:gmFlash 8s linear infinite}
      .gmC-spark{transform-box:fill-box;transform-origin:50% 100%;animation:gmSp 8s linear infinite}
      .gmC-word{font:900 88px 'Arial Black','Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:url(#gmCw);stroke:#140C04;stroke-width:9;paint-order:stroke;text-anchor:middle;transform-box:fill-box;transform-origin:center;opacity:0;animation:gmWord 8s linear infinite}
      .gmC-sub{font:600 22px Georgia,'Times New Roman',serif;letter-spacing:12px;fill:#F2D48C;text-anchor:middle;animation:gmSub 8s linear infinite}
      .gmC-orn{animation:gmSub 8s linear infinite}
      .gmC-twk{transform-box:fill-box;transform-origin:center;animation:gmTw 2.8s ease-in-out infinite}
      @keyframes gmFade{0%{opacity:0}4%{opacity:1}92%{opacity:1}97%,100%{opacity:0}}
      @keyframes gmCone{from{opacity:.04}to{opacity:.09}}
      @keyframes gmEq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
      @keyframes gmMic{
        0%{opacity:0;transform:translate(225px,700px) rotate(-70deg) scale(.4)}
        10%{opacity:1}
        16%{transform:translate(225px,330px) rotate(6deg) scale(1)}
        19%{transform:translate(225px,326px) rotate(-2deg) scale(1)}
        46%{transform:translate(225px,326px) rotate(-2deg) scale(1)}
        54%{transform:translate(225px,552px) rotate(84deg) scale(1)}
        56%{transform:translate(225px,572px) rotate(92deg) scale(1)}
        58%{transform:translate(225px,560px) rotate(88deg) scale(1)}
        60%,88%{opacity:1;transform:translate(225px,564px) rotate(89deg) scale(1)}
        94%,100%{opacity:0;transform:translate(225px,564px) rotate(89deg) scale(1)}}
      @keyframes gmGl{from{opacity:.2;transform:scale(.8)}to{opacity:.85;transform:scale(1.1)}}
      @keyframes gmR1{0%,20%{opacity:.9;transform:scale(.15)}36%{opacity:0;transform:scale(3)}100%{opacity:0;transform:scale(3)}}
      @keyframes gmR2{0%,34%{opacity:.8;transform:scale(.15)}50%{opacity:0;transform:scale(3.3)}100%{opacity:0;transform:scale(3.3)}}
      @keyframes gmIR{0%,56%{opacity:.95;transform:scale(.12)}72%{opacity:0;transform:scale(3.8)}100%{opacity:0;transform:scale(3.8)}}
      @keyframes gmIR2{0%,58%{opacity:.8;transform:scale(.12)}76%{opacity:0;transform:scale(4.4)}100%{opacity:0;transform:scale(4.4)}}
      @keyframes gmFlash{0%,56%{opacity:0;transform:scale(.3)}59%{opacity:.8}67%{opacity:0;transform:scale(1.2)}100%{opacity:0}}
      @keyframes gmSp{0%,56%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.25)}}
      @keyframes gmWord{0%,58%{opacity:0;transform:scale(.45) rotate(-6deg)}62%{opacity:1;transform:scale(1.12) rotate(1.5deg)}64.5%{transform:scale(.98) rotate(0deg)}66%,88%{opacity:1;transform:scale(1) rotate(0deg)}94%,100%{opacity:0;transform:scale(1) rotate(0deg)}}
      @keyframes gmSub{0%,60%{opacity:0}65%{opacity:1}86%{opacity:1}93%,100%{opacity:0}}
      @keyframes gmTw{0%,100%{opacity:.07;transform:scale(.6)}50%{opacity:.8;transform:scale(1)}}
    </style>
  </defs>
  <rect width="450" height="800" fill="url(#gmCsky)"/>
  <g class="gmC-scene">
    <polygon class="gmC-cone" points="150,-20 300,-20 365,820 85,820"/>
    <ellipse cx="225" cy="760" rx="290" ry="60" fill="url(#gmCfloor)"/>
    <ellipse cx="225" cy="764" rx="300" ry="56" fill="#0B0805"/>
    <g fill="#D9A441">
      <rect class="gmC-eq" x="145" y="742" width="15" height="52" rx="4" style="animation-duration:.72s"/>
      <rect class="gmC-eq" x="185" y="742" width="15" height="52" rx="4" style="animation-duration:.95s;animation-delay:-.3s"/>
      <rect class="gmC-eq" x="225" y="742" width="15" height="52" rx="4" style="animation-duration:.65s;animation-delay:-.5s"/>
      <rect class="gmC-eq" x="265" y="742" width="15" height="52" rx="4" style="animation-duration:1.05s;animation-delay:-.15s"/>
      <rect class="gmC-eq" x="305" y="742" width="15" height="52" rx="4" style="animation-duration:.82s;animation-delay:-.42s"/>
    </g>
  </g>
  <g transform="translate(72 170)"><path d="M0 -9 Q1.8 -1.8 9 0 Q1.8 1.8 0 9 Q-1.8 1.8 -9 0 Q-1.8 -1.8 0 -9Z" class="gmC-twk" fill="#F2B33D"/></g>
  <g transform="translate(384 210) scale(.8)"><path d="M0 -9 Q1.8 -1.8 9 0 Q1.8 1.8 0 9 Q-1.8 1.8 -9 0 Q-1.8 -1.8 0 -9Z" class="gmC-twk" fill="#F6EFE2" style="animation-delay:-1.1s"/></g>
  <g transform="translate(60 470) scale(.7)"><path d="M0 -9 Q1.8 -1.8 9 0 Q1.8 1.8 0 9 Q-1.8 1.8 -9 0 Q-1.8 -1.8 0 -9Z" class="gmC-twk" fill="#F2B33D" style="animation-delay:-2s"/></g>
  <circle class="gmC-ring1" cx="225" cy="326" r="70"/>
  <circle class="gmC-ring2" cx="225" cy="326" r="70"/>
  <circle class="gmC-flash" cx="225" cy="580" r="170"/>
  <circle class="gmC-ir" cx="225" cy="596" r="70"/>
  <circle class="gmC-ir2" cx="225" cy="596" r="70"/>
  <g transform="translate(225 596) rotate(0)"><line class="gmC-spark" x1="0" y1="-112" x2="0" y2="-172" stroke="#F6D27A" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(225 596) rotate(45)"><line class="gmC-spark" x1="0" y1="-112" x2="0" y2="-172" stroke="#F3EADA" stroke-width="4" stroke-linecap="round" style="animation-delay:.04s"/></g>
  <g transform="translate(225 596) rotate(90)"><line class="gmC-spark" x1="0" y1="-112" x2="0" y2="-172" stroke="#F6D27A" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(225 596) rotate(135)"><line class="gmC-spark" x1="0" y1="-112" x2="0" y2="-172" stroke="#F3EADA" stroke-width="4" stroke-linecap="round" style="animation-delay:.04s"/></g>
  <g transform="translate(225 596) rotate(180)"><line class="gmC-spark" x1="0" y1="-112" x2="0" y2="-172" stroke="#F6D27A" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(225 596) rotate(225)"><line class="gmC-spark" x1="0" y1="-112" x2="0" y2="-172" stroke="#F3EADA" stroke-width="4" stroke-linecap="round" style="animation-delay:.04s"/></g>
  <g transform="translate(225 596) rotate(270)"><line class="gmC-spark" x1="0" y1="-112" x2="0" y2="-172" stroke="#F6D27A" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(225 596) rotate(315)"><line class="gmC-spark" x1="0" y1="-112" x2="0" y2="-172" stroke="#F3EADA" stroke-width="4" stroke-linecap="round" style="animation-delay:.04s"/></g>
  <g class="gmC-mic">
    <g transform="scale(2.1)">
      <circle cx="0" cy="-34" r="34" fill="url(#gmChead)" stroke="#D9A441" stroke-width="3"/>
      <g stroke="#8A8078" stroke-width="2" stroke-linecap="round">
        <line x1="-24" y1="-44" x2="24" y2="-44"/><line x1="-28" y1="-34" x2="28" y2="-34"/><line x1="-24" y1="-24" x2="24" y2="-24"/>
      </g>
      <path class="gmC-gl" d="M-14 -50 q6 -3 12 -2" fill="none" stroke="#FFF6E6" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-21" y="-6" width="42" height="10" rx="3" fill="url(#gmCgold)" stroke="#7A531A" stroke-width="1.5"/>
      <text x="0" y="1.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="8" fill="#3A2405">G</text>
      <path d="M-15 4 L15 4 L9 96 L-9 96 Z" fill="#35302B" stroke="#17120E" stroke-width="2" stroke-linejoin="round"/>
      <line x1="-7" y1="16" x2="7" y2="16" stroke="#57504A" stroke-width="2"/>
      <line x1="-5" y1="34" x2="5" y2="34" stroke="#57504A" stroke-width="2"/>
      <circle cy="100" r="7" fill="url(#gmCgold)" stroke="#7A531A" stroke-width="1.5"/>
    </g>
  </g>
  <text class="gmC-word" x="229" y="330">GAPPEY!</text>
  <text class="gmC-sub" x="230" y="384">MIC DROP</text>
  <g class="gmC-orn" stroke="#D9A441" fill="none">
    <line x1="146" y1="408" x2="204" y2="408"/>
    <line x1="256" y1="408" x2="314" y2="408"/>
    <path d="M225 402 l6 6 -6 6 -6 -6Z"/>
  </g>
</svg>