<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <title>Baaz — full-screen gift animation</title>
  <defs>
    <linearGradient id="bzAsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12222E"/><stop offset=".55" stop-color="#0B1520"/><stop offset="1" stop-color="#05090D"/>
    </linearGradient>
    <linearGradient id="bzAword" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/><stop offset=".55" stop-color="#E4A93C"/><stop offset="1" stop-color="#B8791F"/>
    </linearGradient>
    <path id="bzAspk" d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10Z"/>
    <style>
      .bz-fly{animation:bzFly 8s linear infinite}
      .bz-wf,.bz-wn{transform-box:fill-box;transform-origin:100% 100%;animation:bzFlap .55s ease-in-out infinite alternate}
      .bz-wf{fill:#1F2D3A}
      .bz-wn{fill:#3A5065;animation-delay:-.28s}
      .bz-ln{fill:none;stroke:#9FB4C2;stroke-width:3;stroke-linecap:round;stroke-dasharray:36 26;opacity:.3;animation:bzDash .5s linear infinite}
      .bz-wind{fill:none;stroke:#9FB4C2;stroke-width:1.5;stroke-dasharray:60 90;opacity:.1;animation:bzDash2 1.2s linear infinite}
      .bz-ring{fill:none;stroke:#9FB4C2;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:bzRing 8s linear infinite}
      .bz-f{fill:#3A5065;opacity:0;transform-box:fill-box;transform-origin:50% 0%;animation:bzF 8s linear infinite}
      .bz-cap{font:900 104px 'Arial Black','Segoe UI',Arial,sans-serif;letter-spacing:8px;fill:url(#bzAword);stroke:#0A1016;stroke-width:9;paint-order:stroke;text-anchor:middle;transform-box:fill-box;transform-origin:center;animation:bzCap 8s linear infinite}
      .bz-orn{animation:bzCap 8s linear infinite}
      .bz-tw{transform-box:fill-box;transform-origin:center;animation:bzTw 2.6s ease-in-out infinite}
      @keyframes bzFly{
        0%{transform:translate(-160px,150px) rotate(-10deg) scale(.85);opacity:0}
        3%{opacity:1}
        26%{transform:translate(210px,330px) rotate(3deg) scale(1)}
        50%{transform:translate(500px,555px) rotate(11deg) scale(1.18);opacity:1}
        55%{transform:translate(625px,625px) rotate(13deg) scale(1.2);opacity:0}
        100%{transform:translate(-160px,150px) rotate(-10deg) scale(.85);opacity:0}}
      @keyframes bzFlap{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
      @keyframes bzDash{to{stroke-dashoffset:-124}}
      @keyframes bzDash2{to{stroke-dashoffset:-150}}
      @keyframes bzRing{0%{opacity:0;transform:scale(.1)}27%{opacity:.8;transform:scale(.12)}40%,100%{opacity:0;transform:scale(3)}}
      @keyframes bzF{0%,28%{opacity:0;transform:translate(0,0) rotate(0deg)}31%{opacity:1}55%,100%{opacity:0;transform:translate(26px,150px) rotate(50deg)}}
      @keyframes bzCap{0%,32%{opacity:0;transform:scale(.5)}38%{opacity:1;transform:scale(1.06)}41%,82%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(1)}}
      @keyframes bzTw{0%,100%{opacity:.08;transform:scale(.7)}50%{opacity:.7;transform:scale(1)}}
    </style>
  </defs>
  <rect width="450" height="800" fill="url(#bzAsky)"/>
  <circle cx="352" cy="150" r="46" fill="#E9E4D2" opacity=".1"/>
  <circle cx="352" cy="150" r="32" fill="#E9E4D2" opacity=".07"/>
  <circle class="bz-tw" cx="70" cy="120" r="1.8" fill="#E9E4D2"/>
  <circle class="bz-tw" cx="150" cy="80" r="1.5" fill="#E9E4D2" style="animation-delay:-.5s"/>
  <circle class="bz-tw" cx="260" cy="90" r="2" fill="#E9E4D2" style="animation-delay:-1.1s"/>
  <circle class="bz-tw" cx="400" cy="220" r="1.5" fill="#E9E4D2" style="animation-delay:-1.7s"/>
  <circle class="bz-tw" cx="60" cy="300" r="1.8" fill="#E9E4D2" style="animation-delay:-2.1s"/>
  <circle class="bz-tw" cx="330" cy="60" r="1.5" fill="#E9E4D2" style="animation-delay:-.9s"/>
  <path class="bz-wind" d="M-20 200 C120 190 300 210 470 195"/>
  <path class="bz-wind" d="M-20 430 C140 420 300 445 470 428" style="animation-delay:-.4s"/>
  <path class="bz-wind" d="M-20 640 C120 630 320 655 470 638" style="animation-delay:-.8s"/>
  <path d="M0 800 L0 610 L80 540 L150 600 L230 520 L320 610 L390 550 L450 620 L450 800 Z" fill="#0A1219" opacity=".8"/>
  <path d="M0 800 L0 690 L90 630 L180 690 L260 640 L360 700 L450 660 L450 800 Z" fill="#05090D"/>
  <circle class="bz-ring" cx="225" cy="370" r="70"/>
  <g transform="translate(205 330) rotate(-30)"><path class="bz-f" d="M0 0 C5 6 5 14 0 20 C-5 14 -5 6 0 0 Z"/></g>
  <g transform="translate(205 330) rotate(-10)"><path class="bz-f" d="M0 0 C5 6 5 14 0 20 C-5 14 -5 6 0 0 Z" style="animation-delay:.12s"/></g>
  <g transform="translate(205 330) rotate(10)"><path class="bz-f" d="M0 0 C5 6 5 14 0 20 C-5 14 -5 6 0 0 Z" style="animation-delay:.24s"/></g>
  <g transform="translate(205 330) rotate(30)"><path class="bz-f" d="M0 0 C5 6 5 14 0 20 C-5 14 -5 6 0 0 Z" style="animation-delay:.36s"/></g>
  <g transform="translate(205 330) rotate(50)"><path class="bz-f" d="M0 0 C5 6 5 14 0 20 C-5 14 -5 6 0 0 Z" style="animation-delay:.48s"/></g>
  <g class="bz-fly">
    <path class="bz-ln" d="M-58 -10 C-120 -20 -190 -22 -255 -10"/>
    <path class="bz-ln" d="M-66 2 C-130 -2 -200 2 -262 10" opacity=".25"/>
    <path class="bz-ln" d="M-50 -20 C-105 -30 -160 -34 -215 -26" opacity=".2"/>
    <path class="bz-ln" d="M-72 14 C-135 14 -200 20 -258 28" opacity=".25"/>
    <path class="bz-ln" d="M-40 -26 C-90 -36 -140 -40 -190 -34" opacity=".2"/>
    <g class="bz-wf"><path d="M0 -2 C-18 -34 -50 -58 -86 -62 C-66 -38 -38 -14 -2 0 Z"/></g>
    <path d="M-46 0 L-88 14 L-80 4 L-90 -6 L-72 -3 Z" fill="#1F2D3A"/>
    <path d="M-50 4 C-36 -12 -2 -18 22 -8 C36 -2 40 8 30 14 C4 24 -32 20 -50 4 Z" fill="#2E4152"/>
    <circle cx="24" cy="-9" r="10.5" fill="#2E4152"/>
    <path d="M32 -14 L50 -8.5 L32 -3.5 Z" fill="#E8B54A"/>
    <path d="M44 -9.8 L50 -8.5 L44 -6.8 Z" fill="#10181F"/>
    <circle cx="28" cy="-10" r="3" fill="#120C06" stroke="#D9A441" stroke-width="1.6"/>
    <path d="M24 -5 C29 -3 30 2 26 5 C22 2 21 -2 24 -5 Z" fill="#0F1822"/>
    <g class="bz-wn"><path d="M2 0 C-16 -28 -44 -48 -74 -52 C-56 -32 -32 -12 0 2 Z"/></g>
  </g>
  <text class="bz-cap" x="229" y="690">BAAZ</text>
  <g class="bz-orn" stroke="#D9A441" fill="none">
    <line x1="128" y1="716" x2="204" y2="716"/>
    <line x1="256" y1="716" x2="332" y2="716"/>
    <path d="M225 710 l6 6 -6 6 -6 -6Z"/>
  </g>
</svg>