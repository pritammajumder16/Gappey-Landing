<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <title>Gappey Crown — full-screen gift animation</title>
  <defs>
    <radialGradient id="gcCsky" cx="50%" cy="40%" r="90%">
      <stop offset="0" stop-color="#241404"/><stop offset=".55" stop-color="#120A02"/><stop offset="1" stop-color="#070401"/>
    </radialGradient>
    <radialGradient id="gcCglowG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D9A441" stop-opacity=".3"/><stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gcCw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/><stop offset=".55" stop-color="#E4A93C"/><stop offset="1" stop-color="#B8791F"/>
    </linearGradient>
    <linearGradient id="gcCgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/><stop offset=".5" stop-color="#E9B94F"/><stop offset="1" stop-color="#B8791F"/>
    </linearGradient>
    <path id="gcCspk" d="M0 -11 Q2.2 -2.2 11 0 Q2.2 2.2 0 11 Q-2.2 2.2 -11 0 Q-2.2 -2.2 0 -11Z"/>
    <style>
      .gcC-beam{fill:#F3EADA;animation:gcBeam 4.6s ease-in-out infinite alternate}
      .gcC-crown{transform-box:fill-box;transform-origin:50% 100%;animation:gcCrown 10s linear infinite}
      .gcC-bob{transform-box:fill-box;transform-origin:center;animation:gcBob 3.6s ease-in-out infinite alternate}
      .gcC-glow{animation:gcGlow 3.6s ease-in-out infinite alternate}
      .gcC-ring{fill:none;stroke:#F6D27A;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:gcRing 10s linear infinite}
      .gcC-ring2{fill:none;stroke:#F3EADA;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:gcRing2 10s linear infinite}
      .gcC-flash{fill:#FFF4DC;transform-box:fill-box;transform-origin:center;animation:gcFlash 10s linear infinite}
      .gcC-sp{transform-box:fill-box;transform-origin:center;animation:gcSp 10s linear infinite}
      .gcC-L{font:900 82px 'Arial Black','Segoe UI',Arial,sans-serif;fill:url(#gcCw);stroke:#140C04;stroke-width:8;paint-order:stroke;text-anchor:middle;transform-box:fill-box;transform-origin:center;opacity:0;animation:gcL 10s linear infinite}
      .gcC-sub{font:600 22px Georgia,'Times New Roman',serif;letter-spacing:12px;fill:#F2D48C;text-anchor:middle;animation:gcSub 10s linear infinite}
      .gcC-orn{animation:gcSub 10s linear infinite}
      .gcC-cf{transform-box:fill-box;transform-origin:center;opacity:.5}
      .gcC-ca{animation:gcCA 6s linear infinite}
      .gcC-cb{animation:gcCB 7.4s linear infinite}
      .gcC-twk{transform-box:fill-box;transform-origin:center;animation:gcTw 3s ease-in-out infinite}
      @keyframes gcBeam{from{opacity:.03}to{opacity:.08}}
      @keyframes gcCrown{0%{opacity:0;transform:translateY(-210px)}5%{opacity:1;transform:translateY(-150px)}26%{transform:translateY(6px)}28.5%{transform:translateY(0) scale(1.06,.92)}31%{transform:translateY(0) scale(.985,1.02)}32.5%,88%{opacity:1;transform:translateY(0) scale(1,1)}95%,100%{opacity:0;transform:translateY(0) scale(1,1)}}
      @keyframes gcBob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
      @keyframes gcGlow{from{opacity:.4}to{opacity:.85}}
      @keyframes gcRing{0%,31%{opacity:.95;transform:scale(.12)}48%{opacity:0;transform:scale(3)}100%{opacity:0;transform:scale(3)}}
      @keyframes gcRing2{0%,33%{opacity:.8;transform:scale(.12)}55%{opacity:0;transform:scale(3.6)}100%{opacity:0;transform:scale(3.6)}}
      @keyframes gcFlash{0%,31%{opacity:0;transform:scale(.3)}34%{opacity:.75}42%{opacity:0;transform:scale(1.15)}100%{opacity:0}}
      @keyframes gcSp{0%,31%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.2)}42%,100%{opacity:0;transform:scale(.4)}}
      @keyframes gcL{0%,40%{opacity:0;transform:translateY(-240px)}44%{opacity:1;transform:translateY(16px)}46.5%{transform:translateY(-6px)}48%{transform:translateY(0)}88%{opacity:1;transform:translateY(0)}94%,100%{opacity:0;transform:translateY(0)}}
      @keyframes gcSub{0%,52%{opacity:0}58%{opacity:1}86%{opacity:1}93%,100%{opacity:0}}
      @keyframes gcCA{from{transform:translateY(-40px)}to{transform:translateY(860px)}}
      @keyframes gcCB{from{transform:translateY(-40px)}to{transform:translateY(860px)}}
      @keyframes gcTw{0%,100%{opacity:.07;transform:scale(.6)}50%{opacity:.85;transform:scale(1)}}
    </style>
  </defs>
  <rect width="450" height="800" fill="url(#gcCsky)"/>
  <polygon class="gcC-beam" points="90,-20 150,-20 300,820 180,820"/>
  <polygon class="gcC-beam" points="360,-20 300,-20 150,820 270,820" style="animation-delay:-2.3s"/>
  <g transform="translate(70 180)"><use href="#gcCspk" class="gcC-twk" fill="#F2B33D"/></g>
  <g transform="translate(386 240) scale(.8)"><use href="#gcCspk" class="gcC-twk" fill="#F6EFE2" style="animation-delay:-1s"/></g>
  <g transform="translate(56 560) scale(.7)"><use href="#gcCspk" class="gcC-twk" fill="#F2B33D" style="animation-delay:-2s"/></g>
  <rect class="gcC-cf gcC-ca" x="52" y="0" width="7" height="13" rx="2" fill="#E2557B"/>
  <rect class="gcC-cf gcC-cb" x="130" y="0" width="6" height="12" rx="2" fill="#F6D27A" style="animation-delay:-3.2s"/>
  <rect class="gcC-cf gcC-ca" x="212" y="0" width="7" height="13" rx="2" fill="#F3EADA" style="animation-delay:-1.1s"/>
  <rect class="gcC-cf gcC-cb" x="296" y="0" width="6" height="12" rx="2" fill="#E2557B" style="animation-delay:-5.4s"/>
  <rect class="gcC-cf gcC-ca" x="388" y="0" width="7" height="13" rx="2" fill="#F6D27A" style="animation-delay:-2.2s"/>
  <circle class="gcC-cf gcC-cb" cx="86" cy="0" r="3" fill="#F3EADA" style="animation-delay:-4.6s"/>
  <circle class="gcC-cf gcC-ca" cx="252" cy="0" r="3" fill="#F6D27A" style="animation-delay:-.7s"/>
  <circle class="gcC-cf gcC-cb" cx="346" cy="0" r="3" fill="#E2557B" style="animation-delay:-2.9s"/>
  <ellipse cx="225" cy="508" rx="170" ry="26" fill="url(#gcCglowG)" class="gcC-glow"/>
  <ellipse cx="225" cy="508" rx="150" ry="22" fill="#1C1208" stroke="#6B4A1C" stroke-width="2.5"/>
  <ellipse cx="225" cy="506" rx="112" ry="15" fill="none" stroke="#D9A441" stroke-width="1.5" opacity=".5"/>
  <circle class="gcC-flash" cx="225" cy="420" r="180"/>
  <circle class="gcC-ring" cx="225" cy="430" r="80"/>
  <circle class="gcC-ring2" cx="225" cy="430" r="80"/>
  <g transform="translate(150 350)"><use href="#gcCspk" class="gcC-sp" fill="#F6D27A"/></g>
  <g transform="translate(302 348) scale(.8)"><use href="#gcCspk" class="gcC-sp" fill="#F3EADA" style="animation-delay:.05s"/></g>
  <g transform="translate(226 300) scale(.9)"><use href="#gcCspk" class="gcC-sp" fill="#F6D27A" style="animation-delay:.1s"/></g>
  <g transform="translate(158 452) scale(.75)"><use href="#gcCspk" class="gcC-sp" fill="#F2B33D" style="animation-delay:.08s"/></g>
  <g transform="translate(296 456) scale(.85)"><use href="#gcCspk" class="gcC-sp" fill="#F6D27A" style="animation-delay:.12s"/></g>
  <g class="gcC-crown">
    <g class="gcC-bob">
      <g transform="translate(225 494) scale(2.1)">
        <path d="M-64 -24 L-64 -44 L-46 -92 L-20 -52 L0 -104 L20 -52 L46 -92 L64 -44 L64 -24 Z" fill="url(#gcCgold)" stroke="#7A531A" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="-64" y="-24" width="128" height="24" rx="5" fill="url(#gcCgold)" stroke="#7A531A" stroke-width="2.5"/>
        <circle cx="-46" cy="-98" r="6" fill="#F6D27A" stroke="#7A531A" stroke-width="2"/>
        <circle cx="0" cy="-112" r="7" fill="#E2557B" stroke="#7A531A" stroke-width="2"/>
        <circle cx="46" cy="-98" r="6" fill="#F6D27A" stroke="#7A531A" stroke-width="2"/>
        <path d="M-32 -12 l5 6 -5 6 -5 -6 Z" fill="#2FA08B" stroke="#0C5747" stroke-width="1.5"/>
        <path d="M32 -12 l5 6 -5 6 -5 -6 Z" fill="#2FA08B" stroke="#0C5747" stroke-width="1.5"/>
        <text x="0" y="-9" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16" fill="#5E1B26">G</text>
      </g>
    </g>
  </g>
  <text class="gcC-L" x="64" y="616">G</text>
  <text class="gcC-L" x="132" y="616" style="animation-delay:.14s">A</text>
  <text class="gcC-L" x="198" y="616" style="animation-delay:.28s">P</text>
  <text class="gcC-L" x="262" y="616" style="animation-delay:.42s">P</text>
  <text class="gcC-L" x="320" y="616" style="animation-delay:.56s">E</text>
  <text class="gcC-L" x="384" y="616" style="animation-delay:.7s">Y</text>
  <text class="gcC-sub" x="231" y="668">SABSE UPAR</text>
  <g class="gcC-orn" stroke="#D9A441" fill="none">
    <line x1="140" y1="692" x2="204" y2="692"/>
    <line x1="256" y1="692" x2="320" y2="692"/>
    <path d="M225 686 l6 6 -6 6 -6 -6Z"/>
  </g>
</svg>