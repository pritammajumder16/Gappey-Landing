<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <title>Palki-e-Sultan — full-screen gift animation</title>
  <defs>
    <radialGradient id="pkAsky" cx="50%" cy="42%" r="90%">
      <stop offset="0" stop-color="#200A12"/><stop offset=".55" stop-color="#100409"/><stop offset="1" stop-color="#070203"/>
    </radialGradient>
    <linearGradient id="pkAcnp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E2E3E"/><stop offset="1" stop-color="#5E1B26"/>
    </linearGradient>
    <linearGradient id="pkAcabin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E1A26"/><stop offset="1" stop-color="#440D17"/>
    </linearGradient>
    <radialGradient id="pkAwin" cx=".5" cy=".35" r="1">
      <stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#E0A83C"/>
    </radialGradient>
    <radialGradient id="pkAglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D9A441" stop-opacity=".22"/><stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <path id="pkApetal" d="M0 -6 C4.2 -4 5.4 1.6 0 7.2 C-5.4 1.6 -4.2 -4 0 -6 Z"/>
    <path id="pkAspk" d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10Z"/>
    <g id="pkAcurn">
      <path d="M0 0 H232 C210 130 244 300 216 470 C238 630 214 730 230 800 H0 Z" fill="#5E1B26"/>
      <g fill="none" opacity=".4" stroke="#471019" stroke-width="10">
        <path d="M36 0 C26 180 48 420 34 800"/>
        <path d="M84 0 C72 160 100 460 82 800"/>
        <path d="M132 0 C122 200 150 430 134 800"/>
        <path d="M182 0 C172 150 196 470 180 800"/>
      </g>
      <path d="M232 0 C210 130 244 300 216 470 C238 630 214 730 230 800" fill="none" stroke="#D9A441" stroke-width="3"/>
    </g>
    <g id="pkAtas">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D9A441" stroke-width="2"/>
      <path d="M0 8 C4 12 4 18 0 21 C-4 18 -4 12 0 8 Z" fill="#D9A441"/>
    </g>
    <style>
      .pkA-cl{animation:pkCL 10s cubic-bezier(.65,0,.35,1) infinite}
      .pkA-cr{animation:pkCR 10s cubic-bezier(.65,0,.35,1) infinite}
      .pkA-pk{animation:pkPK 10s linear infinite}
      .pkA-sway{transform-box:fill-box;transform-origin:50% 62%;animation:pkSway 3.8s ease-in-out infinite alternate}
      .pkA-glow{animation:pkGlow 3.8s ease-in-out infinite alternate}
      .pkA-pv{animation:pkPV 10s linear infinite}
      .pkA-fl{animation:pkFall 4s linear infinite}
      .pkA-d1{animation-duration:3.1s}.pkA-d2{animation-duration:4s}.pkA-d3{animation-duration:5s}
      .pkA-sw{transform-box:fill-box;transform-origin:50% 0;animation:pkSwayP 2.2s ease-in-out infinite alternate}
      .pkA-rot{transform-box:fill-box;transform-origin:center;animation:pkRot 2.4s linear infinite}
      .pkA-cap{font:600 33px Georgia,'Times New Roman',serif;letter-spacing:10px;fill:#F2D48C;text-anchor:middle;animation:pkCap 10s linear infinite}
      .pkA-orn{animation:pkCap 10s linear infinite}
      .pkA-twk{transform-box:fill-box;transform-origin:center;animation:pkTw 2.8s ease-in-out infinite}
      @keyframes pkCL{0%,3%{transform:translateX(0)}17%,83%{transform:translateX(-268px)}94%,100%{transform:translateX(0)}}
      @keyframes pkCR{0%,3%{transform:translateX(0)}17%,83%{transform:translateX(268px)}94%,100%{transform:translateX(0)}}
      @keyframes pkPK{
        0%,9%{opacity:0;transform:translate(225px,415px) scale(.5)}
        15%{opacity:1}
        26%{opacity:1;transform:translate(225px,415px) scale(1.07)}
        29.5%{transform:translate(225px,415px) scale(1)}
        83%{opacity:1;transform:translate(225px,415px) scale(1)}
        91%,100%{opacity:0;transform:translate(225px,415px) scale(.85)}}
      @keyframes pkSway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
      @keyframes pkGlow{from{opacity:.45}to{opacity:.85}}
      @keyframes pkPV{0%,24%{opacity:0}30%{opacity:1}86%{opacity:1}93%,100%{opacity:0}}
      @keyframes pkFall{from{transform:translateY(-40px)}to{transform:translateY(880px)}}
      @keyframes pkSwayP{from{transform:translateX(-12px) rotate(-24deg)}to{transform:translateX(12px) rotate(24deg)}}
      @keyframes pkRot{to{transform:rotate(360deg)}}
      @keyframes pkCap{0%,30%{opacity:0}38%{opacity:1}84%{opacity:1}92%,100%{opacity:0}}
      @keyframes pkTw{0%,100%{opacity:.06;transform:scale(.6)}50%{opacity:.85;transform:scale(1)}}
    </style>
  </defs>
  <rect width="450" height="800" fill="url(#pkAsky)"/>
  <ellipse cx="225" cy="600" rx="230" ry="70" fill="url(#pkAglow)" class="pkA-glow"/>
  <g class="pkA-pk">
    <ellipse cx="0" cy="96" rx="105" ry="12" fill="#000" opacity=".35"/>
    <g class="pkA-sway">
      <g transform="scale(1.8)">
        <line x1="-98" y1="52" x2="98" y2="52" stroke="#8A5A2B" stroke-width="7" stroke-linecap="round"/>
        <circle cx="-98" cy="52" r="5.5" fill="#D9A441"/>
        <circle cx="98" cy="52" r="5.5" fill="#D9A441"/>
        <path d="M-58 -32 Q-58 -70 0 -72 Q58 -70 58 -32 Z" fill="url(#pkAcnp)" stroke="#3F0C15" stroke-width="2"/>
        <path d="M-58 -32 Q-30 -44 0 -44 Q30 -44 58 -32" fill="none" stroke="#D9A441" stroke-width="1.6" opacity=".6"/>
        <line x1="0" y1="-72" x2="0" y2="-88" stroke="#D9A441" stroke-width="3"/>
        <circle cx="0" cy="-92" r="4" fill="#F6D27A"/>
        <path d="M-58 -32 a11.6 8 0 0 0 23.2 0 a11.6 8 0 0 0 23.2 0 a11.6 8 0 0 0 23.2 0 a11.6 8 0 0 0 23.2 0 a11.6 8 0 0 0 23.2 0" fill="#D9A441" opacity=".9"/>
        <circle cx="-30" cy="-52" r="1.8" fill="#F3EADA"/><circle cx="0" cy="-60" r="1.8" fill="#F3EADA"/><circle cx="30" cy="-52" r="1.8" fill="#F3EADA"/>
        <line x1="-50" y1="-26" x2="-50" y2="-6" stroke="#D9A441" stroke-width="4"/>
        <line x1="50" y1="-26" x2="50" y2="-6" stroke="#D9A441" stroke-width="4"/>
        <rect x="-52" y="-6" width="104" height="58" rx="12" fill="url(#pkAcabin)" stroke="#D9A441" stroke-width="2.5"/>
        <path d="M-15 46 V16 a15 17 0 0 1 30 0 V46 Z" fill="url(#pkAwin)" stroke="#8A5F1D" stroke-width="2"/>
        <line x1="0" y1="2" x2="0" y2="44" stroke="#8A5F1D" stroke-width="1.5" opacity=".7"/>
        <line x1="-14" y1="22" x2="14" y2="22" stroke="#8A5F1D" stroke-width="1.5" opacity=".7"/>
        <use href="#pkAtas" transform="translate(-40 52)"/>
        <use href="#pkAtas" transform="translate(0 52)"/>
        <use href="#pkAtas" transform="translate(40 52)"/>
      </g>
    </g>
  </g>
  <g class="pkA-cl"><use href="#pkAcurn"/></g>
  <g class="pkA-cr"><g transform="translate(450 0) scale(-1 1)"><use href="#pkAcurn"/></g></g>
  <rect x="0" y="0" width="450" height="22" fill="#5E1B26"/>
  <rect x="0" y="21" width="450" height="2.5" fill="#D9A441"/>
  <path d="M0 23.5 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0 a22.5 15 0 0 0 45 0" fill="#7A2331" stroke="#D9A441" stroke-width="1.5"/>
  <g class="pkA-pv">
    <g transform="translate(26 -20)"><g class="pkA-sw"><g class="pkA-fl pkA-d3" style="animation-delay:-.2s"><use href="#pkApetal" fill="#E2557B"/></g></g></g>
    <g transform="translate(58 -20)"><g class="pkA-sw" style="animation-delay:-.5s"><g class="pkA-fl pkA-d2" style="animation-delay:-1.4s"><use href="#pkApetal" fill="#F08CA5" transform="scale(1.15)"/></g></g></g>
    <g transform="translate(92 -20)"><g class="pkA-sw" style="animation-delay:-1s"><g class="pkA-fl pkA-d1" style="animation-delay:-.7s"><use href="#pkApetal" fill="#D94A6A" transform="scale(.85)"/></g></g></g>
    <g transform="translate(124 -20)"><g class="pkA-sw" style="animation-delay:-.3s"><g class="pkA-fl pkA-d2" style="animation-delay:-2.2s"><use href="#pkApetal" fill="#E2557B" transform="scale(1.05)"/></g></g></g>
    <g transform="translate(155 -20)"><g class="pkA-sw" style="animation-delay:-1.4s"><g class="pkA-fl pkA-d3" style="animation-delay:-3s"><use href="#pkApetal" fill="#F08CA5" transform="scale(.85)"/></g></g></g>
    <g transform="translate(188 -20)"><g class="pkA-sw" style="animation-delay:-.8s"><g class="pkA-fl pkA-d1" style="animation-delay:-1.1s"><use href="#pkApetal" fill="#E2557B" transform="scale(1.2)"/></g></g></g>
    <g transform="translate(219 -20)"><g class="pkA-sw" style="animation-delay:-1.9s"><g class="pkA-fl pkA-d2" style="animation-delay:-.4s"><use href="#pkApetal" fill="#F2A43D" transform="scale(.9)"/></g></g></g>
    <g transform="translate(250 -20)"><g class="pkA-sw" style="animation-delay:-.1s"><g class="pkA-fl pkA-d3" style="animation-delay:-1.8s"><use href="#pkApetal" fill="#FFD98F" transform="scale(1.1)"/></g></g></g>
    <g transform="translate(282 -20)"><g class="pkA-sw" style="animation-delay:-1.1s"><g class="pkA-fl pkA-d1" style="animation-delay:-2.6s"><use href="#pkApetal" fill="#E2557B" transform="scale(.95)"/></g></g></g>
    <g transform="translate(312 -20)"><g class="pkA-sw" style="animation-delay:-.6s"><g class="pkA-fl pkA-d2" style="animation-delay:-.9s"><use href="#pkApetal" fill="#F08CA5" transform="scale(1.15)"/></g></g></g>
    <g transform="translate(344 -20)"><g class="pkA-sw" style="animation-delay:-1.7s"><g class="pkA-fl pkA-d3" style="animation-delay:-2.1s"><use href="#pkApetal" fill="#D94A6A" transform="scale(.8)"/></g></g></g>
    <g transform="translate(376 -20)"><g class="pkA-sw" style="animation-delay:-.4s"><g class="pkA-fl pkA-d1" style="animation-delay:-.5s"><use href="#pkApetal" fill="#F2A43D" transform="scale(1.05)"/></g></g></g>
    <g transform="translate(408 -20)"><g class="pkA-sw" style="animation-delay:-1.3s"><g class="pkA-fl pkA-d2" style="animation-delay:-1.5s"><use href="#pkApetal" fill="#E2557B" transform="scale(.9)"/></g></g></g>
    <g transform="translate(434 -20)"><g class="pkA-sw" style="animation-delay:-.9s"><g class="pkA-fl pkA-d3" style="animation-delay:-3.4s"><use href="#pkApetal" fill="#F08CA5" transform="scale(1.1)"/></g></g></g>
    <g transform="translate(44 -20)"><g class="pkA-fl pkA-d2" style="animation-delay:-.9s"><use href="#pkAspk" class="pkA-rot" fill="#F6EFE2" transform="scale(.7)"/></g></g>
    <g transform="translate(150 -20)"><g class="pkA-fl pkA-d1" style="animation-delay:-2.1s"><use href="#pkAspk" class="pkA-rot" fill="#F2D48C" transform="scale(.6)"/></g></g>
    <g transform="translate(300 -20)"><g class="pkA-fl pkA-d3" style="animation-delay:-1.2s"><use href="#pkAspk" class="pkA-rot" fill="#F6EFE2" transform="scale(.7)"/></g></g>
    <g transform="translate(404 -20)"><g class="pkA-fl pkA-d2" style="animation-delay:-2.8s"><use href="#pkAspk" class="pkA-rot" fill="#F2D48C" transform="scale(.6)"/></g></g>
  </g>
  <text class="pkA-cap" x="230" y="700">PALKI-E-SULTAN</text>
  <g class="pkA-orn" stroke="#D9A441" fill="none">
    <line x1="122" y1="726" x2="204" y2="726"/>
    <line x1="256" y1="726" x2="338" y2="726"/>
    <path d="M225 720 l6 6 -6 6 -6 -6Z"/>
  </g>
  <g transform="translate(62 250)"><use href="#pkAspk" class="pkA-twk" fill="#F2D48C"/></g>
  <g transform="translate(392 220) scale(.8)"><use href="#pkAspk" class="pkA-twk" fill="#F6EFE2" style="animation-delay:-.9s"/></g>
  <g transform="translate(70 660) scale(.7)"><use href="#pkAspk" class="pkA-twk" fill="#F2D48C" style="animation-delay:-1.8s"/></g>
</svg>