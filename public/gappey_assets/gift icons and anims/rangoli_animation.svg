          <g transform="rotate(67.5)"><g transform="translate(0 -66) scale(.68)"><path class="rg-q" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:.67s"/></g></g>
          <g transform="rotate(112.5)"><g transform="translate(0 -66) scale(.68)"><path class="rg-q" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:.89s"/></g></g>
          <g transform="rotate(157.5)"><g transform="translate(0 -66) scale(.68)"><path class="rg-q" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:1.11s"/></g></g>
          <g transform="rotate(202.5)"><g transform="translate(0 -66) scale(.68)"><path class="rg-q" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:1.33s"/></g></g>
          <g transform="rotate(247.5)"><g transform="translate(0 -66) scale(.68)"><path class="rg-q" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:1.55s"/></g></g>
          <g transform="rotate(292.5)"><g transform="translate(0 -66) scale(.68)"><path class="rg-q" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:1.77s"/></g></g>
          <g transform="rotate(337.5)"><g transform="translate(0 -66) scale(.68)"><path class="rg-q" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:1.99s"/></g></g>
        </g>
        <g fill="#E2557B" stroke="#B23A5C" stroke-width="1.5">
          <g transform="translate(0 -34)"><path class="rg-p" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z"/></g>
          <g transform="rotate(45)"><g transform="translate(0 -34)"><path class="rg-p" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:.22s"/></g></g>
          <g transform="rotate(90)"><g transform="translate(0 -34)"><path class="rg-p" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:.44s"/></g></g>
          <g transform="rotate(135)"><g transform="translate(0 -34)"><path class="rg-p" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:.66s"/></g></g>
          <g transform="rotate(180)"><g transform="translate(0 -34)"><path class="rg-p" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:.88s"/></g></g>
          <g transform="rotate(225)"><g transform="translate(0 -34)"><path class="rg-p" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:1.1s"/></g></g>
          <g transform="rotate(270)"><g transform="translate(0 -34)"><path class="rg-p" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:1.32s"/></g></g>
          <g transform="rotate(315)"><g transform="translate(0 -34)"><path class="rg-p" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z" style="animation-delay:1.54s"/></g></g>
        </g>
        <circle class="rg-C" r="16"/>
        <g fill="#F6EFE2">
          <circle class="rg-d1" cy="-170" r="4"/>
          <g transform="rotate(45)"><circle class="rg-d1" cy="-170" r="4" style="animation-delay:.08s"/></g>
          <g transform="rotate(90)"><circle class="rg-d1" cy="-170" r="4" style="animation-delay:.16s"/></g>
          <g transform="rotate(135)"><circle class="rg-d1" cy="-170" r="4" style="animation-delay:.24s"/></g>
          <g transform="rotate(180)"><circle class="rg-d1" cy="-170" r="4" style="animation-delay:.32s"/></g>
          <g transform="rotate(225)"><circle class="rg-d1" cy="-170" r="4" style="animation-delay:.4s"/></g>
          <g transform="rotate(270)"><circle class="rg-d1" cy="-170" r="4" style="animation-delay:.48s"/></g>
          <g transform="rotate(315)"><circle class="rg-d1" cy="-170" r="4" style="animation-delay:.56s"/></g>
        </g>
        <g fill="#F2A43D">
          <g transform="rotate(22.5)"><circle class="rg-d2" cy="-186" r="3" style="animation-delay:.3s"/></g>
          <g transform="rotate(67.5)"><circle class="rg-d2" cy="-186" r="3" style="animation-delay:.38s"/></g>
          <g transform="rotate(112.5)"><circle class="rg-d2" cy="-186" r="3" style="animation-delay:.46s"/></g>
          <g transform="rotate(157.5)"><circle class="rg-d2" cy="-186" r="3" style="animation-delay:.54s"/></g>
          <g transform="rotate(202.5)"><circle class="rg-d2" cy="-186" r="3" style="animation-delay:.62s"/></g>
          <g transform="rotate(247.5)"><circle class="rg-d2" cy="-186" r="3" style="animation-delay:.7s"/></g>
          <g transform="rotate(292.5)"><circle class="rg-d2" cy="-186" r="3" style="animation-delay:.78s"/></g>
          <g transform="rotate(337.5)"><circle class="rg-d2" cy="-186" r="3" style="animation-delay:.86s"/></g>
        </g>
