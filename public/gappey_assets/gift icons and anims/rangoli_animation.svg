    </g>
  </g>
  <text class="rg-cap" x="231" y="150">RANGOLI RANI</text>
  <g class="rg-orn" stroke="#8A4E63" fill="none">
    <line x1="118" y1="174" x2="204" y2="174"/>
    <line x1="256" y1="174" x2="342" y2="174"/>
    <path d="M225 168 l6 6 -6 6 -6 -6Z"/>
  </g>
  <g transform="translate(80 260)"><use href="#rgAspk" class="rg-twk" fill="#F2A43D"/></g>
  <g transform="translate(378 300) scale(.8)"><use href="#rgAspk" class="rg-twk" fill="#F6EFE2" style="animation-delay:-.7s"/></g>
  <g transform="translate(64 560) scale(.7)"><use href="#rgAspk" class="rg-twk" fill="#E2557B" style="animation-delay:-1.4s"/></g>
  <g transform="translate(390 620) scale(.85)"><use href="#rgAspk" class="rg-twk" fill="#F2A43D" style="animation-delay:-2s"/></g>
</svg>