<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <title>Rangoli Rani — full-screen gift animation</title>
  <defs>
    <radialGradient id="rgAsky" cx="50%" cy="45%" r="90%">
      <stop offset="0" stop-color="#231019"/><stop offset=".55" stop-color="#120812"/><stop offset="1" stop-color="#080309"/>
    </radialGradient>
    <radialGradient id="rgAglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E2557B" stop-opacity=".12"/><stop offset="1" stop-color="#E2557B" stop-opacity="0"/>
    </radialGradient>
    <path id="rgApet" d="M0 -26 C11 -20 13 -7 0 0 C-13 -7 -11 -20 0 -26 Z"/>
    <path id="rgAspk" d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10Z"/>
    <style>
      .rg-all{animation:rgAll 9s linear infinite}
      .rg-spin{animation:rgSpin 48s linear infinite;transform-origin:225px 430px}
      .rg-R1{fill:none;stroke:#F2B33D;stroke-width:2.5;stroke-dasharray:597;animation:rgDraw1 9s linear infinite}
      .rg-R3{fill:none;stroke:#E2557B;stroke-width:3;stroke-dasharray:943;animation:rgDraw3 9s linear infinite}
      .rg-R2{fill:none;stroke:#2FA08B;stroke-width:3;stroke-dasharray:7 9;transform-box:fill-box;transform-origin:center;animation:rgPop2 9s linear infinite}
      .rg-R4{fill:none;stroke:#F6EFE2;stroke-width:2.5;stroke-dasharray:2 11;transform-box:fill-box;transform-origin:center;animation:rgPop4 9s linear infinite}
      .rg-C{fill:#F2B33D;transform-box:fill-box;transform-origin:center;animation:rgC 9s linear infinite}
      .rg-p{fill:#E2557B;stroke:#B23A5C;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:rgP 9s linear infinite}
      .rg-q{fill:#F2A43D;stroke:#C97F2E;stroke-width:1.2;opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:rgQ 9s linear infinite}
      .rg-d1{fill:#F6EFE2;opacity:0;transform-box:fill-box;transform-origin:center;animation:rgD1 9s linear infinite}
      .rg-d2{fill:#F2A43D;opacity:0;transform-box:fill-box;transform-origin:center;animation:rgD2 9s linear infinite}
      .rg-cap{font:600 40px Georgia,'Times New Roman',serif;letter-spacing:12px;fill:#F2D3DC;text-anchor:middle;animation:rgCap 9s linear infinite}
      .rg-orn{animation:rgCap 9s linear infinite}
      .rg-twk{transform-box:fill-box;transform-origin:center;animation:rgTw 2.6s ease-in-out infinite}
      @keyframes rgAll{0%{opacity:0}2%{opacity:1}87%{opacity:1}95%,100%{opacity:0}}
      @keyframes rgSpin{to{transform:rotate(360deg)}}
      @keyframes rgDraw1{0%,10%{stroke-dashoffset:597}36%,100%{stroke-dashoffset:0}}
      @keyframes rgDraw3{0%,26%{stroke-dashoffset:943}50%,100%{stroke-dashoffset:0}}
      @keyframes rgPop2{0%,30%{opacity:0;transform:scale(.6)}38%,100%{opacity:.95;transform:scale(1)}}
      @keyframes rgPop4{0%,52%{opacity:0;transform:scale(.6)}60%,100%{opacity:.9;transform:scale(1)}}
      @keyframes rgC{0%,2%{opacity:0;transform:scale(0)}5%{opacity:1;transform:scale(1.3)}7%,100%{opacity:1;transform:scale(1)}}
      @keyframes rgP{0%,26%{opacity:0;transform:scale(0)}31%{opacity:1;transform:scale(1.18)}34%,100%{opacity:1;transform:scale(1)}}
      @keyframes rgQ{0%,31%{opacity:0;transform:scale(0)}36%{opacity:1;transform:scale(1.15)}39%,100%{opacity:1;transform:scale(1)}}
      @keyframes rgD1{0%,44%{opacity:0;transform:scale(0)}48%{opacity:1;transform:scale(1.4)}51%,100%{opacity:1;transform:scale(1)}}
      @keyframes rgD2{0%,48%{opacity:0;transform:scale(0)}52%{opacity:1;transform:scale(1.4)}55%,100%{opacity:1;transform:scale(1)}}
      @keyframes rgCap{0%,55%{opacity:0}62%{opacity:1}86%{opacity:1}94%,100%{opacity:0}}
      @keyframes rgTw{0%,100%{opacity:.06;transform:scale(.6)}50%{opacity:.85;transform:scale(1)}}
    </style>
  </defs>
  <rect width="450" height="800" fill="url(#rgAsky)"/>
  <circle cx="225" cy="430" r="260" fill="url(#rgAglow)"/>
