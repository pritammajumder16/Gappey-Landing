    <linearGradient id="l60pcp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DB2777"/><stop offset="1" stop-color="#9D174D"/></linearGradient>
    <linearGradient id="l60prg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE4D6"/><stop offset=".5" stop-color="#F5B79E"/><stop offset="1" stop-color="#CE8468"/></linearGradient>
    <linearGradient id="l60plg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#BE185D"/></linearGradient>
