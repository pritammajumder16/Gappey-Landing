    <circle cx="80.5" cy="46" r="1.5" fill="#2A1E17"/>
    <path d="M82 44.5 L83.6 43.4" stroke="#2A1E17" stroke-width="1" stroke-linecap="round"/>
    <circle cx="84.2" cy="41.6" r=".9" fill="#E11D48"/>
    <path d="M78.4 51.6 Q80.2 53.2 82 51.6" stroke="#D6336C" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <circle cx="66.8" cy="47.5" r="1.1" fill="#FFD34D"/><line x1="66.8" y1="48.6" x2="66.8" y2="51" stroke="#FFD34D" stroke-width="1"/><circle cx="66.8" cy="52" r="1.3" fill="#FFD34D"/>
    <g class="wv"><path d="M63 66 Q50 58 46 40" stroke="#FFF0F6" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="46" cy="37" r="4.2" fill="#F2C79B"/></g>
    <circle cx="150" cy="86" r="3" fill="#F472B6"/><circle cx="154.5" cy="95" r="3" fill="#FBCFE8"/><circle cx="158" cy="104" r="3" fill="#F472B6"/><circle cx="159.5" cy="113" r="3" fill="#FFF"/><circle cx="159" cy="121" r="3" fill="#F472B6"/>
    <circle cx="163" cy="102" r="7" fill="#FFE9A8" stroke="#D891B4" stroke-width="1.5"/><circle cx="161.5" cy="100.5" r="2.5" fill="#FFF"/>
    <rect x="161" y="124" width="13" height="9" rx="3" fill="#C3CAD4"/>
    <circle cx="52" cy="135" r="23" fill="#4A0A22"/><circle cx="140" cy="138" r="19" fill="#4A0A22"/>
    <g transform="translate(52 135)"><circle r="20" fill="#20242B"/><circle r="13" fill="#39404B"/><g class="whl"><path d="M0 -12 L0 12 M-12 0 L12 0 M-8.5 -8.5 L8.5 8.5 M-8.5 8.5 L8.5 -8.5" stroke="#C3CAD4" stroke-width="3.5" stroke-linecap="round"/></g><circle r="4" fill="#E2E7EE"/></g>
    <g transform="translate(140 138)"><circle r="17" fill="#20242B"/><circle r="10.5" fill="#39404B"/><g class="whl"><path d="M0 -9.5 L0 9.5 M-9.5 0 L9.5 0 M-6.7 -6.7 L6.7 6.7 M-6.7 6.7 L6.7 -6.7" stroke="#C3CAD4" stroke-width="3" stroke-linecap="round"/></g><circle r="3.4" fill="#E2E7EE"/></g>
    <path d="M29 135 A23 23 0 0 1 75 135" fill="none" stroke="#9D174D" stroke-width="6"/>
