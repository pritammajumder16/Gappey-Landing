  <rect x="0" y="176" width="760" height="2.5" fill="#BE185D" opacity=".18" class="clear"/>
  <ellipse class="shdw" cx="378" cy="179" rx="95" ry="8" fill="#9D174D" opacity=".25"/>
  <g transform="translate(288 22)"><g class="drive"><g class="sq"><g class="wob">
