    <circle class="dust" cx="62" cy="152" r="5" fill="#E8D5DD" style="animation-delay:.3s"/>
    <circle class="dust" cx="90" cy="152" r="4" fill="#E8D5DD" style="animation-delay:.8s"/>
    <circle class="dust" cx="40" cy="150" r="5.5" fill="#F0E0E8" style="animation-delay:1.3s"/>
    <rect x="12" y="128" width="11" height="6" rx="2" fill="#6B7280"/>
