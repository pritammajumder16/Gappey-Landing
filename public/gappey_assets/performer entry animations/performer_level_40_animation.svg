<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="l40pt" style="overflow:visible">
  <title id="l40pt">Performer Lv.40 entry — auto rickshaw</title>
  <defs>
    <linearGradient id="l40pcn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE7F3"/><stop offset="1" stop-color="#F9A8D4"/></linearGradient>
    <linearGradient id="l40pbd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DB2777"/><stop offset="1" stop-color="#BE185D"/></linearGradient>
    <linearGradient id="l40prb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#DB2777"/></linearGradient>
    <path id="l40ptw" d="M0 -6 Q1.2 -1.2 6 0 Q1.2 1.2 0 6 Q-1.2 1.2 -6 0 Q-1.2 -1.2 0 -6 Z"/>
    <path id="l40pht" d="M0 4.2 C-1.7 1.2 -5.4 0 -5.4 -2.7 C-5.4 -4.7 -3.7 -5.8 -2.1 -5.8 C-1 -5.8 0 -5 0 -4.1 C0 -5 1 -5.8 2.1 -5.8 C3.7 -5.8 5.4 -4.7 5.4 -2.7 C5.4 0 1.7 .8 0 4.2 Z"/>
  </defs>
  <style><![CDATA[
.drive{animation:drv 1.9s cubic-bezier(.2,.65,.3,1) both,outR 1.1s cubic-bezier(.4,.02,.9,.45) 4.3s forwards}
.wob{transform-box:fill-box;transform-origin:50% 92%;animation:wob .16s ease-in-out infinite alternate}
.sq{transform-box:fill-box;transform-origin:50% 100%;animation:squash .4s ease-out 1.9s both}
.whl{transform-box:fill-box;transform-origin:50% 50%;animation:roll 1.9s cubic-bezier(.25,.65,.35,1) 1 both,rollx .9s linear 4.3s forwards}
.wv{transform-box:fill-box;transform-origin:100% 100%;animation:wave 1.4s ease-in-out 2.5s infinite alternate}
.puf{transform-box:fill-box;transform-origin:50% 50%;animation:puff 1.4s linear infinite}
.puf2{animation-delay:-.5s}.puf3{animation-delay:-1s}
.dust{transform-box:fill-box;transform-origin:50% 50%;animation:dust .6s ease-out both}
.shdw{transform-box:fill-box;transform-origin:50% 50%;animation:shdw 1.9s ease-out both,outFade .6s ease-in 4.35s forwards}
.spd{animation:spd 1.9s ease-out both}
.spd2{animation-delay:.1s}
.honk{animation:honk .9s linear 2.15s both}
.beep{transform-box:fill-box;transform-origin:0 100%;animation:beep 1.05s ease-out 2.2s both}
.bdrop{animation:drop .7s cubic-bezier(.2,.8,.3,1.2) 2.4s both,outUp .6s ease-in 4.5s forwards}
.d1,.d2,.d3,.d4{transform-box:fill-box;transform-origin:50% 50%;animation:fly .8s ease-out 2.4s both}
.d1{animation-name:f1}.d2{animation-name:f2}.d3{animation-name:f3}.d4{animation-name:f4}
.clear{animation:outFade .55s ease-in 4.4s forwards}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.1s ease-in-out 2.9s infinite both}
.tw2{animation-delay:3.3s}.tw3{animation-delay:3.6s}.tw4{animation-delay:4s}
@keyframes drv{0%{transform:translateX(-640px)}72%{transform:translateX(10px)}86%{transform:translateX(-4px)}100%{transform:translateX(0)}}
@keyframes wob{from{transform:rotate(-1deg)}to{transform:rotate(1deg) translateY(-1.5px)}}
@keyframes squash{0%{transform:scale(1)}40%{transform:scale(1.04,.94)}100%{transform:scale(1)}}
@keyframes roll{to{transform:rotate(720deg)}}
@keyframes rollx{to{transform:rotate(1080deg)}}
@keyframes wave{from{transform:rotate(-4deg)}to{transform:rotate(-24deg)}}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.5}100%{opacity:0;transform:translate(-26px,-6px) scale(1.5)}}
@keyframes dust{0%{opacity:.55;transform:scale(.3)}100%{opacity:0;transform:translate(-14px,-10px) scale(1.4)}}
@keyframes shdw{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes spd{0%{opacity:0}30%{opacity:.7}80%{opacity:.5}100%{opacity:0}}
@keyframes honk{0%{opacity:0}8%{opacity:1}16%{opacity:0}24%{opacity:1}45%{opacity:1}60%{opacity:0}100%{opacity:0}}
@keyframes beep{0%{opacity:0;transform:translateY(4px) scale(.6)}12%{opacity:1;transform:translateY(0) scale(1.1)}20%{transform:scale(1)}70%{opacity:1}100%{opacity:0}}
@keyframes drop{0%{opacity:0;transform:translateY(-80px)}60%{opacity:1;transform:translateY(6px)}80%{transform:translateY(-3px)}100%{transform:translateY(0)}}
@keyframes f1{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}100%{opacity:0;transform:translate(-64px,-52px) rotate(160deg) scale(1)}}
@keyframes f2{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}100%{opacity:0;transform:translate(64px,-52px) rotate(-160deg) scale(1)}}
@keyframes f3{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}100%{opacity:0;transform:translate(-30px,-84px) rotate(200deg) scale(1)}}
@keyframes f4{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}100%{opacity:0;transform:translate(30px,-84px) rotate(-200deg) scale(1)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes outR{to{transform:translateX(880px)}}
@keyframes outUp{to{transform:translateY(-130px);opacity:0}}
@keyframes outFade{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.drive,.wob,.sq,.whl,.wv,.puf,.dust,.shdw,.spd,.honk,.beep,.bdrop,.d1,.d2,.d3,.d4,.clear,.tw{animation:none}}
  ]]></style>
