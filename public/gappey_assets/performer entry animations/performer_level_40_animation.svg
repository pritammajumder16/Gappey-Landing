    <path d="M22 86 L164 86 Q170 86 170 96 L170 128 Q170 140 156 140 L34 140 Q22 140 22 128 Z" fill="url(#l40pbd)"/>
    <rect x="27" y="84.5" width="133" height="2.5" fill="#F0B9A0"/>
