<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
<title>Stellar Rocket — Gappey gift cinematic</title>
<style>
*{transform-box:fill-box}
.all{animation:allOutA .7s ease 5.7s both}
@keyframes allOutA{to{opacity:0}}
.scIn{animation:scInA .3s ease both}
@keyframes scInA{from{opacity:0}to{opacity:1}}
.shk1{animation:s1A .55s ease .88s both}
@keyframes s1A{0%,100%{transform:none}15%{transform:translate(5px,-4px)}35%{transform:translate(-6px,4px)}55%{transform:translate(5px,3px)}75%{transform:translate(-4px,-3px)}}
.shk2{animation:s2A .4s ease 3.6s both}
@keyframes s2A{0%,100%{transform:none}20%{transform:translate(-8px,6px)}40%{transform:translate(8px,-7px)}60%{transform:translate(-6px,5px)}80%{transform:translate(5px,-4px)}}
.tw{animation:twA 2.3s ease-in-out var(--d,0s) infinite alternate}
@keyframes twA{from{opacity:.15}to{opacity:.85}}
.drift{animation:drA var(--dd,11s) ease-in-out var(--d,0s) infinite alternate}
@keyframes drA{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
.blink{animation:blA 1s ease-in-out infinite}
@keyframes blA{0%,100%{opacity:.2}50%{opacity:1}}
.dpop{opacity:0;animation:dpA .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes dpA{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
.padGlow{animation:pgA 1.4s ease .85s both}
@keyframes pgA{0%{opacity:.15}30%{opacity:.85}100%{opacity:.55}}
.ignF{transform-origin:center;opacity:0;animation:igA .5s ease-out .92s both}
@keyframes igA{0%{transform:scale(.3);opacity:0}20%{opacity:.95}100%{transform:scale(2.4);opacity:0}}
.ign{animation:ignOn .15s linear .88s both}
@keyframes ignOn{from{opacity:0}to{opacity:1}}
.puff{opacity:0;animation:pfA 1.8s ease-out var(--dl,0s) both}
@keyframes pfA{0%{transform:scale(calc(var(--sc,2)*.25));opacity:0}12%{opacity:var(--op,.5)}100%{transform:translate(var(--dx,0px),-100px) scale(var(--sc,2));opacity:0}}
.van{animation:vanA .07s linear 3.6s both}
@keyframes vanA{to{opacity:0}}
.fl{transform-origin:50% 0;animation:flA var(--fd,.16s) ease-in-out infinite alternate}
@keyframes flA{from{transform:scaleY(.78)}to{transform:scaleY(1.28)}}
.em{animation:emA var(--ed,.5s) linear var(--el,0s) infinite}
@keyframes emA{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(85px);opacity:0}}
.flash{transform-origin:center;opacity:0;animation:fxA .75s ease-out 3.6s both}
@keyframes fxA{0%{transform:scale(.2);opacity:0}15%{opacity:.95}100%{transform:scale(2.7);opacity:0}}
.ring{transform-origin:center;opacity:0;animation:riA 1s cubic-bezier(.15,.6,.3,1) 3.62s both}
@keyframes riA{0%{transform:scale(.15);opacity:0}12%{opacity:.9}100%{transform:scale(3.3);opacity:0}}
.spark{opacity:0;animation:spA .95s cubic-bezier(.1,.7,.3,1) 3.64s both}
@keyframes spA{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--tx),var(--ty));opacity:0}}
.starP{transform-origin:center;opacity:0;animation:stA .9s ease-out both}
@keyframes stA{0%{transform:scale(0) rotate(-60deg);opacity:0}35%{opacity:1}100%{transform:scale(1.3) rotate(40deg);opacity:0}}
.shoot{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:shA 1s ease-out 2.3s both}
@keyframes shA{0%{stroke-dashoffset:1;opacity:0}12%{opacity:.9}55%{stroke-dashoffset:0;opacity:.9}100%{stroke-dashoffset:0;opacity:0}}
.rise{animation:ri2A .6s cubic-bezier(.2,.8,.25,1) both}
@keyframes ri2A{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
.orn{animation:faA .5s ease both}
@keyframes faA{from{opacity:0}}
.sub{animation:suA .6s ease both}
@keyframes suA{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.drw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr2A .55s ease both}
@keyframes dr2A{to{stroke-dashoffset:0}}
.sweep{animation:swA .95s ease-in-out 4.85s both}
@keyframes swA{from{transform:translateX(-560px)}to{transform:translateX(1160px)}}
</style>
