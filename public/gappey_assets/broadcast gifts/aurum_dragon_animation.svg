.sum{transform-origin:center;opacity:0;animation:sumA .95s ease-out both;animation-delay:var(--d,0s)}
@keyframes sumA{0%{transform:scale(.3);opacity:0}20%{opacity:.55}100%{transform:scale(2.6);opacity:0}}
.hov{animation:hovA 1.7s ease-in-out infinite alternate}
@keyframes hovA{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.swy{transform-origin:50% 50%;animation:swyA 3s ease-in-out infinite alternate}
@keyframes swyA{from{transform:rotate(1.3deg)}to{transform:rotate(-1.3deg)}}
.wng{transform-origin:100% 80%;animation:wngA 2.4s ease-in-out infinite alternate}
@keyframes wngA{from{transform:rotate(4deg)}to{transform:rotate(-6deg)}}
.mn{animation:mnA .9s ease-in-out infinite alternate}
@keyframes mnA{from{opacity:.7}to{opacity:1}}
.eyeG{animation:eyeA 1.1s ease-in-out infinite alternate}
@keyframes eyeA{from{opacity:.7}to{opacity:1}}
.wk{transform-origin:0% 50%;animation:wkA 1.4s ease-in-out infinite alternate}
@keyframes wkA{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.tfan{transform-origin:0% 0%;animation:tfanA 1.9s ease-in-out infinite alternate}
@keyframes tfanA{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.breath{transform-origin:8% 0%;opacity:0;animation:brA .38s ease-out 3.08s both,brGA .12s linear 3.92s both}
@keyframes brA{0%{transform:scaleY(.05);opacity:0}60%{opacity:1}100%{transform:scaleY(1);opacity:1}}
@keyframes brGA{to{opacity:0}}
.mfl{transform-origin:center;opacity:0;animation:mflA .45s ease-out 3.08s both}
@keyframes mflA{0%{transform:scale(.3);opacity:.95}100%{transform:scale(2.2);opacity:0}}
.fem{animation:femA .55s linear infinite;animation-delay:var(--d,0s)}
@keyframes femA{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(70px);opacity:0}}
.fx{transform-origin:center;opacity:0;animation:fxA .75s ease-out 3.92s both}
@keyframes fxA{0%{transform:scale(.2);opacity:0}15%{opacity:.95}100%{transform:scale(2.7);opacity:0}}
.ring{transform-origin:center;opacity:0;animation:riA 1s cubic-bezier(.15,.6,.3,1) both}
@keyframes riA{0%{transform:scale(.15);opacity:0}12%{opacity:.9}100%{transform:scale(3.3);opacity:0}}
.spk{opacity:0;animation:spA .95s cubic-bezier(.1,.7,.3,1) both}
@keyframes spA{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--tx),var(--ty));opacity:0}}
.starP{transform-origin:center;opacity:0;animation:stA .9s ease-out both}
@keyframes stA{0%{transform:scale(0) rotate(-60deg);opacity:0}35%{opacity:1}100%{transform:scale(1.3) rotate(40deg);opacity:0}}
.rise{animation:ri2A .6s cubic-bezier(.2,.8,.25,1) both}
@keyframes ri2A{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
.orn{animation:oA .5s ease both}
@keyframes oA{from{opacity:0}}
.sub{animation:suB .6s ease both}
@keyframes suB{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.drw{stroke-dasharray:1;stroke-dashoffset:1;animation:dwA .55s ease both}
