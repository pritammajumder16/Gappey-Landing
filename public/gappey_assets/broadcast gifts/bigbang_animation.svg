<style>
.sing,.singG,.preRing,.ringB,.neb,.galPop,.spk,.starP,.strk,.cm,.zm{transform-box:fill-box;transform-origin:center}
.all{animation:allOutA .7s ease 5.7s both}
@keyframes allOutA{to{opacity:0}}
.scIn{animation:scInA .35s ease both}
@keyframes scInA{from{opacity:0}to{opacity:1}}
.zm{animation:zmA 5s ease 1.35s forwards}
@keyframes zmA{from{transform:scale(1)}to{transform:scale(1.05)}}
.shkX{animation:shxA .5s ease 1.36s both}
