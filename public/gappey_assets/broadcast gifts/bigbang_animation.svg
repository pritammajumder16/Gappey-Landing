.starsIn{opacity:0;animation:stInA 1s ease 1.7s forwards}
@keyframes stInA{to{opacity:1}}
.sing{animation:sPulseA .55s ease-in-out infinite alternate,sInA .42s ease-in .95s forwards,sOutA .2s ease 1.35s forwards}
@keyframes sPulseA{from{transform:scale(1)}to{transform:scale(1.4)}}
@keyframes sInA{to{transform:scale(.32)}}
@keyframes sOutA{to{opacity:0}}
.singG{animation:sGPulseA .55s ease-in-out infinite alternate,sGInA .42s ease-in .95s forwards,sOutA .25s ease 1.35s forwards}
@keyframes sGPulseA{from{transform:scale(1);opacity:.55}to{transform:scale(1.5);opacity:.8}}
@keyframes sGInA{to{transform:scale(2.1);opacity:1}}
.preRing{opacity:0;animation:prA 1s ease-in both}
@keyframes prA{0%{transform:scale(2.3);opacity:0}25%{opacity:.5}100%{transform:scale(.12);opacity:.9}}
.pr1{animation-delay:.4s}.pr2{animation-delay:.62s}.pr3{animation-delay:.2s}
.flashAll{opacity:0;animation:flA .65s ease-out 1.35s both}
@keyframes flA{0%{opacity:0}9%{opacity:1}100%{opacity:0}}
.glowSpace{opacity:0;animation:gsA 1.6s ease 1.5s forwards}
@keyframes gsA{to{opacity:.5}}
.ringB{opacity:0;animation:rbA 1.3s cubic-bezier(.15,.6,.3,1) both}
@keyframes rbA{0%{transform:scale(.04);opacity:0}10%{opacity:.95}100%{transform:scale(8.5);opacity:0}}
.strk{opacity:0;animation:stA var(--du,1.2s) cubic-bezier(.15,.75,.3,1) var(--dl,1.42s) both}
@keyframes stA{0%{transform:translateX(0);opacity:0}8%{opacity:.95}100%{transform:translateX(var(--td,520px));opacity:0}}
.neb{opacity:0;animation:nbA 2.4s cubic-bezier(.2,.7,.3,1) var(--dl,1.6s) forwards}
@keyframes nbA{0%{transform:scale(.25) translate(30px,20px);opacity:0}30%{opacity:.42}100%{transform:scale(1) translate(0,0);opacity:var(--no,.3)}}
.galPop{opacity:0;animation:gpA 1s cubic-bezier(.2,1.2,.35,1) both}
@keyframes gpA{0%{opacity:0;transform:scale(.15)}55%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
.galA{animation-delay:2.55s}.galB{animation-delay:2.85s}
.spinA{transform-box:fill-box;transform-origin:center;animation:spA 46s linear infinite}
.spinB{transform-box:fill-box;transform-origin:center;animation:spA 60s linear infinite reverse}
@keyframes spA{to{transform:rotate(360deg)}}
.spk{opacity:0;animation:spkA 1.1s cubic-bezier(.1,.7,.3,1) both}
@keyframes spkA{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--tx),var(--ty));opacity:0}}
.starP{opacity:0;animation:starPA .95s ease-out both}
@keyframes starPA{0%{transform:scale(0) rotate(-60deg);opacity:0}35%{opacity:1}100%{transform:scale(1.3) rotate(40deg);opacity:0}}
.cm{opacity:0;animation:cmA 3.2s linear var(--dl,2s) infinite}
@keyframes cmA{0%{transform:translateX(70px);opacity:0}15%{opacity:.7}100%{transform:translateX(240px);opacity:0}}
.shoot{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:shoA .9s ease-out both}
@keyframes shoA{0%{stroke-dashoffset:1;opacity:0}12%{opacity:.85}55%{stroke-dashoffset:0;opacity:.85}100%{stroke-dashoffset:0;opacity:0}}
.sh1{animation-delay:2.3s}.sh2{animation-delay:4.55s}
.rise{animation:ri2A .6s cubic-bezier(.2,.8,.25,1) both}
@keyframes ri2A{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
.orn{animation:oA .5s ease both}
@keyframes oA{from{opacity:0}}
.sub{animation:suA .6s ease both}
@keyframes suA{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.drw{stroke-dasharray:1;stroke-dashoffset:1;animation:dwA .55s ease both}
@keyframes dwA{to{stroke-dashoffset:0}}
.sw{animation:swA .95s ease-in-out 4.45s both}
@keyframes swA{from{transform:translateX(-560px)}to{transform:translateX(1180px)}}
</style>
