  <style><![CDATA[
.crp{transform-box:fill-box;transform-origin:100% 50%;animation:unroll .7s ease-out .1s both,outCarp .7s ease-in 4.5s forwards}
.drive{animation:drv 2.2s cubic-bezier(.2,.6,.3,1) both,outR 1.2s cubic-bezier(.4,.02,.9,.45) 4.3s forwards}
.bob{animation:bobA 1.1s ease-in-out infinite}
.tlift{transform-box:fill-box;transform-origin:20% 6%;animation:tlift .5s ease-out 2.35s both}
.tsw{transform-box:fill-box;transform-origin:20% 6%;animation:sway 2.2s ease-in-out infinite alternate}
.ear{transform-box:fill-box;transform-origin:50% 4%;animation:flap 1.3s ease-in-out infinite alternate}
.tail{transform-box:fill-box;transform-origin:80% 0%;animation:sway 1.4s ease-in-out infinite alternate}
.ts{transform-box:fill-box;transform-origin:50% 0%;animation:sway 1.6s ease-in-out infinite alternate}
.wv{transform-box:fill-box;transform-origin:100% 100%;animation:wave 1.5s ease-in-out 2.6s infinite alternate}
.dust{transform-box:fill-box;transform-origin:50% 50%;animation:dust .7s ease-out both}
.note{transform-box:fill-box;transform-origin:50% 50%;animation:note .9s ease-out both}
.n1{animation-delay:2.6s}.n2{animation-delay:2.8s}.n3{animation-delay:3s}
.bdrop{animation:drop .7s cubic-bezier(.2,.8,.3,1.2) 2.5s both,outUp .6s ease-in 4.5s forwards}
.ping{transform-box:fill-box;transform-origin:50% 50%;animation:ping .6s ease-out 2.65s both}
.d1,.d2,.d3,.d4{transform-box:fill-box;transform-origin:50% 50%;animation:fly .8s ease-out 2.7s both}
.d1{animation-name:f1}.d2{animation-name:f2}.d3{animation-name:f3}.d4{animation-name:f4}
.shdw{transform-box:fill-box;transform-origin:50% 50%;animation:shdw 1.9s ease-out both,outFade .6s ease-in 4.35s forwards}
.clear{animation:outFade .55s ease-in 4.4s forwards}
.fl{transform-box:fill-box;transform-origin:50% 50%;animation:fall linear infinite}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.1s ease-in-out 3s infinite both}
.tw2{animation-delay:3.4s}.tw3{animation-delay:3.7s}.tw4{animation-delay:4.1s}
@keyframes unroll{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drv{0%{transform:translateX(-640px)}74%{transform:translateX(10px)}87%{transform:translateX(-4px)}100%{transform:translateX(0)}}
@keyframes bobA{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tlift{from{transform:rotate(0)}to{transform:rotate(-26deg)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes flap{from{transform:rotate(-6deg)}to{transform:rotate(5deg)}}
@keyframes wave{from{transform:rotate(-4deg)}to{transform:rotate(-22deg)}}
@keyframes dust{0%{opacity:.5;transform:scale(.3)}100%{opacity:0;transform:translate(-12px,-10px) scale(1.4)}}
@keyframes note{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(-10deg)}25%{opacity:1}100%{opacity:0;transform:translate(14px,-34px) rotate(14deg) scale(1.1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-80px)}60%{opacity:1;transform:translateY(6px)}80%{transform:translateY(-3px)}100%{transform:translateY(0)}}
@keyframes ping{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(1.9)}}
@keyframes f1{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}100%{opacity:0;transform:translate(-70px,-50px) rotate(160deg) scale(1)}}
@keyframes f2{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}100%{opacity:0;transform:translate(70px,-50px) rotate(-160deg) scale(1)}}
@keyframes f3{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}100%{opacity:0;transform:translate(-34px,-82px) rotate(200deg) scale(1)}}
@keyframes f4{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}100%{opacity:0;transform:translate(34px,-82px) rotate(-200deg) scale(1)}}
@keyframes shdw{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes fall{0%{opacity:0;transform:translateY(-24px) rotate(0)}12%{opacity:1}88%{opacity:.9}100%{opacity:0;transform:translateY(215px) rotate(220deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes outR{to{transform:translateX(880px)}}
@keyframes outUp{to{transform:translateY(-130px);opacity:0}}
@keyframes outFade{to{opacity:0}}
@keyframes outCarp{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.crp,.drive,.bob,.tlift,.tsw,.ear,.tail,.ts,.wv,.dust,.note,.bdrop,.ping,.d1,.d2,.d3,.d4,.shdw,.clear,.fl,.tw{animation:none}}
  ]]></style>
