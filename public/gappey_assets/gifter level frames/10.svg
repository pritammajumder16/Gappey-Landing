<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="g10t">
  <title id="g10t">Gifter Lv.10 frame — Rise</title>
  <defs>
    <linearGradient id="g10r" x1="30" y1="18" x2="170" y2="182" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#BAE6FD"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <radialGradient id="g10h" cx=".5" cy=".5" r=".5"><stop offset=".72" stop-color="#3B82F6" stop-opacity="0"/><stop offset=".84" stop-color="#3B82F6" stop-opacity=".3"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="g10b" x1="0" y1="163" x2="0" y2="189" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
  </defs>
  <style><![CDATA[
.halo,.comet,.comet2,.rays,.rays2,.dash{transform-box:view-box;transform-origin:50% 50%}.gem,.crown,.tw{transform-box:fill-box;transform-origin:50% 50%}
.halo{animation:breathe 3.6s ease-in-out infinite alternate}.comet{animation:spin 7s linear infinite}.comet2{animation:spinrev 9s linear infinite}.rays{animation:spinrev 26s linear infinite}.rays2{animation:spin 34s linear infinite}.dash{animation:spin 16s linear infinite}.gem{animation:twinkle 2.4s ease-in-out infinite}.crown{animation:pulse 2.8s ease-in-out infinite alternate}.tw{animation:twinkle 1.9s ease-in-out infinite}
.g2{animation-delay:-.6s}.g3{animation-delay:-1.2s}.g4{animation-delay:-1.8s}.g5{animation-delay:-.3s}
@keyframes breathe{from{transform:scale(.97);opacity:.7}to{transform:scale(1.06);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinrev{to{transform:rotate(-360deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.halo,.comet,.comet2,.rays,.rays2,.dash,.gem,.crown,.tw{animation:none}}
  ]]></style>
  <circle class="halo" cx="100" cy="100" r="96" fill="url(#g10h)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#60A5FA" stroke-opacity=".35" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#g10r)" stroke-width="8"/>
  <circle cx="100" cy="100" r="74.8" fill="none" stroke="#FFF" stroke-opacity=".5" stroke-width="1.4"/>
  <g transform="rotate(45 100 100)"><g class="gem"><circle cx="100" cy="20" r="3.4" fill="#E0F2FE"/><circle cx="98.9" cy="18.9" r="1.1" fill="#FFF"/></g></g>
  <g transform="rotate(135 100 100)"><g class="gem g2"><circle cx="100" cy="20" r="3.4" fill="#E0F2FE"/><circle cx="98.9" cy="18.9" r="1.1" fill="#FFF"/></g></g>
  <g transform="rotate(225 100 100)"><g class="gem g3"><circle cx="100" cy="20" r="3.4" fill="#E0F2FE"/><circle cx="98.9" cy="18.9" r="1.1" fill="#FFF"/></g></g>
  <g transform="rotate(315 100 100)"><g class="gem g4"><circle cx="100" cy="20" r="3.4" fill="#E0F2FE"/><circle cx="98.9" cy="18.9" r="1.1" fill="#FFF"/></g></g>
  <g class="comet"><circle cx="100" cy="100" r="80" fill="none" stroke="#FFF" stroke-opacity=".9" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="30 473"/></g>
  <rect x="66" y="165.5" width="68" height="26" rx="13" fill="#0B2545" opacity=".35"/>
  <rect x="64.5" y="163" width="71" height="26" rx="13" fill="url(#g10b)" stroke="#FFF" stroke-width="2"/>
  <rect x="70" y="166.5" width="60" height="7" rx="3.5" fill="#FFF" opacity=".28"/>
  <text x="100" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2" fill="#FFF">LVL 10</text>
</svg>