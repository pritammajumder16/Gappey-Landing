    <radialGradient id="g40h" cx=".5" cy=".5" r=".5"><stop offset=".72" stop-color="#60A5FA" stop-opacity="0"/><stop offset=".84" stop-color="#60A5FA" stop-opacity=".36"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
    <linearGradient id="g40b" x1="0" y1="163" x2="0" y2="189" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1D4ED8"/><stop offset="1" stop-color="#172554"/></linearGradient>
