  <g transform="rotate(135 100 100)"><g class="gem g2"><path d="M100 14.6 L105.4 20 L100 25.4 L94.6 20 Z" fill="#22D3EE" stroke="#E0F2FE" stroke-width="1"/></g></g>
  <g transform="rotate(225 100 100)"><g class="gem g3"><path d="M100 14.6 L105.4 20 L100 25.4 L94.6 20 Z" fill="#22D3EE" stroke="#E0F2FE" stroke-width="1"/></g></g>
