<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" role="img" aria-labelledby="pb30t" style="overflow:visible">
  <title id="pb30t">Performer Lv.30 chat bubble</title>
  <defs>
    <linearGradient id="p30bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BE185D"/><stop offset=".18" stop-color="#DB2777"/><stop offset=".5" stop-color="#F472B6"/><stop offset=".82" stop-color="#DB2777"/><stop offset="1" stop-color="#BE185D"/></linearGradient>
    <linearGradient id="p30gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity=".4"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <clipPath id="p30cp"><rect width="100%" height="64" rx="16"/></clipPath>
    <filter id="p30bl" x="-40%" y="-150%" width="180%" height="400%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="p30ht" d="M0 4.2 C-1.7 1.2 -5.4 0 -5.4 -2.7 C-5.4 -4.7 -3.7 -5.8 -2.1 -5.8 C-1 -5.8 0 -5 0 -4.1 C0 -5 1 -5.8 2.1 -5.8 C3.7 -5.8 5.4 -4.7 5.4 -2.7 C5.4 0 1.7 1.2 0 4.2 Z"/>
  </defs>
  <style><![CDATA[
.aura{transform-box:view-box;transform-origin:50% 50%;animation:breathe 3.6s ease-in-out infinite alternate}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.2s ease-in-out infinite}
.tw2{animation-delay:-1.1s}.tw3{animation-delay:-.7s}.tw4{animation-delay:-1.6s}
@keyframes breathe{from{transform:scale(.97);opacity:.7}to{transform:scale(1.06);opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.aura,.tw{animation:none}}
  ]]></style>
  <rect class="aura" width="100%" height="64" rx="16" fill="#EC4899" opacity=".55" filter="url(#p30bl)"/>
  <rect width="100%" height="64" rx="16" fill="url(#p30bg)" stroke="#F9A8D4" stroke-width="1.5"/>
  <g clip-path="url(#p30cp)">
    <ellipse cx="50%" cy="8" rx="40%" ry="9" fill="url(#p30gl)" opacity=".55"/>
    <use href="#p30ht" x="22%" y="12" class="tw" fill="#FBCFE8"/>
    <use href="#p30ht" x="78%" y="12" class="tw tw2" fill="#FBCFE8"/>
    <use href="#p30ht" x="40%" y="52" class="tw tw3" fill="#F9A8D4"/>
    <use href="#p30ht" x="60%" y="52" class="tw tw4" fill="#F9A8D4"/>
  </g>
</svg>