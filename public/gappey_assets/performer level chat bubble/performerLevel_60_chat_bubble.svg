<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" role="img" aria-labelledby="pb50t" style="overflow:visible">
  <title id="pb50t">Performer Lv.50 chat bubble</title>
  <defs>
    <linearGradient id="p50bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#500724"/><stop offset=".5" stop-color="#831843"/><stop offset="1" stop-color="#500724"/></linearGradient>
    <linearGradient id="p50mt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5B79E" stop-opacity="0"/><stop offset=".5" stop-color="#F5B79E" stop-opacity=".5"/><stop offset="1" stop-color="#F5B79E" stop-opacity="0"/></linearGradient>
    <linearGradient id="p50gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity=".38"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <clipPath id="p50cp"><rect width="100%" height="64" rx="16"/></clipPath>
    <filter id="p50bl" x="-40%" y="-150%" width="180%" height="400%"><feGaussianBlur stdDeviation="7"/></filter>
    <path id="p50sp" d="M0 -5 Q1 -1 5 0 Q1 1 0 5 Q-1 1 -5 0 Q-1 -1 0 -5 Z"/>
    <path id="p50ht" d="M0 4.2 C-1.7 1.2 -5.4 0 -5.4 -2.7 C-5.4 -4.7 -3.7 -5.8 -2.1 -5.8 C-1 -5.8 0 -5 0 -4.1 C0 -5 1 -5.8 2.1 -5.8 C3.7 -5.8 5.4 -4.7 5.4 -2.7 C5.4 0 1.7 1.2 0 4.2 Z"/>
  </defs>
  <style><![CDATA[
.aura{transform-box:view-box;transform-origin:50% 50%;animation:breathe 3.6s ease-in-out infinite alternate}
.aura2{transform-box:view-box;transform-origin:50% 50%;animation:glowpulse 3s ease-in-out infinite alternate}
.metal{animation:metalshift 5s ease-in-out infinite alternate}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.2s ease-in-out infinite}
.tw2{animation-delay:-.5s}.tw3{animation-delay:-.9s}.tw4{animation-delay:-1.3s}.tw5{animation-delay:-1.7s}.tw6{animation-delay:-.3s}
.iring{animation:dashcrawl 3.2s linear infinite}
.drift{animation:drift 4s ease-in-out infinite}
.d2{animation-delay:-1.1s}.d3{animation-delay:-2.2s}.d4{animation-delay:-3.3s}
@keyframes breathe{from{transform:scale(.97);opacity:.7}to{transform:scale(1.06);opacity:1}}
@keyframes glowpulse{from{opacity:.18}to{opacity:.45}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes dashcrawl{to{stroke-dashoffset:-48}}
@keyframes metalshift{from{opacity:.22}to{opacity:.55}}
@keyframes drift{0%{transform:translateY(6px);opacity:0}25%{opacity:.95}70%{opacity:.55}100%{transform:translateY(-15px);opacity:0}}
@media (prefers-reduced-motion:reduce){.aura,.aura2,.metal,.tw,.iring,.drift{animation:none}}
  ]]></style>
  <rect class="aura" width="100%" height="64" rx="16" fill="#F472B6" opacity=".5" filter="url(#p50bl)"/>
  <rect class="aura2" width="100%" height="64" rx="16" fill="#F6C1AC" opacity=".3" filter="url(#p50bl)"/>
  <rect width="100%" height="64" rx="16" fill="url(#p50bg)" stroke="#F0B9A0" stroke-width="1.8"/>
  <g clip-path="url(#p50cp)">
    <rect class="metal" width="100%" height="64" fill="url(#p50mt)"/>
    <ellipse cx="50%" cy="8" rx="40%" ry="9" fill="url(#p50gl)" opacity=".55"/>
    <g class="drift"><use href="#p50ht" x="14%" y="18" fill="#F6C1AC"/></g>
    <g class="drift d2"><use href="#p50ht" x="34%" y="14" fill="#FFE4E1"/></g>
    <g class="drift d3"><use href="#p50ht" x="66%" y="19" fill="#F6C1AC"/></g>
    <g class="drift d4"><use href="#p50ht" x="86%" y="15" fill="#FFE4E1"/></g>
    <use href="#p50ht" x="24%" y="9" class="tw" fill="#F9A8D4"/>
    <use href="#p50ht" x="76%" y="9" class="tw tw2" fill="#F9A8D4"/>
    <use href="#p50sp" x="38%" y="55" class="tw tw3" fill="#F6C1AC"/>
    <use href="#p50sp" x="62%" y="55" class="tw tw4" fill="#F6C1AC"/>
    <use href="#p50ht" x="12%" y="50" class="tw tw5" fill="#F9A8D4"/>
    <use href="#p50ht" x="88%" y="50" class="tw tw6" fill="#F9A8D4"/>
  </g>
  <rect width="100%" height="64" rx="16" fill="none" stroke="#F0B9A0" stroke-width="1.8"/>
  <rect class="iring" width="100%" height="64" rx="16" fill="none" stroke="#FFE4E1" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="5 7"/>
</svg>