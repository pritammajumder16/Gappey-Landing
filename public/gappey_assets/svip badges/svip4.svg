<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 26" width="66" height="26">
<title>SVIP 4 Badge</title>
<defs>
<radialGradient id="ps4s" cx=".4" cy=".35" r=".95">
<stop offset="0" stop-color="#fffbe8"/><stop offset=".45" stop-color="#ffd97a">
<animate attributeName="stop-color" values="#ffd97a;#ffe9a8;#ffd97a" dur="3.5s" repeatCount="indefinite"/>
</stop><stop offset="1" stop-color="#a8761a"/>
</radialGradient>
<filter id="ps4t" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
<clipPath id="ps4c2"><polygon points="14.5,4 57.5,4 62.5,13 57.5,22 14.5,22 9.5,13"/></clipPath>
</defs>

<polygon points="14.5,4 57.5,4 62.5,13 57.5,22 14.5,22 9.5,13" fill="none" stroke="#ffe9a8" stroke-width="2.6" opacity=".4">
<animate attributeName="opacity" values=".3;.55;.3" dur="2.6s" repeatCount="indefinite"/>
</polygon>

<polygon points="14.5,4 57.5,4 62.5,13 57.5,22 14.5,22 9.5,13" fill="url(#ps4s)" stroke="#8a5f08" stroke-width="1.1"/>
<polygon points="16.5,6.3 56,6.3 59.8,13 56,19.7 16.5,19.7 12.8,13" fill="none" stroke="#fff6d8" stroke-width=".6" opacity=".6"/>

<!-- dark panel: wide margins, text sits well inside -->
<polygon points="25.6,7.4 54.2,7.4 56.8,13 54.2,18.6 25.6,18.6 23,13" fill="#241a08" opacity=".93"/>
<path d="M24.4 8.2 H53.6 L55.6 13 L53.6 17.8 H24.4 L22.4 13 Z" fill="none" stroke="#ffe89e" stroke-width=".4" opacity=".45"/>

<!-- halo + star emblem -->
<ellipse cx="17.5" cy="8.6" rx="4.6" ry="1.4" fill="none" stroke="#ffffff" stroke-width=".8" opacity=".85">
<animate attributeName="opacity" values=".55;.55;1;.55" keyTimes="0;.55;.62;1" dur="9s" repeatCount="indefinite"/>
</ellipse>
<path d="M17.5 9.2 L18.4 11.6 L20.8 12.4 L18.4 13.2 L17.5 15.6 L16.6 13.2 L14.2 12.4 L16.6 11.6 Z" fill="#fffdf2" stroke="#8a5f08" stroke-width=".3"/>

<!-- text centered with ~2px clear each side -->
<text x="40" y="17.2" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="#ffd97a" filter="url(#ps4t)" opacity=".6">SVIP 4
&lt;animate attributeName="opacity" values=".35;.85;.35" dur="2.6s" repeatCount="indefinite"/&gt;
</text>
<text x="40" y="17.4" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="#2b1d08" opacity=".55">SVIP 4</text>
<text x="40" y="17.2" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="800" fill="#fffdf2">SVIP 4</text>

<!-- orbit spark -->
<g><animateTransform attributeName="transform" type="rotate" values="0 17.5 13;360 17.5 13" dur="6s" repeatCount="indefinite"/>
<circle cx="21.2" cy="13" r=".7" fill="#ffffff" opacity=".9"/></g>

<!-- 9s Verdict flash -->
<rect width="66" height="26" fill="#fff7df" opacity="0">
<animate attributeName="opacity" values="0;0;.22;0;0" keyTimes="0;.55;.6;.68;1" dur="9s" repeatCount="indefinite"/>
</rect>
<polygon points="14.5,4 57.5,4 62.5,13 57.5,22 14.5,22 9.5,13" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0">
<animate attributeName="opacity" values="0;0;.7;0;0" keyTimes="0;.55;.6;.68;1" dur="9s" repeatCount="indefinite"/>
</polygon>
</svg>