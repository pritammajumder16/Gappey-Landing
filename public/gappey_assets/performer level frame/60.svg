.halo{animation:breathe 3.6s ease-in-out infinite alternate}.comet{animation:spin 7s linear infinite}.comet2{animation:spinrev 9s linear infinite}.rays{animation:spinrev 26s linear infinite}.rays2{animation:spin 34s linear infinite}.dash{animation:spin 16s linear infinite}.dash2{animation:spinrev 20s linear infinite}.pearls{animation:spinrev 36s linear infinite}.lightrot{animation:spin 12s linear infinite}.sheen{animation:spin 11s linear infinite}.corbit{animation:spin 5s linear infinite}.corbit2{animation:spinrev 7.5s linear infinite}.cstar{animation:spin 24s linear infinite}.gem{animation:twinkle 2.4s ease-in-out infinite}.crown{animation:pulse 2.8s ease-in-out infinite alternate}.tw{animation:twinkle 1.9s ease-in-out infinite}.rpulse{animation:rpulse 4.5s ease-in-out infinite alternate}
