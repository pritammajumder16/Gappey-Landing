  <style><![CDATA[
.halo,.comet,.comet2,.rays,.rays2,.dash{transform-box:view-box;transform-origin:50% 50%}.gem,.crown,.tw{transform-box:fill-box;transform-origin:50% 50%}
.halo{animation:breathe 3.6s ease-in-out infinite alternate}.comet{animation:spin 7s linear infinite}.comet2{animation:spinrev 9s linear infinite}.rays{animation:spinrev 26s linear infinite}.rays2{animation:spin 34s linear infinite}.dash{animation:spin 16s linear infinite}.gem{animation:twinkle 2.4s ease-in-out infinite}.crown{animation:pulse 2.8s ease-in-out infinite alternate}.tw{animation:twinkle 1.9s ease-in-out infinite}
.g2{animation-delay:-.6s}.g3{animation-delay:-1.2s}.g4{animation-delay:-1.8s}.g5{animation-delay:-.3s}
@keyframes breathe{from{transform:scale(.97);opacity:.7}to{transform:scale(1.06);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinrev{to{transform:rotate(-360deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.halo,.comet,.comet2,.rays,.rays2,.dash,.gem,.crown,.tw{animation:none}}
  ]]></style>
