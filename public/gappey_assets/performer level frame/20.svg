  <defs>
    <linearGradient id="p20r" x1="30" y1="18" x2="170" y2="182" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#831843"/><stop offset=".3" stop-color="#F472B6"/><stop offset=".5" stop-color="#FBCFE8"/><stop offset=".72" stop-color="#DB2777"/><stop offset="1" stop-color="#9D174D"/></linearGradient>
    <radialGradient id="p20h" cx=".5" cy=".5" r=".5"><stop offset=".72" stop-color="#EC4899" stop-opacity="0"/><stop offset=".84" stop-color="#EC4899" stop-opacity=".34"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
    <linearGradient id="p20b" x1="0" y1="163" x2="0" y2="189" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#DB2777"/><stop offset="1" stop-color="#9D174D"/></linearGradient>
