<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="nf-title">
  <title id="nf-title">Newcomer avatar frame — fresh sprout ring</title>

  <defs>
    <linearGradient id="nf-ring" x1="30" y1="18" x2="170" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0"  stop-color="#8CF5BC"/>
      <stop offset=".5" stop-color="#3DDC97"/>
      <stop offset="1"  stop-color="#25BFA4"/>
    </linearGradient>

    <!-- aura hugs the ring, never tints the avatar's face -->
    <radialGradient id="nf-halo" cx=".5" cy=".5" r=".5">
      <stop offset=".68" stop-color="#3EE58F" stop-opacity="0"/>
      <stop offset=".80" stop-color="#3EE58F" stop-opacity=".33"/>
      <stop offset=".90" stop-color="#3EE58F" stop-opacity=".16"/>
      <stop offset="1"   stop-color="#3EE58F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nf-badge" x1="0" y1="163" x2="0" y2="189" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BF2B9"/>
      <stop offset="1" stop-color="#2FC585"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .halo, .tw, .sprout, .comet-orbit { transform-box: fill-box; }
    .halo, .tw, .comet-orbit { transform-origin: 50% 50%; }
    .sprout { transform-origin: 50% 100%; }

    /* aura breathes */
    .halo { animation: nf-breathe 3.6s ease-in-out infinite alternate; }
    @keyframes nf-breathe {
      from { transform: scale(.97); opacity: .75; }
      to   { transform: scale(1.05); opacity: 1;  }
    }

    /* highlight orbits the ring (whole group rotates) */
    .comet-orbit { animation: nf-orbit 7s linear infinite; }
    @keyframes nf-orbit {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* two twinkles, out of phase */
    .tw.a { animation: nf-twinkle 2s   ease-in-out infinite; }
    .tw.b { animation: nf-twinkle 2.6s ease-in-out -1.4s infinite; }
    @keyframes nf-twinkle {
      0%, 100% { opacity: 0; transform: scale(.3); }
      50%      { opacity: 1; transform: scale(1);  }
    }

    /* sprout sways */
    .sprout { animation: nf-sway 2.3s ease-in-out infinite alternate; }
    @keyframes nf-sway {
      from { transform: rotate(-7deg); }
      to   { transform: rotate(7deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .halo, .comet-orbit, .tw, .sprout { animation: none; }
    }
  ]]></style>

  <!-- breathing aura -->
  <circle class="halo" cx="100" cy="100" r="96" fill="url(#nf-halo)"/>

  <!-- faint track + gradient ring (fully drawn, no intro) -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#2FBF8A" stroke-opacity=".18" stroke-width="10"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#nf-ring)" stroke-width="10" stroke-linecap="round"/>

  <!-- hairlines -->
  <circle cx="100" cy="100" r="84.5" fill="none" stroke="#2FBF8A" stroke-opacity=".3" stroke-width="1"/>
  <circle cx="100" cy="100" r="72.6" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.6"/>

  <!-- orbiting highlight -->
  <g class="comet-orbit">
    <circle cx="100" cy="100" r="78" fill="none" stroke="#FFFFFF" stroke-opacity=".95"
            stroke-width="3.6" stroke-linecap="round" stroke-dasharray="36 455"
            transform="rotate(-90 100 100)"/>
  </g>

  <!-- twinkles -->
  <g transform="translate(40 42) scale(1.15)">
    <path class="tw a" d="M0 -5 Q1 -1 5 0 Q1 1 0 5 Q-1 1 -5 0 Q-1 -1 0 -5 Z" fill="#7CEFAD"/>
  </g>
  <g transform="translate(161 44) scale(.9)">
    <path class="tw b" d="M0 -5 Q1 -1 5 0 Q1 1 0 5 Q-1 1 -5 0 Q-1 -1 0 -5 Z" fill="#7CEFAD"/>
  </g>

  <!-- NEW badge with sprout -->
  <g class="badge">
    <rect x="66" y="165" width="68" height="26" rx="13" fill="#0B3B26" opacity=".28"/>
    <rect x="65" y="163" width="70" height="26" rx="13" fill="url(#nf-badge)" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="71" y="166.5" width="58" height="7.5" rx="3.75" fill="#FFFFFF" opacity=".3"/>
    <g transform="translate(79.5 177)">
      <g class="sprout">
        <path d="M0 4.5 C.5 2 .4 -.5 0 -2.5" fill="none" stroke="#FFF" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M0 -1.4 C-1.6 -4 -4.6 -4.8 -6.6 -3.4 C-5.4 -.8 -2.6 -.4 0 -1.4 Z" fill="#FFF"/>
        <path d="M0 -2.6 C1.3 -5 4.1 -5.8 6.1 -4.6 C5 -2.2 2.3 -1.5 0 -2.6 Z" fill="#FFF"/>
      </g>
    </g>
    <text x="108.5" y="180.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="800" letter-spacing="1" fill="#FFF">NEW</text>
  </g>
</svg>