<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <title>VIP 2 Avatar Frame</title>

  <defs>
    <!-- polished silver band -->
    <linearGradient id="silverMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#e2e7ee"/>
      <stop offset="0.45" stop-color="#a7aeb9"/>
      <stop offset="0.6" stop-color="#79818d"/>
      <stop offset="0.78" stop-color="#b9c0cb"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <linearGradient id="silverDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a92a0"/>
      <stop offset="0.5" stop-color="#d3d9e1"/>
      <stop offset="1" stop-color="#666d79"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f3f7"/>
      <stop offset="0.45" stop-color="#b3bac4"/>
      <stop offset="0.55" stop-color="#949ca8"/>
      <stop offset="1" stop-color="#5c626d"/>
    </linearGradient>
    <!-- icy diamond gem -->
    <radialGradient id="gemGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dbe7f4"/>
      <stop offset="1" stop-color="#8fa3bb"/>
    </radialGradient>
    <radialGradient id="studGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eaf0f7"/>
      <stop offset="1" stop-color="#9fb0c4"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <path id="spark" d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z"/>
  </defs>

  <!-- breathing silver glow -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#c3cfe0" stroke-width="10" opacity="0.3" filter="url(#softGlow)">
    <animate attributeName="r" values="84;89;84" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.42;0.22" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- outer rotating dashed accent -->
  <g>
    <circle cx="100" cy="100" r="97" fill="none" stroke="#b9c2cf" stroke-width="1.4"
            stroke-dasharray="2 3" pathLength="120" stroke-linecap="round" opacity="0.75"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="26s" repeatCount="indefinite"/>
  </g>

  <!-- outer thin ring + main silver band -->
  <circle cx="100" cy="100" r="92.5" fill="none" stroke="url(#silverDeep)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#silverMain)" stroke-width="12"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#3c434d" stroke-width="1" opacity="0.6"/>
  <circle cx="100" cy="100" r="78.5" fill="none" stroke="#3c434d" stroke-width="2" opacity="0.85"/>

  <!-- rotating light glints (3 sweep groups) -->
  <g stroke-linecap="round" fill="none">
    <path d="M 70.93 20.13 A 85 85 0 0 1 129.07 20.13" stroke="#f4f8fd" stroke-width="5" opacity="0.4"/>
    <path d="M 85.24 16.29 A 85 85 0 0 1 114.76 16.29" stroke="#ffffff" stroke-width="5" opacity="0.8"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="6s" repeatCount="indefinite"/>
  </g>
  <g stroke-linecap="round" fill="none">
    <path d="M 70.93 20.13 A 85 85 0 0 1 129.07 20.13" stroke="#f4f8fd" stroke-width="5" opacity="0.35"/>
    <animateTransform attributeName="transform" type="rotate" from="140 100 100" to="500 100 100" dur="6s" repeatCount="indefinite"/>
  </g>
  <g stroke-linecap="round" fill="none">
    <path d="M 70.93 20.13 A 85 85 0 0 1 129.07 20.13" stroke="#f4f8fd" stroke-width="4" opacity="0.25"/>
    <animateTransform attributeName="transform" type="rotate" from="250 100 100" to="610 100 100" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- slowly rotating dotted inner ring -->
  <g>
    <circle cx="100" cy="100" r="74.5" fill="none" stroke="#d7dee7" stroke-width="1.6"
            stroke-dasharray="0.8 4.2" pathLength="100" stroke-linecap="round" opacity="0.9"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="20s" repeatCount="indefinite"/>
  </g>

  <!-- pulsing diamond corner gems -->
  <g transform="translate(160.1 160.1)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2.8s" begin="0s" repeatCount="indefinite"/>
      <path d="M0 -6 L4.6 0 L0 6 L-4.6 0 Z" fill="url(#gemGrad)" stroke="#4d545e" stroke-width="0.9"/>
      <path d="M0 -6 L4.6 0 L0 0 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M0 -6 L-4.6 0 L0 0 Z" fill="#ffffff" opacity="0.15"/>
    </g>
    <circle cx="0" cy="-2" r="0.8" fill="#fff" opacity="0.9"/>
  </g>
  <g transform="translate(39.9 160.1)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      <path d="M0 -6 L4.6 0 L0 6 L-4.6 0 Z" fill="url(#gemGrad)" stroke="#4d545e" stroke-width="0.9"/>
      <path d="M0 -6 L4.6 0 L0 0 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M0 -6 L-4.6 0 L0 0 Z" fill="#ffffff" opacity="0.15"/>
    </g>
    <circle cx="0" cy="-2" r="0.8" fill="#fff" opacity="0.9"/>
  </g>
  <g transform="translate(39.9 39.9)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <path d="M0 -6 L4.6 0 L0 6 L-4.6 0 Z" fill="url(#gemGrad)" stroke="#4d545e" stroke-width="0.9"/>
      <path d="M0 -6 L4.6 0 L0 0 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M0 -6 L-4.6 0 L0 0 Z" fill="#ffffff" opacity="0.15"/>
    </g>
    <circle cx="0" cy="-2" r="0.8" fill="#fff" opacity="0.9"/>
  </g>
  <g transform="translate(160.1 39.9)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
      <path d="M0 -6 L4.6 0 L0 6 L-4.6 0 Z" fill="url(#gemGrad)" stroke="#4d545e" stroke-width="0.9"/>
      <path d="M0 -6 L4.6 0 L0 0 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M0 -6 L-4.6 0 L0 0 Z" fill="#ffffff" opacity="0.15"/>
    </g>
    <circle cx="0" cy="-2" r="0.8" fill="#fff" opacity="0.9"/>
  </g>

  <!-- diamond studs: top / left / right -->
  <g transform="translate(100 15)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.22;1" dur="3s" begin="0s" repeatCount="indefinite"/>
      <path d="M0 -5.5 L4.2 0 L0 5.5 L-4.2 0 Z" fill="url(#studGrad)" stroke="#4d545e" stroke-width="0.9"/>
      <path d="M0 -5.5 L4.2 0 L0 0 Z" fill="#ffffff" opacity="0.45"/>
    </g>
  </g>
  <g transform="translate(15 100) scale(0.85)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.22;1" dur="3s" begin="1s" repeatCount="indefinite"/>
      <path d="M0 -5.5 L4.2 0 L0 5.5 L-4.2 0 Z" fill="url(#studGrad)" stroke="#4d545e" stroke-width="0.9"/>
      <path d="M0 -5.5 L4.2 0 L0 0 Z" fill="#ffffff" opacity="0.45"/>
    </g>
  </g>
  <g transform="translate(185 100) scale(0.85)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.22;1" dur="3s" begin="2s" repeatCount="indefinite"/>
      <path d="M0 -5.5 L4.2 0 L0 5.5 L-4.2 0 Z" fill="url(#studGrad)" stroke="#4d545e" stroke-width="0.9"/>
      <path d="M0 -5.5 L4.2 0 L0 0 Z" fill="#ffffff" opacity="0.45"/>
    </g>
  </g>

  <!-- twinkling sparkles -->
  <g fill="#f2f7ff">
    <use xlink:href="#spark" transform="translate(42 44) scale(1.1)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#spark" transform="translate(158 44) scale(0.9)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#spark" transform="translate(26 126) scale(0.8)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#spark" transform="translate(174 126) scale(1)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#spark" transform="translate(66 26) scale(0.85)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#spark" transform="translate(134 26) scale(0.95)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="2s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- VIP 2 badge -->
  <g>
    <ellipse cx="100" cy="181" rx="28" ry="14" fill="url(#badgeGrad)" stroke="#4d545e" stroke-width="1.6"/>
    <ellipse cx="100" cy="181" rx="23.5" ry="10.5" fill="none" stroke="#f4f7fb" stroke-width="0.8" opacity="0.55"/>

    <!-- tiny crown -->
    <path d="M 92.5 168 L 94 159.5 L 97.8 163.2 L 100 158.2 L 102.2 163.2 L 106 159.5 L 107.5 168 Z"
          fill="#eef2f8" stroke="#4d545e" stroke-width="0.9" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="94" cy="158.6" r="0.9" fill="#f4f7fb"/>
    <circle cx="100" cy="157.3" r="0.9" fill="#f4f7fb"/>
    <circle cx="106" cy="158.6" r="0.9" fill="#f4f7fb"/>

    <!-- twinkling rivets -->
    <g fill="url(#studGrad)" stroke="#4d545e" stroke-width="0.6">
      <path d="M76 178 L78.3 181 L76 184 L73.7 181 Z">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M124 178 L126.3 181 L124 184 L121.7 181 Z">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text (shadow + face) -->
    <text x="100" y="186.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="11.5" font-weight="800" letter-spacing="1" fill="#3c434d" opacity="0.55">VIP 2</text>
    <text x="100" y="185.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="11.5" font-weight="800" letter-spacing="1" fill="#ffffff">VIP 2</text>
  </g>
</svg>