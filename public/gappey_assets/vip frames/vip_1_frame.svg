<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <title>VIP 1 Avatar Frame</title>

  <defs>
    <!-- metallic copper band -->
    <linearGradient id="copperMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d3a5"/>
      <stop offset="0.22" stop-color="#dfa066"/>
      <stop offset="0.45" stop-color="#a05a24"/>
      <stop offset="0.6" stop-color="#7c3f14"/>
      <stop offset="0.78" stop-color="#c47f43"/>
      <stop offset="1" stop-color="#f0bd8a"/>
    </linearGradient>
    <linearGradient id="copperDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a1e"/>
      <stop offset="0.5" stop-color="#e09a5f"/>
      <stop offset="1" stop-color="#6f3a15"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c493"/>
      <stop offset="0.45" stop-color="#c07840"/>
      <stop offset="0.55" stop-color="#a35f2a"/>
      <stop offset="1" stop-color="#7c3f14"/>
    </linearGradient>
    <radialGradient id="gemGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffe7c4"/>
      <stop offset="0.45" stop-color="#e59b5c"/>
      <stop offset="1" stop-color="#8a4a1e"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <path id="spark" d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z"/>
  </defs>

  <!-- breathing copper glow -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#e09a5f" stroke-width="10" opacity="0.3" filter="url(#softGlow)">
    <animate attributeName="r" values="84;89;84" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.42;0.22" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- outer rotating dashed accent -->
  <g>
    <circle cx="100" cy="100" r="97" fill="none" stroke="#d99158" stroke-width="1.4"
            stroke-dasharray="2 3" pathLength="120" stroke-linecap="round" opacity="0.7"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="30s" repeatCount="indefinite"/>
  </g>

  <!-- outer thin ring + main copper band -->
  <circle cx="100" cy="100" r="92.5" fill="none" stroke="url(#copperDeep)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#copperMain)" stroke-width="12"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#5f3212" stroke-width="1" opacity="0.6"/>
  <circle cx="100" cy="100" r="78.5" fill="none" stroke="#5f3212" stroke-width="2" opacity="0.85"/>

  <!-- rotating light glints on the band -->
  <g stroke-linecap="round" fill="none">
    <path d="M 70.93 20.13 A 85 85 0 0 1 129.07 20.13" stroke="#fff3e2" stroke-width="5" opacity="0.35"/>
    <path d="M 92.59 15.32 A 85 85 0 0 1 107.41 15.32" stroke="#ffffff" stroke-width="5" opacity="0.7"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="7s" repeatCount="indefinite"/>
  </g>
  <g stroke-linecap="round" fill="none">
    <path d="M 70.93 20.13 A 85 85 0 0 1 129.07 20.13" stroke="#fff3e2" stroke-width="5" opacity="0.3"/>
    <animateTransform attributeName="transform" type="rotate" from="180 100 100" to="540 100 100" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- slowly rotating dotted inner ring -->
  <g>
    <circle cx="100" cy="100" r="74.5" fill="none" stroke="#e8b284" stroke-width="1.6"
            stroke-dasharray="0.8 4.2" pathLength="100" stroke-linecap="round" opacity="0.85"/>
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="24s" repeatCount="indefinite"/>
  </g>

  <!-- pulsing corner gems -->
  <g>
    <circle cx="160.1" cy="160.1" r="4.6" fill="url(#gemGrad)" stroke="#5f3212" stroke-width="0.9">
      <animate attributeName="r" values="4.2;5.1;4.2" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158.7" cy="158.7" r="1.2" fill="#fff" opacity="0.9"/>
  </g>
  <g>
    <circle cx="39.9" cy="160.1" r="4.6" fill="url(#gemGrad)" stroke="#5f3212" stroke-width="0.9">
      <animate attributeName="r" values="4.2;5.1;4.2" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38.5" cy="158.7" r="1.2" fill="#fff" opacity="0.9"/>
  </g>
  <g>
    <circle cx="39.9" cy="39.9" r="4.6" fill="url(#gemGrad)" stroke="#5f3212" stroke-width="0.9">
      <animate attributeName="r" values="4.2;5.1;4.2" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38.5" cy="38.5" r="1.2" fill="#fff" opacity="0.9"/>
  </g>
  <g>
    <circle cx="160.1" cy="39.9" r="4.6" fill="url(#gemGrad)" stroke="#5f3212" stroke-width="0.9">
      <animate attributeName="r" values="4.2;5.1;4.2" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158.7" cy="38.5" r="1.2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- twinkling sparkles -->
  <g fill="#fff3df">
    <use xlink:href="#spark" transform="translate(42 44) scale(1.1)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#spark" transform="translate(158 44) scale(0.9)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#spark" transform="translate(26 126) scale(0.8)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#spark" transform="translate(174 126) scale(1)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- VIP 1 badge -->
  <g>
    <ellipse cx="100" cy="181" rx="28" ry="14" fill="url(#badgeGrad)" stroke="#5f3212" stroke-width="1.6"/>
    <ellipse cx="100" cy="181" rx="23.5" ry="10.5" fill="none" stroke="#ffdcae" stroke-width="0.8" opacity="0.55"/>

    <!-- tiny crown -->
    <path d="M 92.5 168 L 94 159.5 L 97.8 163.2 L 100 158.2 L 102.2 163.2 L 106 159.5 L 107.5 168 Z"
          fill="#f4c493" stroke="#5f3212" stroke-width="0.9" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="94" cy="158.6" r="0.9" fill="#ffdcae"/>
    <circle cx="100" cy="157.3" r="0.9" fill="#ffdcae"/>
    <circle cx="106" cy="158.6" r="0.9" fill="#ffdcae"/>

    <!-- text (shadow + face) -->
    <text x="100" y="186.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="11.5" font-weight="800" letter-spacing="1" fill="#5f3212" opacity="0.55">VIP 1</text>
    <text x="100" y="185.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="11.5" font-weight="800" letter-spacing="1" fill="#ffe9d2">VIP 1</text>
  </g>
</svg>