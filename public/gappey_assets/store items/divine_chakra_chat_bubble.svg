<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="380" height="150" viewBox="0 0 380 150" preserveAspectRatio="none">
  <title>Divine Chakra Chat Bubble</title>
  <defs>
    <linearGradient id="bFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0b3a"/>
      <stop offset="1" stop-color="#0c0420"/>
    </linearGradient>
    <linearGradient id="bStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#c8951c"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#e8a13a"/>
    </linearGradient>
    <g id="chakraM">
      <circle r="10" fill="none" stroke="url(#goldG)" stroke-width="2.5"/>
      <circle r="6.8" fill="none" stroke="#fff3c4" stroke-width="0.9" opacity="0.8"/>
      <g stroke="#ffd54f" stroke-width="1.4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"/>
        <line y1="-3" y2="-8.6"/>
        <line y1="-3" y2="-8.6" transform="rotate(45)"/>
        <line y1="-3" y2="-8.6" transform="rotate(90)"/>
        <line y1="-3" y2="-8.6" transform="rotate(135)"/>
        <line y1="-3" y2="-8.6" transform="rotate(180)"/>
        <line y1="-3" y2="-8.6" transform="rotate(225)"/>
        <line y1="-3" y2="-8.6" transform="rotate(270)"/>
        <line y1="-3" y2="-8.6" transform="rotate(315)"/>
      </g>
      <circle r="1.9" fill="#ffd54f" stroke="#b8860b" stroke-width="0.7"/>
    </g>
    <g id="coinS">
      <circle r="6" fill="url(#goldG)" stroke="#b8860b" stroke-width="1.2"/>
      <circle r="3.4" fill="none" stroke="#8a5a00" stroke-width="0.8" opacity="0.7"/>
    </g>
    <path id="gemS" d="M0 -5.5 L4.2 -2 L2.6 4.5 L-2.6 4.5 L-4.2 -2 Z"/>
    <path id="petalFly" d="M0 -5 C 4.5 -3 5.5 2 3 5.5 C 1 7.5 -2.5 6 -3.5 3 C -4.3 0 -2.5 -3.5 0 -5 Z"/>
    <path id="stS" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#fff8e1"/>
    <filter id="bSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- breathing glow -->
  <ellipse cx="190" cy="75" rx="172" ry="60" fill="#ffd54f" filter="url(#bSoft)" opacity="0.22">
    <animate attributeName="opacity" values="0.14;0.36;0.14" dur="2.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- box body -->
  <rect x="10" y="10" width="360" height="130" rx="20" fill="url(#bFill)" stroke="url(#bStroke)" stroke-width="4"/>

  <!-- double zari borders -->
  <rect x="17" y="17" width="346" height="116" rx="15" fill="none" stroke="#d4a94e" stroke-width="1.4" opacity="0.55"/>
  <rect x="22" y="22" width="336" height="106" rx="12" fill="none" stroke="#9c6ade" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- gold comet + white shimmer -->
  <rect x="10" y="10" width="360" height="130" rx="20" fill="none" stroke="#ffe082"
        stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 856">
    <animate attributeName="stroke-dashoffset" from="946" to="0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="10" y="10" width="360" height="130" rx="20" fill="none" stroke="#fff8e1"
        stroke-width="1.4" stroke-linecap="round" stroke-dasharray="24 922" opacity="0.65">
    <animate attributeName="stroke-dashoffset" from="946" to="0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- spinning chakra emblem with halo pulse -->
  <g transform="translate(70 46)">
    <circle r="17" fill="none" stroke="#ffd54f" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="15;19;15" dur="2s" repeatCount="indefinite"/>
    </circle>
    <use xlink:href="#chakraM"/>
    <use xlink:href="#stS" transform="translate(15 -12) scale(0.55)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="translate(-14 10) scale(0.5)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" begin="-0.6s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- corner accents: mini sun, spinning coin, gem -->
  <g transform="translate(332 28)">
    <circle r="5" fill="url(#goldG)" stroke="#b8860b" stroke-width="0.8"/>
    <circle r="1.7" fill="#fff8e1"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="2.2s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(46 122)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <use xlink:href="#coinS" transform="scale(0.7)"/>
    </g>
  </g>
  <use xlink:href="#gemS" transform="translate(334 122) scale(0.8)" fill="#9c6ade" stroke="#ffd54f" stroke-width="0.8">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/>
  </use>

  <!-- rising divine sparks -->
  <g>
    <circle cx="95" cy="126" r="2" fill="#ffe082" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.8s" begin="-1.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="95;102;89;95" dur="2.8s" begin="-1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.8s" begin="-1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="126" r="2.4" fill="#fff8e1" opacity="0">
      <animate attributeName="cy" values="126;34" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;158;143;150" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="126" r="3" fill="#ffd54f" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="215;207;223;215" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="126" r="2" fill="#ffe082" opacity="0">
      <animate attributeName="cy" values="126;38" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="280;288;273;280" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="335" cy="126" r="2.6" fill="#fff8e1" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.8s" begin="-0.35s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="335;327;341;335" dur="2.8s" begin="-0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.8s" begin="-0.35s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- drifting blessing coin + petal -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.15;0.8;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="322 118;296 84;266 42" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use xlink:href="#coinS" transform="scale(0.75)"/>
    </g>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.15;0.8;1" dur="7s" begin="-2.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="52 122;84 80;120 40" keyTimes="0;0.5;1" dur="7s" begin="-2.4s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f8a5c8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
</svg>