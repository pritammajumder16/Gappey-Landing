<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <title>Rose Rush Avatar Frame</title>
  <defs>
    <radialGradient id="rGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.74" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ff4081" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4081" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ad1457"/>
      <stop offset="1" stop-color="#ff5c8d"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="1" stop-color="#7cc47f"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#ff8f00"/>
    </linearGradient>

    <g id="roseS">
      <g fill="url(#petalG)">
        <ellipse cx="0" cy="-11.5" rx="7" ry="10"/>
        <ellipse cx="0" cy="-11.5" rx="7" ry="10" transform="rotate(60)"/>
        <ellipse cx="0" cy="-11.5" rx="7" ry="10" transform="rotate(120)"/>
        <ellipse cx="0" cy="-11.5" rx="7" ry="10" transform="rotate(180)"/>
        <ellipse cx="0" cy="-11.5" rx="7" ry="10" transform="rotate(240)"/>
        <ellipse cx="0" cy="-11.5" rx="7" ry="10" transform="rotate(300)"/>
      </g>
      <g fill="#c2185b">
        <ellipse cx="0" cy="-6.5" rx="4.4" ry="6.2"/>
        <ellipse cx="0" cy="-6.5" rx="4.4" ry="6.2" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6.5" rx="4.4" ry="6.2" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6.5" rx="4.4" ry="6.2" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6.5" rx="4.4" ry="6.2" transform="rotate(288)"/>
      </g>
      <circle r="3.4" fill="#880e4f"/>
      <path d="M0 -2.4 A 2.4 2.4 0 0 1 2.4 0 A 2.4 2.4 0 0 1 0.9 2.2" fill="none" stroke="#ff8aaf" stroke-width="1" stroke-linecap="round"/>
    </g>

    <path id="leafS" d="M0 0 Q 10 -9 21 -3 Q 10 6 0 0 Z" fill="url(#leafG)"/>
    <path id="thornS" d="M0 0 L8 -3 L3 -8 Z" fill="#33691e"/>
    <path id="hb" d="M0 4.5 C -4 1 -8 -2 -8 -6 C -8 -9.5 -4.8 -11 -2.2 -9.6 C -1 -9 -0.4 -8 0 -7 C 0.4 -8 1 -9 2.2 -9.6 C 4.8 -11 8 -9.5 8 -6 C 8 -2 4 1 0 4.5 Z"/>
    <path id="petalFly" d="M0 -5 C 4.5 -3 5.5 2 3 5.5 C 1 7.5 -2.5 6 -3.5 3 C -4.3 0 -2.5 -3.5 0 -5 Z"/>
  </defs>

  <!-- breathing glow -->
  <circle cx="130" cy="130" r="127" fill="url(#rGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- base rings -->
  <circle cx="130" cy="130" r="100" fill="none" stroke="#123315" stroke-width="26"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#1e5c2e" stroke-width="18"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="130" cy="130" r="113" fill="none" stroke="#ffd180" stroke-width="2.5" opacity="0.9"/>
  <circle cx="130" cy="130" r="87" fill="none" stroke="#a5d6a7" stroke-width="1.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating vine foliage -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="26s" repeatCount="indefinite"/>
    <use xlink:href="#leafS" transform="rotate(0 130 130) translate(130 31) rotate(-70)"/>
    <use xlink:href="#leafS" transform="rotate(30 130 130) translate(130 31) rotate(-110)"/>
    <use xlink:href="#leafS" transform="rotate(60 130 130) translate(130 31) rotate(-70)"/>
    <use xlink:href="#leafS" transform="rotate(90 130 130) translate(130 31) rotate(-110)"/>
    <use xlink:href="#leafS" transform="rotate(120 130 130) translate(130 31) rotate(-70)"/>
    <use xlink:href="#leafS" transform="rotate(150 130 130) translate(130 31) rotate(-110)"/>
    <use xlink:href="#leafS" transform="rotate(180 130 130) translate(130 31) rotate(-70)"/>
    <use xlink:href="#leafS" transform="rotate(210 130 130) translate(130 31) rotate(-110)"/>
    <use xlink:href="#leafS" transform="rotate(240 130 130) translate(130 31) rotate(-70)"/>
    <use xlink:href="#leafS" transform="rotate(270 130 130) translate(130 31) rotate(-110)"/>
    <use xlink:href="#leafS" transform="rotate(300 130 130) translate(130 31) rotate(-70)"/>
    <use xlink:href="#leafS" transform="rotate(330 130 130) translate(130 31) rotate(-110)"/>
    <use xlink:href="#thornS" transform="rotate(15 130 130) translate(130 34) rotate(-85)"/>
    <use xlink:href="#thornS" transform="rotate(45 130 130) translate(130 34) rotate(-105)"/>
    <use xlink:href="#thornS" transform="rotate(75 130 130) translate(130 34) rotate(-85)"/>
    <use xlink:href="#thornS" transform="rotate(105 130 130) translate(130 34) rotate(-105)"/>
    <use xlink:href="#thornS" transform="rotate(135 130 130) translate(130 34) rotate(-85)"/>
    <use xlink:href="#thornS" transform="rotate(165 130 130) translate(130 34) rotate(-105)"/>
    <use xlink:href="#thornS" transform="rotate(195 130 130) translate(130 34) rotate(-85)"/>
    <use xlink:href="#thornS" transform="rotate(225 130 130) translate(130 34) rotate(-105)"/>
    <use xlink:href="#thornS" transform="rotate(255 130 130) translate(130 34) rotate(-85)"/>
    <use xlink:href="#thornS" transform="rotate(285 130 130) translate(130 34) rotate(-105)"/>
    <use xlink:href="#thornS" transform="rotate(315 130 130) translate(130 34) rotate(-85)"/>
    <use xlink:href="#thornS" transform="rotate(345 130 130) translate(130 34) rotate(-105)"/>
  </g>

  <!-- fixed blooming roses -->
  <g transform="translate(130 30)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#roseS"/>
  </g></g>
  <g transform="translate(230 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
    <use xlink:href="#roseS"/>
  </g></g>
  <g transform="translate(130 230)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    <use xlink:href="#roseS"/>
  </g></g>
  <g transform="translate(30 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
    <use xlink:href="#roseS"/>
  </g></g>

  <!-- gold heart studs on diagonals -->
  <use xlink:href="#hb" transform="translate(200.7 59.3) scale(0.9)" fill="url(#goldG)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#hb" transform="translate(59.3 59.3) scale(0.9)" fill="url(#goldG)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.1s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#hb" transform="translate(59.3 200.7) scale(0.9)" fill="url(#goldG)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#hb" transform="translate(200.7 200.7) scale(0.9)" fill="url(#goldG)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.9s" begin="-0.9s" repeatCount="indefinite"/>
  </use>

  <!-- sparkles -->
  <circle cx="224" cy="96" r="2" fill="#ffe082">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="96" r="2" fill="#ffe082">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="-0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="224" r="2" fill="#ffe082">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.7s" repeatCount="indefinite"/>
  </circle>

  <!-- falling petals -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="48 -16;66 128;40 276" keyTimes="0;0.5;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f48fb1" transform="scale(1.15)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="8s" begin="-1.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="212 -16;190 120;222 276" keyTimes="0;0.5;1" dur="8s" begin="-1.6s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f8a5c8" transform="scale(0.9)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.7s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="8s" begin="-3.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="96 -16;80 140;108 276" keyTimes="0;0.5;1" dur="8s" begin="-3.2s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ff8aaf" transform="scale(1.05)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="8s" begin="-4.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="168 -16;186 130;156 276" keyTimes="0;0.5;1" dur="8s" begin="-4.8s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f48fb1" transform="scale(0.85)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.9s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="8s" begin="-6.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="132 -16;114 126;140 276" keyTimes="0;0.5;1" dur="8s" begin="-6.4s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ffd1e0" transform="scale(1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
</svg>