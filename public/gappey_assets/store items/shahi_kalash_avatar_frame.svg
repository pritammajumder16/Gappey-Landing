<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <title>Shahi Kalash Avatar Frame</title>
  <defs>
    <radialGradient id="sGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffd54f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#e8a13a"/>
    </linearGradient>
    <g id="peye">
      <ellipse rx="9.5" ry="14" fill="#26a69a" stroke="#004d40" stroke-width="1"/>
      <ellipse rx="7" ry="10.5" fill="#ffd54f"/>
      <ellipse rx="5.3" ry="8" fill="#1565c0"/>
      <ellipse rx="2.3" ry="3.6" fill="#ffd54f"/>
    </g>
    <path id="gemS" d="M0 -5.5 L4.2 -2 L2.6 4.5 L-2.6 4.5 L-4.2 -2 Z"/>
    <g id="pearlS">
      <circle r="2.6" fill="#fdf6e3"/>
      <circle cx="-0.8" cy="-0.8" r="0.7" fill="#ffffff"/>
    </g>
    <g id="kalash">
      <ellipse cx="0" cy="10" rx="16" ry="4" fill="#ffd54f" opacity="0.25">
        <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
      <line x1="-11" y1="8" x2="11" y2="8" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-11 6 C -14 -2 -10 -11 0 -13 C 10 -11 14 -2 11 6 C 6 10 -6 10 -11 6 Z"
            fill="url(#goldG)" stroke="#b8860b" stroke-width="1.4"/>
      <rect x="-9" y="-17" width="18" height="5" rx="2" fill="url(#goldG)" stroke="#b8860b" stroke-width="1"/>
      <path d="M0 -17 C -6 -21 -10 -25 -12 -31 C -6 -28 -2 -23 0 -19 Z" fill="#2e7d32"/>
      <path d="M0 -17 C 6 -21 10 -25 12 -31 C 6 -28 2 -23 0 -19 Z" fill="#388e3c"/>
      <path d="M0 -18 C -1.5 -24 1.5 -24 0 -18 Z" fill="#43a047"/>
      <circle cx="0" cy="-25" r="5.5" fill="#6d4c41" stroke="#4e342e" stroke-width="1.2"/>
      <circle cx="-1.6" cy="-27" r="0.8" fill="#d7ccc8"/>
      <circle cx="1.4" cy="-27.6" r="0.8" fill="#d7ccc8"/>
      <circle cx="0" cy="-25.8" r="0.8" fill="#d7ccc8"/>
      <circle cx="-8" cy="-1" r="1.5" fill="#ff7043"/>
      <circle cx="-4" cy="2.5" r="1.5" fill="#ffb300"/>
      <circle cx="0" cy="4" r="1.5" fill="#ff7043"/>
      <circle cx="4" cy="2.5" r="1.5" fill="#ffb300"/>
      <circle cx="8" cy="-1" r="1.5" fill="#ff7043"/>
    </g>
    <path id="stS" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#ffffff"/>
    <path id="petalFly" d="M0 -5 C 4.5 -3 5.5 2 3 5.5 C 1 7.5 -2.5 6 -3.5 3 C -4.3 0 -2.5 -3.5 0 -5 Z"/>
  </defs>

  <!-- breathing glow -->
  <circle cx="130" cy="130" r="127" fill="url(#sGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- base rings -->
  <circle cx="130" cy="130" r="100" fill="none" stroke="#26081f" stroke-width="26"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#4a0e2e" stroke-width="18"/>
  <circle cx="130" cy="130" r="113" fill="none" stroke="#ffd54f" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="87" fill="none" stroke="#e8a13a" stroke-width="2"/>
  <circle cx="130" cy="130" r="90" fill="none" stroke="#fff8e1" stroke-width="1.5">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="130" r="100" fill="none" stroke="url(#goldG)" stroke-width="4"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#7a1040" stroke-width="4" stroke-dasharray="2 11" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating 12-gem kundan ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="22s" repeatCount="indefinite"/>
    <g>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      <use xlink:href="#gemS" transform="rotate(0 130 130) translate(130 30)" fill="#00c853" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(60 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(120 130 130) translate(130 30)" fill="#2979ff" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(180 130 130) translate(130 30)" fill="#00c853" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(240 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(300 130 130) translate(130 30)" fill="#2979ff" stroke="#ffd54f" stroke-width="1"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.3s" repeatCount="indefinite"/>
      <use xlink:href="#gemS" transform="rotate(30 130 130) translate(130 30)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(90 130 130) translate(130 30)" fill="#00c853" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(150 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(210 130 130) translate(130 30)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(270 130 130) translate(130 30)" fill="#00c853" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(330 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
    </g>
  </g>

  <!-- counter-rotating pearl strings -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="16s" repeatCount="indefinite"/>
    <use xlink:href="#pearlS" transform="rotate(0 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(30 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(60 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(90 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(120 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(150 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(180 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(210 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(240 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(270 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(300 130 130) translate(130 12)"/>
    <use xlink:href="#pearlS" transform="rotate(330 130 130) translate(130 12)"/>
  </g>

  <!-- kalash topper (crown of the frame) -->
  <g transform="translate(130 26)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 0 8;3 0 8;-3 0 8" dur="3s" repeatCount="indefinite"/>
      <use xlink:href="#kalash"/>
    </g>
  </g>

  <!-- peacock eyes at the other cardinals -->
  <g transform="translate(238 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
    <use xlink:href="#peye" transform="scale(1.2)"/>
  </g></g>
  <g transform="translate(130 234)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    <use xlink:href="#peye" transform="scale(1.2)"/>
  </g></g>
  <g transform="translate(22 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
    <use xlink:href="#peye" transform="scale(1.2)"/>
  </g></g>

  <!-- pulsing diamonds on diagonals -->
  <use xlink:href="#gemS" transform="translate(200.7 59.3) scale(1.1)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#gemS" transform="translate(59.3 59.3) scale(1)" fill="#e53935" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="-0.5s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#gemS" transform="translate(59.3 200.7) scale(1.1)" fill="#00c853" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" begin="-0.9s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#gemS" transform="translate(200.7 200.7) scale(1)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="-1.2s" repeatCount="indefinite"/>
  </use>

  <!-- twinkling diamond sparkles -->
  <use xlink:href="#stS" transform="translate(222 92) scale(0.8)">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.2s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(38 100) scale(0.7)">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.5s" begin="-0.4s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(96 224) scale(0.75)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.7s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(168 40) scale(0.7)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="-1s" repeatCount="indefinite"/>
  </use>

  <!-- falling petals -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="52 -14;70 128;42 276" keyTimes="0;0.5;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ffca28" transform="scale(1.1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="210 -14;188 122;220 276" keyTimes="0;0.5;1" dur="9s" begin="-1.8s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f8a5c8" transform="scale(0.9)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-3.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="100 -14;84 138;112 276" keyTimes="0;0.5;1" dur="9s" begin="-3.6s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ffe082" transform="scale(1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.8s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-5.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="166 -14;184 130;154 276" keyTimes="0;0.5;1" dur="9s" begin="-5.4s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#b388ff" transform="scale(0.85)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- rising gold dust (kept to the sides, away from the avatar) -->
  <g fill="#ffe082">
    <circle cx="55" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;44" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="55;63;49;55" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="240" r="1.8" opacity="0">
      <animate attributeName="cy" values="240;40" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="205;197;211;205" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;48" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="95;102;89;95" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="240" r="2.2" opacity="0">
      <animate attributeName="cy" values="240;44" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="168;175;162;168" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>