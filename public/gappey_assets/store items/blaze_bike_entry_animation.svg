<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="400" viewBox="0 0 800 400">
  <title>Blaze Bike Entry</title>
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ff5e00"/>
      <stop offset="0.8" stop-color="#ff9100"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <linearGradient id="jet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset="0.7" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#ffe97a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e63a2e"/>
      <stop offset="1" stop-color="#8f1414"/>
    </linearGradient>
    <linearGradient id="ribbonG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1200"/>
      <stop offset="1" stop-color="#1c0500"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <linearGradient id="lickG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset="0.55" stop-color="#ff9100"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <g id="lickU">
      <path d="M0 4 C -11 -8 -10 -26 0 -46 C 10 -26 11 -8 0 4 Z" fill="url(#lickG)"/>
      <path d="M0 4 C -5 -5 -4.5 -13 0 -24 C 4.5 -13 5 -5 0 4 Z" fill="#ffe9a8" opacity="0.85"/>
    </g>
    <g id="jetL">
      <path d="M0 -4 C -10 -9 -19 -4 -27 0 C -19 4 -10 9 0 4 Z" fill="url(#jet)"/>
    </g>
  </defs>

  <!-- ground -->
  <line x1="0" y1="330" x2="800" y2="330" stroke="#4d2008" stroke-width="3"/>
  <ellipse cx="330" cy="331" rx="210" ry="10" fill="#ff5e00" opacity="0.16">
    <animate attributeName="opacity" values="0.1;0.24;0.1" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- fire burst at the stop point (behind the bike) -->
  <g transform="translate(330 255)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.2;0.2;1.15;1.15" keyTimes="0;0.3;0.47;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.95;0;0" keyTimes="0;0.3;0.35;0.47;1" dur="6s" repeatCount="indefinite"/>
      <use xlink:href="#lickU"/>
      <use xlink:href="#lickU" transform="rotate(45)"/>
      <use xlink:href="#lickU" transform="rotate(90)"/>
      <use xlink:href="#lickU" transform="rotate(135)"/>
      <use xlink:href="#lickU" transform="rotate(180)"/>
      <use xlink:href="#lickU" transform="rotate(225)"/>
      <use xlink:href="#lickU" transform="rotate(270)"/>
      <use xlink:href="#lickU" transform="rotate(315)"/>
    </g>
    <circle r="12" fill="none" stroke="#ffb340" stroke-width="3">
      <animate attributeName="r" values="12;12;84;84" keyTimes="0;0.3;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.3;0.34;0.45;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ambient embers -->
  <g fill="#ffb347">
    <circle cx="250" cy="322" r="2.4" opacity="0">
      <animate attributeName="cy" values="322;170" dur="3s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="250;262;244;250" dur="3s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="322" r="2" opacity="0">
      <animate attributeName="cy" values="322;160" dur="3.6s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="420;410;430;420" dur="3.6s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="3.6s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="322" r="2.8" opacity="0">
      <animate attributeName="cy" values="322;180" dur="2.7s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="510;522;500;510" dur="2.7s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.7s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="322" r="2.2" opacity="0">
      <animate attributeName="cy" values="322;175" dur="3.3s" begin="-0.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="330;340;322;330" dur="3.3s" begin="-0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="3.3s" begin="-0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- speed lines (only while the bike is moving) -->
  <g stroke="#ff9e4d" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.31;0.6" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <line x1="70" y1="160" x2="170" y2="160">
      <animateTransform attributeName="transform" type="translate" values="60 0;-320 0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="205" x2="230" y2="205">
      <animateTransform attributeName="transform" type="translate" values="40 0;-300 0" dur="0.75s" begin="-0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="250" x2="150" y2="250">
      <animateTransform attributeName="transform" type="translate" values="50 0;-310 0" dur="0.65s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="292" x2="260" y2="292">
      <animateTransform attributeName="transform" type="translate" values="30 0;-290 0" dur="0.7s" begin="-0.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ============ BIKE + RIDER ============ -->
  <g transform="translate(0 330)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-270 0;270 0;270 0;970 0" keyTimes="0;0.3;0.55;1"
        calcMode="spline" keySplines="0 0 0.58 1;0 0 1 1;0.42 0 1 1"
        dur="6s" repeatCount="indefinite"/>

      <ellipse cx="72" cy="8" rx="118" ry="11" fill="#000000" opacity="0.35"/>

      <!-- rear leg (behind body) -->
      <path d="M26 -70 L14 -46 L26 -26" fill="none" stroke="#182233" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26 -26 L38 -24" stroke="#0c0c10" stroke-width="6" stroke-linecap="round"/>

      <!-- wheels -->
      <circle cx="-5" cy="-30" r="30" fill="#1b1b1f" stroke="#2e2e34" stroke-width="6"/>
      <circle cx="-5" cy="-30" r="14" fill="none" stroke="#ff7a1a" stroke-width="3"/>
      <g stroke="#8a8a92" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0 -5 -30" to="360 -5 -30" dur="0.4s" repeatCount="indefinite"/>
        <line x1="-19" y1="-30" x2="9" y2="-30"/>
        <line x1="-5" y1="-44" x2="-5" y2="-16"/>
        <line x1="-15" y1="-40" x2="5" y2="-20"/>
        <line x1="-15" y1="-20" x2="5" y2="-40"/>
      </g>
      <circle cx="-5" cy="-30" r="4" fill="#c9c9cf"/>
      <circle cx="150" cy="-30" r="30" fill="#1b1b1f" stroke="#2e2e34" stroke-width="6"/>
      <circle cx="150" cy="-30" r="14" fill="none" stroke="#ff7a1a" stroke-width="3"/>
      <g stroke="#8a8a92" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0 150 -30" to="360 150 -30" dur="0.4s" repeatCount="indefinite"/>
        <line x1="136" y1="-30" x2="164" y2="-30"/>
        <line x1="150" y1="-44" x2="150" y2="-16"/>
        <line x1="140" y1="-40" x2="160" y2="-20"/>
        <line x1="140" y1="-20" x2="160" y2="-40"/>
      </g>
      <circle cx="150" cy="-30" r="4" fill="#c9c9cf"/>

      <!-- chassis + rider (suspension bob) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="0.5s" repeatCount="indefinite"/>

        <!-- fire trail -->
        <path d="M-30 -46 C -75 -54 -115 -38 -165 -48 C -210 -56 -250 -40 -300 -50"
              fill="none" stroke="url(#trail)" stroke-width="11" stroke-linecap="round"
              stroke-dasharray="46 24" opacity="0.8">
          <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="0.55s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0.55;0.8" dur="0.4s" repeatCount="indefinite"/>
        </path>
        <g fill="url(#lickG)">
          <path d="M0 0 C -6 -5 -6 -11 0 -16 C 6 -11 6 -5 0 0 Z" transform="translate(-95 -46)" opacity="0.9">
            <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.26s" repeatCount="indefinite"/>
          </path>
          <path d="M0 0 C -6 -5 -6 -11 0 -16 C 6 -11 6 -5 0 0 Z" transform="translate(-165 -47)" opacity="0.8">
            <animate attributeName="opacity" values="0.3;0.9;0.3" dur="0.32s" begin="-0.1s" repeatCount="indefinite"/>
          </path>
          <path d="M0 0 C -6 -5 -6 -11 0 -16 C 6 -11 6 -5 0 0 Z" transform="translate(-232 -48)" opacity="0.7">
            <animate attributeName="opacity" values="0.8;0.25;0.8" dur="0.29s" begin="-0.2s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- frame + engine -->
        <path d="M-5 -32 L52 -58" stroke="#3b3b44" stroke-width="8" stroke-linecap="round"/>
        <path d="M150 -32 L124 -70" stroke="#3b3b44" stroke-width="7" stroke-linecap="round"/>
        <path d="M-5 -32 L-4 -54" stroke="#3b3b44" stroke-width="7" stroke-linecap="round"/>
        <path d="M42 -34 L88 -34 L82 -56 L50 -56 Z" fill="#2c2c33" stroke="#17171b" stroke-width="2"/>

        <!-- exhaust -->
        <path d="M86 -40 Q40 -32 -28 -46" fill="none" stroke="#5a5b64" stroke-width="9" stroke-linecap="round"/>
        <circle cx="-28" cy="-46" r="5" fill="#77777f"/>

        <!-- body + seat + decal -->
        <path d="M-26 -60 Q-6 -72 18 -68 Q52 -84 92 -72 L120 -64 Q104 -52 70 -54 Q30 -52 -26 -60 Z"
              fill="url(#body)" stroke="#4d0b0b" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-24 -63 Q0 -72 24 -68 L20 -60 Q-2 -60 -22 -57 Z" fill="#17171c"/>
        <path d="M40 -70 Q60 -79 86 -68 Q66 -61 44 -63 Z" fill="url(#lickG)" opacity="0.95"/>
        <circle cx="-24" cy="-62" r="3" fill="#ff2e00">
          <animate attributeName="opacity" values="1;0.25;1" dur="0.8s" repeatCount="indefinite"/>
        </circle>

        <!-- headlight + beam -->
        <path d="M150 -66 L198 -80 L198 -50 Z" fill="#ffe9a8" opacity="0.12"/>
        <circle cx="147" cy="-64" r="6.5" fill="#fff1b8" stroke="#b3541e" stroke-width="2"/>

        <!-- handlebar + front fender -->
        <path d="M124 -72 L136 -86" stroke="#23232a" stroke-width="5" stroke-linecap="round"/>
        <circle cx="137" cy="-87" r="3.5" fill="#0c0c10"/>
        <path d="M132 -22 Q150 -40 168 -22" fill="none" stroke="#b3241c" stroke-width="5" stroke-linecap="round"/>

        <!-- rider -->
        <path d="M28 -70 L72 -108" stroke="#1f2937" stroke-width="13" stroke-linecap="round"/>
        <path d="M70 -104 L96 -90 L130 -85" fill="none" stroke="#1f2937" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="133" cy="-86" r="4" fill="#0c0c10"/>
        <path d="M30 -70 L58 -48 L50 -26" fill="none" stroke="#232f42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 -26 L62 -24" stroke="#0c0c10" stroke-width="6" stroke-linecap="round"/>
        <circle cx="84" cy="-121" r="13" fill="url(#body)" stroke="#4d0b0b" stroke-width="2"/>
        <path d="M84 -131 Q98 -129 97 -115 Q90 -111 84 -117 Z" fill="#0d1420"/>
        <path d="M75 -128 Q83 -136 92 -129" fill="none" stroke="#ffb340" stroke-width="2.5" stroke-linecap="round"/>

        <!-- exhaust flames -->
        <g transform="translate(-28 -46)">
          <g>
            <animate attributeName="opacity" values="1;0.35;1" dur="0.22s" repeatCount="indefinite"/>
            <use xlink:href="#jetL"/>
          </g>
          <g transform="translate(-2 -5) scale(0.65)">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="0.3s" repeatCount="indefinite"/>
            <use xlink:href="#jetL"/>
          </g>
          <g transform="translate(-1 5) scale(0.45)">
            <animate attributeName="opacity" values="1;0.3;1" dur="0.17s" repeatCount="indefinite"/>
            <use xlink:href="#jetL"/>
          </g>
          <circle cx="-8" cy="0" r="3" fill="#fff3c4">
            <animate attributeName="opacity" values="1;0.4;1" dur="0.19s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- exhaust smoke -->
        <circle fill="#9a9aa2" opacity="0">
          <animate attributeName="cx" values="-36;-80" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="-48;-56" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3;10" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;0" dur="0.9s" repeatCount="indefinite"/>
        </circle>
        <circle fill="#9a9aa2" opacity="0">
          <animate attributeName="cx" values="-36;-80" dur="0.9s" begin="-0.45s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="-48;-56" dur="0.9s" begin="-0.45s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3;10" dur="0.9s" begin="-0.45s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;0" dur="0.9s" begin="-0.45s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- ============ BANNER ============ -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.37;0.51;0.6;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -16;0 -16;0 0;0 0;0 -10;0 -10" keyTimes="0;0.31;0.37;0.51;0.6;1" dur="6s" repeatCount="indefinite"/>
    <path d="M252 46 L226 74 L252 102 L548 102 L574 74 L548 46 Z" fill="url(#ribbonG)" stroke="#ff7a1a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M264 54 H536" stroke="#ff9e4d" stroke-width="1.5" opacity="0.35"/>
    <path d="M264 94 H536" stroke="#ff9e4d" stroke-width="1.5" opacity="0.35"/>
    <g fill="#ff9e2a">
      <path d="M276 84 C 270 76 271 68 276 61 C 281 68 282 76 276 84 Z">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <path d="M524 84 C 518 76 519 68 524 61 C 529 68 530 76 524 84 Z">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="0.45s" repeatCount="indefinite"/>
      </path>
    </g>
    <text id="entryName" x="400" y="84" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif"
          font-size="30" font-weight="bold" letter-spacing="2" fill="url(#nameG)">WELCOME</text>
    <text x="400" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif"
          font-size="16" fill="#ffbf80">riding in on the Blaze Bike</text>
  </g>
</svg>