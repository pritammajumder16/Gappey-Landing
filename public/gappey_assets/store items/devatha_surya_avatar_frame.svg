<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <title>Devatha Surya Avatar Frame</title>
  <defs>
    <radialGradient id="sGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffd54f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#e8a13a"/>
    </linearGradient>
    <path id="gemS" d="M0 -5.5 L4.2 -2 L2.6 4.5 L-2.6 4.5 L-4.2 -2 Z"/>
    <path id="rayO" d="M0 -112 L2.6 -126 L-2.6 -126 Z" fill="#ffd54f"/>
    <g id="sunE">
      <circle r="7" fill="url(#goldG)" stroke="#b8860b" stroke-width="1"/>
      <circle r="2.4" fill="#fff8e1"/>
      <g stroke="#ffd54f" stroke-width="1.6" stroke-linecap="round">
        <line y1="-9.5" y2="-13"/>
        <line y1="-9.5" y2="-13" transform="rotate(45)"/>
        <line y1="-9.5" y2="-13" transform="rotate(90)"/>
        <line y1="-9.5" y2="-13" transform="rotate(135)"/>
        <line y1="-9.5" y2="-13" transform="rotate(180)"/>
        <line y1="-9.5" y2="-13" transform="rotate(225)"/>
        <line y1="-9.5" y2="-13" transform="rotate(270)"/>
        <line y1="-9.5" y2="-13" transform="rotate(315)"/>
      </g>
    </g>
    <g id="chakraE">
      <circle r="14" fill="none" stroke="url(#goldG)" stroke-width="3"/>
      <circle r="9.5" fill="none" stroke="#fff3c4" stroke-width="1.1" opacity="0.8"/>
      <g stroke="#ffd54f" stroke-width="1.8" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
        <line y1="-4" y2="-12"/>
        <line y1="-4" y2="-12" transform="rotate(45)"/>
        <line y1="-4" y2="-12" transform="rotate(90)"/>
        <line y1="-4" y2="-12" transform="rotate(135)"/>
        <line y1="-4" y2="-12" transform="rotate(180)"/>
        <line y1="-4" y2="-12" transform="rotate(225)"/>
        <line y1="-4" y2="-12" transform="rotate(270)"/>
        <line y1="-4" y2="-12" transform="rotate(315)"/>
      </g>
      <circle r="2.6" fill="#ffd54f" stroke="#b8860b" stroke-width="0.8"/>
    </g>
    <path id="stS" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#fff8e1"/>
    <path id="petalFly" d="M0 -5 C 4.5 -3 5.5 2 3 5.5 C 1 7.5 -2.5 6 -3.5 3 C -4.3 0 -2.5 -3.5 0 -5 Z"/>
  </defs>

  <!-- breathing glow -->
  <circle cx="130" cy="130" r="127" fill="url(#sGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- base rings -->
  <circle cx="130" cy="130" r="100" fill="none" stroke="#1c0b26" stroke-width="26"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#3d1040" stroke-width="18"/>
  <circle cx="130" cy="130" r="113" fill="none" stroke="#ffd54f" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="87" fill="none" stroke="#e8a13a" stroke-width="2"/>
  <circle cx="130" cy="130" r="90" fill="none" stroke="#fff8e1" stroke-width="1.5">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="130" r="100" fill="none" stroke="url(#goldG)" stroke-width="4"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#5b1a5e" stroke-width="4" stroke-dasharray="2 11" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating outer sun-ray ring (outside the band, never near the center) -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="40s" repeatCount="indefinite"/>
    <use xlink:href="#rayO" transform="rotate(0 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(30 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(60 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(90 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(120 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(150 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(180 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(210 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(240 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(270 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(300 130 130)"/>
    <use xlink:href="#rayO" transform="rotate(330 130 130)"/>
  </g>

  <!-- rotating 16-gem divine band -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="24s" repeatCount="indefinite"/>
    <g>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      <use xlink:href="#gemS" transform="rotate(0 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(45 130 130) translate(130 30)" fill="#00c853" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(90 130 130) translate(130 30)" fill="#2979ff" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(135 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(180 130 130) translate(130 30)" fill="#00c853" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(225 130 130) translate(130 30)" fill="#2979ff" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(270 130 130) translate(130 30)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(315 130 130) translate(130 30)" fill="#00c853" stroke="#ffd54f" stroke-width="1"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.3s" repeatCount="indefinite"/>
      <use xlink:href="#gemS" transform="rotate(22.5 130 130) translate(130 30) scale(0.8)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(67.5 130 130) translate(130 30) scale(0.8)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(112.5 130 130) translate(130 30) scale(0.8)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(157.5 130 130) translate(130 30) scale(0.8)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(202.5 130 130) translate(130 30) scale(0.8)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(247.5 130 130) translate(130 30) scale(0.8)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(292.5 130 130) translate(130 30) scale(0.8)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1"/>
      <use xlink:href="#gemS" transform="rotate(337.5 130 130) translate(130 30) scale(0.8)" fill="#e53935" stroke="#ffd54f" stroke-width="1"/>
    </g>
  </g>

  <!-- counter-rotating gold studs -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="18s" repeatCount="indefinite"/>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(30 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(60 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(90 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(120 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(150 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(180 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(210 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(240 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(270 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(300 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="14" r="2.2" fill="#ffd54f" transform="rotate(330 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- spinning Sudarshana chakra topper -->
  <g transform="translate(130 22)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 0 8;3 0 8;-3 0 8" dur="3s" repeatCount="indefinite"/>
      <use xlink:href="#chakraE"/>
    </g>
  </g>

  <!-- sun emblems at the other cardinals -->
  <g transform="translate(238 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
    <use xlink:href="#sunE"/>
  </g></g>
  <g transform="translate(130 236)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    <use xlink:href="#sunE"/>
  </g></g>
  <g transform="translate(22 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
    <use xlink:href="#sunE"/>
  </g></g>

  <!-- pulsing diagonal gems -->
  <use xlink:href="#gemS" transform="translate(200.7 59.3) scale(1.1)" fill="#e53935" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#gemS" transform="translate(59.3 59.3) scale(1)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="-0.5s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#gemS" transform="translate(59.3 200.7) scale(1.1)" fill="#00c853" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" begin="-0.9s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#gemS" transform="translate(200.7 200.7) scale(1)" fill="#2979ff" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="-1.2s" repeatCount="indefinite"/>
  </use>

  <!-- sparkles on the band -->
  <use xlink:href="#stS" transform="translate(222 92) scale(0.8)">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.2s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(38 100) scale(0.7)">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.5s" begin="-0.4s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(96 224) scale(0.75)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.7s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(168 40) scale(0.7)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="-1s" repeatCount="indefinite"/>
  </use>

  <!-- falling petals (sides only) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="52 -14;70 128;42 276" keyTimes="0;0.5;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ffca28" transform="scale(1.1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="210 -14;188 122;220 276" keyTimes="0;0.5;1" dur="9s" begin="-1.8s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f8a5c8" transform="scale(0.9)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-3.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="100 -14;84 138;112 276" keyTimes="0;0.5;1" dur="9s" begin="-3.6s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#fff8e1" transform="scale(1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.8s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-5.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="166 -14;184 130;154 276" keyTimes="0;0.5;1" dur="9s" begin="-5.4s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#e0f7fa" transform="scale(0.85)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- rising gold dust (sides only) -->
  <g fill="#ffe082">
    <circle cx="55" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;44" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="55;63;49;55" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="240" r="1.8" opacity="0">
      <animate attributeName="cy" values="240;40" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="205;197;211;205" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;48" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="95;102;89;95" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="240" r="2.2" opacity="0">
      <animate attributeName="cy" values="240;44" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="168;175;162;168" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>