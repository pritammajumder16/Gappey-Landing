<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <title>Peacock Desi Swag Avatar Frame</title>
  <defs>
    <radialGradient id="pGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.74" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#00e5cc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00e5cc" stop-opacity="0"/>
    </radialGradient>

    <g id="peye">
      <ellipse rx="9.5" ry="14" fill="#26a69a" stroke="#004d40" stroke-width="1"/>
      <ellipse rx="7" ry="10.5" fill="#ffd54f"/>
      <ellipse rx="5.3" ry="8" fill="#1565c0"/>
      <ellipse rx="2.3" ry="3.6" fill="#ffd54f"/>
    </g>

    <g id="fea">
      <line x1="0" y1="-80" x2="0" y2="-102" stroke="#0b4f43" stroke-width="3.5" stroke-linecap="round"/>
      <g stroke="#0b4f43" stroke-width="1.6" stroke-linecap="round">
        <line x1="0" y1="-86" x2="-7" y2="-93"/>
        <line x1="0" y1="-86" x2="7" y2="-93"/>
        <line x1="0" y1="-94" x2="-6" y2="-102"/>
        <line x1="0" y1="-94" x2="6" y2="-102"/>
      </g>
      <use xlink:href="#peye" transform="translate(0 -114) scale(0.9)"/>
    </g>
  </defs>

  <!-- breathing glow -->
  <circle cx="130" cy="130" r="127" fill="url(#pGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- base rings -->
  <circle cx="130" cy="130" r="94" fill="none" stroke="#04211d" stroke-width="26"/>
  <circle cx="130" cy="130" r="94" fill="none" stroke="#0b4f43" stroke-width="18"/>
  <circle cx="130" cy="130" r="107.5" fill="none" stroke="#26a69a" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="80.5" fill="none" stroke="#26a69a" stroke-width="2"/>
  <circle cx="130" cy="130" r="116.5" fill="none" stroke="#ffd54f" stroke-width="2"/>
  <circle cx="130" cy="130" r="71" fill="none" stroke="#4dd0e1" stroke-width="1.5">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- shimmer glints sweeping the ring -->
  <circle cx="130" cy="130" r="107.5" fill="none" stroke="#ffd54f" stroke-width="2.5"
          stroke-dasharray="70 606" stroke-linecap="round" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="130" r="80.5" fill="none" stroke="#4dd0e1" stroke-width="2.5"
          stroke-dasharray="50 456" stroke-linecap="round" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating feather ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="24s" repeatCount="indefinite"/>
    <use xlink:href="#fea" transform="rotate(0 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(36 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(72 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(108 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(144 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(180 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(216 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(252 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(288 130 130) translate(130 130)"/>
    <use xlink:href="#fea" transform="rotate(324 130 130) translate(130 130)"/>
  </g>

  <!-- counter-rotating gold studs -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="16s" repeatCount="indefinite"/>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(0 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(30 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(60 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(90 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(120 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.48s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(150 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(180 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.72s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(210 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.84s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(240 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.96s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(270 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-1.08s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(300 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="42" r="2.2" fill="#ffd54f" transform="rotate(330 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-1.32s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- fixed large feather eyes at cardinal points -->
  <g transform="translate(130 24)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#peye" transform="scale(1.15)"/>
  </g></g>
  <g transform="translate(236 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
    <use xlink:href="#peye" transform="scale(1.15)"/>
  </g></g>
  <g transform="translate(130 236)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    <use xlink:href="#peye" transform="scale(1.15)"/>
  </g></g>
  <g transform="translate(24 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
    <use xlink:href="#peye" transform="scale(1.15)"/>
  </g></g>

  <!-- sparkles -->
  <circle cx="222" cy="90" r="2" fill="#4dd0e1">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="38" cy="96" r="2" fill="#ffd54f">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="-0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="222" r="2" fill="#4dd0e1">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="40" r="2" fill="#ffd54f">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="-1s" repeatCount="indefinite"/>
  </circle>

  <!-- rising dust motes -->
  <g fill="#80deea">
    <circle cx="60" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;44" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="60;68;54;60" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="6s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="240" r="1.8" opacity="0">
      <animate attributeName="cy" values="240;40" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="200;192;208;200" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="240" r="2.2" opacity="0">
      <animate attributeName="cy" values="240;48" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="130;138;124;130" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>