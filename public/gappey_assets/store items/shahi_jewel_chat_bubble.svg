<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="380" height="150" viewBox="0 0 380 150" preserveAspectRatio="none">
  <title>Shahi Jewel Chat Bubble</title>
  <defs>
    <linearGradient id="bFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0a33"/>
      <stop offset="1" stop-color="#12041a"/>
    </linearGradient>
    <linearGradient id="bStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#c8951c"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#e8a13a"/>
    </linearGradient>
    <g id="pearlS">
      <circle r="2.6" fill="#fdf6e3"/>
      <circle cx="-0.8" cy="-0.8" r="0.7" fill="#ffffff"/>
    </g>
    <g id="peye">
      <ellipse rx="9.5" ry="14" fill="#26a69a" stroke="#004d40" stroke-width="1"/>
      <ellipse rx="7" ry="10.5" fill="#ffd54f"/>
      <ellipse rx="5.3" ry="8" fill="#1565c0"/>
      <ellipse rx="2.3" ry="3.6" fill="#ffd54f"/>
    </g>
    <path id="gemS" d="M0 -5.5 L4.2 -2 L2.6 4.5 L-2.6 4.5 L-4.2 -2 Z"/>
    <path id="petalFly" d="M0 -5 C 4.5 -3 5.5 2 3 5.5 C 1 7.5 -2.5 6 -3.5 3 C -4.3 0 -2.5 -3.5 0 -5 Z"/>
    <filter id="bSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- breathing glow -->
  <ellipse cx="190" cy="75" rx="172" ry="60" fill="#ffd54f" filter="url(#bSoft)" opacity="0.22">
    <animate attributeName="opacity" values="0.14;0.34;0.14" dur="2.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- box body -->
  <rect x="10" y="10" width="360" height="130" rx="20" fill="url(#bFill)" stroke="url(#bStroke)" stroke-width="4"/>

  <!-- double zari border -->
  <rect x="17" y="17" width="346" height="116" rx="15" fill="none" stroke="#d4a94e" stroke-width="1.5" opacity="0.55"/>
  <rect x="22" y="22" width="336" height="106" rx="12" fill="none" stroke="#8e5a9e" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- gold comet + violet shimmer -->
  <rect x="10" y="10" width="360" height="130" rx="20" fill="none" stroke="#ffe082"
        stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 856">
    <animate attributeName="stroke-dashoffset" from="946" to="0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="10" y="10" width="360" height="130" rx="20" fill="none" stroke="#b388ff"
        stroke-width="1.5" stroke-linecap="round" stroke-dasharray="26 920" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="946" to="0" dur="5.2s" repeatCount="indefinite"/>
  </rect>

  <!-- hanging ruby medallion -->
  <g transform="translate(70 46)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 -34;4 0 -34;-4 0 -34" dur="3s" repeatCount="indefinite"/>
      <line x1="-6" y1="-34" x2="-3" y2="-15" stroke="url(#goldG)" stroke-width="2"/>
      <line x1="6" y1="-34" x2="3" y2="-15" stroke="url(#goldG)" stroke-width="2"/>
      <circle cx="0" cy="-3" r="12.5" fill="url(#goldG)" stroke="#b8860b" stroke-width="1.5"/>
      <circle cx="0" cy="-3" r="9.5" fill="#4a0e2e"/>
      <circle cx="0" cy="-3" r="4.6" fill="#e53935" stroke="#ff8a80" stroke-width="0.8"/>
      <circle cx="-1.4" cy="-4.4" r="1.3" fill="#ffffff" opacity="0.7"/>
      <circle cx="0" cy="-11.5" r="1.6" fill="#00c853" stroke="#ffd54f" stroke-width="0.5"/>
      <circle cx="6.7" cy="1.5" r="1.4" fill="#00c853" stroke="#ffd54f" stroke-width="0.5"/>
      <circle cx="-6.7" cy="1.5" r="1.4" fill="#00c853" stroke="#ffd54f" stroke-width="0.5"/>
      <circle cx="0" cy="-15.5" r="2" fill="#ffe082"/>
    </g>
  </g>

  <!-- hanging pearl strings from top corners -->
  <g transform="translate(150 16)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="2.8s" repeatCount="indefinite"/>
      <use xlink:href="#pearlS" transform="translate(0 4)"/>
      <use xlink:href="#pearlS" transform="translate(0 12)"/>
      <use xlink:href="#pearlS" transform="translate(0 20)"/>
    </g>
  </g>
  <g transform="translate(230 16)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="5 0 0;-5 0 0;5 0 0" dur="3.1s" repeatCount="indefinite"/>
      <use xlink:href="#pearlS" transform="translate(0 4)"/>
      <use xlink:href="#pearlS" transform="translate(0 12)"/>
      <use xlink:href="#pearlS" transform="translate(0 20)"/>
    </g>
  </g>

  <!-- corner kundan gems -->
  <use xlink:href="#gemS" transform="translate(332 28) scale(1)" fill="#00c853" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#gemS" transform="translate(46 122) scale(0.85)" fill="#2979ff" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" begin="-1s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#gemS" transform="translate(334 122) scale(0.75)" fill="#e0f7fa" stroke="#ffd54f" stroke-width="1">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/>
  </use>

  <!-- rising sparkles -->
  <g>
    <circle cx="95" cy="126" r="2" fill="#ffe082" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.8s" begin="-1.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="95;102;89;95" dur="2.8s" begin="-1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.8s" begin="-1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="126" r="2.4" fill="#fff8e1" opacity="0">
      <animate attributeName="cy" values="126;34" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;158;143;150" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="126" r="3" fill="#ffd54f" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="215;207;223;215" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="126" r="2" fill="#ffe082" opacity="0">
      <animate attributeName="cy" values="126;38" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="280;288;273;280" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="335" cy="126" r="2.6" fill="#fff8e1" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.8s" begin="-0.35s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="335;327;341;335" dur="2.8s" begin="-0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.8s" begin="-0.35s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- drifting pearl + petal + tiny peacock eye -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.15;0.8;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="322 118;296 84;266 42" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    <use xlink:href="#pearlS"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.15;0.8;1" dur="7s" begin="-2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="52 122;84 80;120 40" keyTimes="0;0.5;1" dur="7s" begin="-2s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f8a5c8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.2;0.8;1" dur="9s" begin="-4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="350 124;316 78;300 44" keyTimes="0;0.5;1" dur="9s" begin="-4s" repeatCount="indefinite"/>
    <use xlink:href="#peye" transform="scale(0.55)"/>
  </g>
</svg>