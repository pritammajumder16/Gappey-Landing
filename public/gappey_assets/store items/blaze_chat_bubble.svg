<svg xmlns="http://www.w3.org/2000/svg" width="380" height="150" viewBox="0 0 380 150" preserveAspectRatio="none">
  <title>Blaze Chat Bubble</title>
  <defs>
    <linearGradient id="bFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#311003"/>
      <stop offset="1" stop-color="#160500"/>
    </linearGradient>
    <linearGradient id="bStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff3d00"/>
    </linearGradient>
    <linearGradient id="bFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset="0.6" stop-color="#ff9100"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <filter id="bSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- breathing glow behind the box -->
  <ellipse cx="190" cy="75" rx="172" ry="60" fill="#ff6200" filter="url(#bSoft)" opacity="0.25">
    <animate attributeName="opacity" values="0.18;0.4;0.18" dur="2.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- box body: no tail, no text -->
  <rect id="bubbleBody" x="10" y="10" width="360" height="130" rx="20"
        fill="url(#bFill)" stroke="url(#bStroke)" stroke-width="4"/>

  <!-- top inner highlight -->
  <line x1="36" y1="24" x2="344" y2="24" stroke="#ffcf7a" stroke-width="2" stroke-linecap="round" opacity="0.28"/>

  <!-- ember comet running around the border -->
  <rect x="10" y="10" width="360" height="130" rx="20" fill="none" stroke="#ffcf7a"
        stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 856">
    <animate attributeName="stroke-dashoffset" from="946" to="0" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- flame cluster sitting on the top edge -->
  <g transform="translate(78 12)">
    <path fill="#ff7a1a" d="M0 0 C -6 -6 -5 -12 -9 -16 C -3 -13 -1 -6 0 0 Z">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#bFlame)" d="M0 0 C -8 -8 -7 -18 0 -26 C 7 -18 8 -8 0 0 Z">
      <animate attributeName="d" dur="0.65s" repeatCount="indefinite"
        values="M0 0 C -8 -8 -7 -18 0 -26 C 7 -18 8 -8 0 0 Z;
                M0 0 C -9 -9 -4 -19 -2 -27 C 6 -19 8 -7 0 0 Z;
                M0 0 C -8 -8 -7 -18 0 -26 C 7 -18 8 -8 0 0 Z"/>
    </path>
    <path fill="#ff7a1a" d="M0 0 C 6 -6 5 -11 10 -15 C 4 -12 1 -6 0 0 Z">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.4s" repeatCount="indefinite"/>
    </path>
    <path fill="#fff3c4" d="M0 0 C -3.5 -4 -3 -9 0 -13 C 3 -9 3.5 -4 0 0 Z">
      <animate attributeName="opacity" values="1;0.55;1" dur="0.45s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- rising embers inside the box -->
  <g fill="#ffb347">
    <circle cx="95" cy="126" r="2" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.6s" begin="-1.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="95;102;89;95" dur="2.6s" begin="-1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.6s" begin="-1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="126" r="2.4" opacity="0">
      <animate attributeName="cy" values="126;34" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;158;143;150" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="126" r="3" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.6s" begin="-0.7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="215;207;223;215" dur="2.6s" begin="-0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" begin="-0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="126" r="2" opacity="0">
      <animate attributeName="cy" values="126;38" dur="2.6s" begin="-1.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="280;288;273;280" dur="2.6s" begin="-1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.6s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="335" cy="126" r="2.6" opacity="0">
      <animate attributeName="cy" values="126;36" dur="2.6s" begin="-0.35s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="335;327;341;335" dur="2.6s" begin="-0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.6s" begin="-0.35s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>