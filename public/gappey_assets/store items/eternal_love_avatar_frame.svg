<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <title>Eternal Love Avatar Frame</title>
  <defs>
    <radialGradient id="lGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ff6fa5" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff6fa5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9ea"/>
      <stop offset="0.5" stop-color="#ff8fb8"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#e8a13a"/>
    </linearGradient>
    <path id="hrt" d="M0 4.5 C -4 1 -8 -2 -8 -6 C -8 -9.5 -4.8 -11 -2.2 -9.6 C -1 -9 -0.4 -8 0 -7 C 0.4 -8 1 -9 2.2 -9.6 C 4.8 -11 8 -9.5 8 -6 C 8 -2 4 1 0 4.5 Z"/>
    <g id="roseS">
      <g fill="#e91e63">
        <circle cx="0" cy="-3.6" r="2.6"/><circle cx="3.4" cy="-1.1" r="2.6"/>
        <circle cx="2.1" cy="2.9" r="2.6"/><circle cx="-2.1" cy="2.9" r="2.6"/>
        <circle cx="-3.4" cy="-1.1" r="2.6"/>
      </g>
      <circle r="1.8" fill="#ff8fb8"/>
      <circle r="0.8" fill="#ffd1e3"/>
    </g>
    <g id="lockE">
      <path d="M-4.5 -6 L-4.5 -9 A 4.5 4.5 0 0 1 4.5 -9 L4.5 -6" fill="none" stroke="url(#goldG)" stroke-width="2.2" stroke-linecap="round"/>
      <use xlink:href="#hrt" transform="scale(0.95)" fill="url(#goldG)" stroke="#8a4a00" stroke-width="0.5"/>
      <circle cx="0" cy="-2.5" r="1.4" fill="#4a0e2e"/>
      <path d="M-1.2 -1.5 L1.2 -1.5 L1.9 2.5 L-1.9 2.5 Z" fill="#4a0e2e"/>
    </g>
    <g id="bfly">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;0.3 1;1 1" dur="0.4s" repeatCount="indefinite"/>
        <ellipse cx="-5.5" cy="-1" rx="6" ry="3.6" fill="#ff9ec4" stroke="#c2185b" stroke-width="0.6" transform="rotate(-28)"/>
        <ellipse cx="5.5" cy="-1" rx="6" ry="3.6" fill="#ffd1e3" stroke="#c2185b" stroke-width="0.6" transform="rotate(28)"/>
      </g>
      <ellipse cx="0" cy="0" rx="1.1" ry="4.2" fill="#4a0e2e"/>
    </g>
    <path id="stS" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#fff8e1"/>
    <path id="petalFly" d="M0 -5 C 4.5 -3 5.5 2 3 5.5 C 1 7.5 -2.5 6 -3.5 3 C -4.3 0 -2.5 -3.5 0 -5 Z"/>
  </defs>

  <!-- breathing glow -->
  <circle cx="130" cy="130" r="127" fill="url(#lGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- base rings -->
  <circle cx="130" cy="130" r="100" fill="none" stroke="#2d0a1e" stroke-width="26"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#4a0e2e" stroke-width="18"/>
  <circle cx="130" cy="130" r="113" fill="none" stroke="url(#rgold)" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="87" fill="none" stroke="#c2185b" stroke-width="2"/>
  <circle cx="130" cy="130" r="90" fill="none" stroke="#ffd1e3" stroke-width="1.5">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="130" r="100" fill="none" stroke="url(#goldG)" stroke-width="3"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#7a1040" stroke-width="4" stroke-dasharray="2 11" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- interlocked couple hearts lying on the band (top) -->
  <g transform="translate(107 28) rotate(90)">
    <use xlink:href="#hrt" transform="scale(1.55)" fill="#e91e63" stroke="#ffd1e3" stroke-width="0.9">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(153 28) rotate(90)">
    <use xlink:href="#hrt" transform="scale(1.55)" fill="#ff8fb8" stroke="#fff8e1" stroke-width="0.9">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- (bottom) -->
  <g transform="translate(107 232) rotate(-90)">
    <use xlink:href="#hrt" transform="scale(1.55)" fill="#ff8fb8" stroke="#fff8e1" stroke-width="0.9">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(153 232) rotate(-90)">
    <use xlink:href="#hrt" transform="scale(1.55)" fill="#e91e63" stroke="#ffd1e3" stroke-width="0.9">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- rotating rose strand -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="24s" repeatCount="indefinite"/>
    <use xlink:href="#roseS" transform="rotate(20 130 130) translate(130 34)"/>
    <use xlink:href="#roseS" transform="rotate(65 130 130) translate(130 34) scale(0.8)"/>
    <use xlink:href="#roseS" transform="rotate(110 130 130) translate(130 34)"/>
    <use xlink:href="#roseS" transform="rotate(155 130 130) translate(130 34) scale(0.8)"/>
    <use xlink:href="#roseS" transform="rotate(200 130 130) translate(130 34)"/>
    <use xlink:href="#roseS" transform="rotate(245 130 130) translate(130 34) scale(0.8)"/>
    <use xlink:href="#roseS" transform="rotate(290 130 130) translate(130 34)"/>
    <use xlink:href="#roseS" transform="rotate(335 130 130) translate(130 34) scale(0.8)"/>
  </g>

  <!-- counter-rotating pearl strings -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="18s" repeatCount="indefinite"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(30 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(60 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(90 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(120 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(150 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(180 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(210 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(240 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(270 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(300 130 130)"/>
    <circle cx="130" cy="12" r="2.4" fill="#fdf6e3" transform="rotate(330 130 130)"/>
  </g>

  <!-- heart-with-arrow topper -->
  <g transform="translate(130 24)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 0 2;3 0 2;-3 0 2" dur="3s" repeatCount="indefinite"/>
      <use xlink:href="#hrt" transform="scale(1.9)" fill="url(#rgold)" stroke="#8a1038" stroke-width="0.8"/>
      <circle cx="0" cy="-1.5" r="1.6" fill="#4a0e2e"/>
      <line x1="-14" y1="6" x2="14" y2="-10" stroke="url(#goldG)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M14 -10 L8.5 -9.5 L12 -5.5 Z" fill="url(#goldG)"/>
      <path d="M-14 6 L-9 4.5 M-14 6 L-11 1.5" stroke="url(#goldG)" stroke-width="1.6" stroke-linecap="round"/>
      <use xlink:href="#stS" transform="translate(15 -15) scale(0.5)">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- heart-lock emblems at the other cardinals -->
  <g transform="translate(238 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
    <use xlink:href="#lockE"/>
  </g></g>
  <g transform="translate(130 236)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    <use xlink:href="#lockE"/>
  </g></g>
  <g transform="translate(22 130)"><g>
    <animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
    <use xlink:href="#lockE"/>
  </g></g>

  <!-- pulsing heart gems on diagonals -->
  <use xlink:href="#hrt" transform="translate(200.7 59.3) scale(1.05)" fill="#ff6fa5" stroke="#ffe082" stroke-width="0.8">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#hrt" transform="translate(59.3 59.3) scale(0.9)" fill="#ffd1e3" stroke="#c2185b" stroke-width="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="-0.5s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#hrt" transform="translate(59.3 200.7) scale(1.05)" fill="#e91e63" stroke="#ffe082" stroke-width="0.8">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" begin="-0.9s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#hrt" transform="translate(200.7 200.7) scale(0.9)" fill="#ff9ec4" stroke="#fff8e1" stroke-width="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="-1.2s" repeatCount="indefinite"/>
  </use>

  <!-- orbiting butterflies -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="21s" repeatCount="indefinite"/>
    <g transform="translate(130 8)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="0.7s" repeatCount="indefinite"/>
        <use xlink:href="#bfly" transform="scale(1.05)"/>
      </g>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="26s" begin="-8s" repeatCount="indefinite"/>
    <g transform="translate(130 14)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="7;-7;7" dur="0.6s" repeatCount="indefinite"/>
        <use xlink:href="#bfly" transform="scale(-0.9,0.9)"/>
      </g>
    </g>
  </g>

  <!-- sparkles on the band -->
  <use xlink:href="#stS" transform="translate(222 92) scale(0.8)">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.2s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(38 100) scale(0.7)">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.5s" begin="-0.4s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(96 224) scale(0.75)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.7s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#stS" transform="translate(168 40) scale(0.7)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="-1s" repeatCount="indefinite"/>
  </use>

  <!-- falling rose petals (sides) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="52 -14;70 128;42 276" keyTimes="0;0.5;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ff9ec4" transform="scale(1.1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="210 -14;188 122;220 276" keyTimes="0;0.5;1" dur="9s" begin="-1.8s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ffd1e3" transform="scale(0.9)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-3.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="100 -14;84 138;112 276" keyTimes="0;0.5;1" dur="9s" begin="-3.6s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f8a5c8" transform="scale(1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.8s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- rising rose-gold dust (sides only) -->
  <g fill="#ffd1e3">
    <circle cx="55" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;44" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="55;63;49;55" dur="6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="240" r="1.8" opacity="0">
      <animate attributeName="cy" values="240;40" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="205;197;211;205" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7s" begin="-3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="240" r="2" opacity="0">
      <animate attributeName="cy" values="240;48" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="95;102;89;95" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5.5s" begin="-4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="240" r="2.2" opacity="0">
      <animate attributeName="cy" values="240;44" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="168;175;162;168" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="6.5s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>