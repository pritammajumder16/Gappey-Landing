<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <title>Blaze Avatar Frame</title>
  <defs>
    <radialGradient id="fGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.76" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ff5e00" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff5e00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset="0.55" stop-color="#ff9100"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <g id="lick">
      <path d="M0 3 C -9 -8 -8 -20 0 -32 C 8 -20 9 -8 0 3 Z" fill="url(#fFlame)"/>
      <path d="M0 3 C -4.5 -6 -4 -13 0 -20 C 4 -13 4.5 -6 0 3 Z" fill="#ffe9a8"/>
    </g>
  </defs>

  <!-- pulsing outer glow -->
  <circle cx="130" cy="130" r="127" fill="url(#fGlow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- base ring -->
  <circle cx="130" cy="130" r="100" fill="none" stroke="#2b0f04" stroke-width="26"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#45190a" stroke-width="19"/>
  <circle cx="130" cy="130" r="113" fill="none" stroke="#ff7a1a" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="87" fill="none" stroke="#b3541e" stroke-width="2"/>
  <circle cx="130" cy="130" r="90" fill="none" stroke="#ff8c2a" stroke-width="1.5">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.1s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating flame ring (two flicker groups) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="14s" repeatCount="indefinite"/>
    <g>
      <animate attributeName="opacity" values="1;0.45;1" dur="0.7s" repeatCount="indefinite"/>
      <use xlink:href="#lick" transform="translate(130 34)"/>
      <use xlink:href="#lick" transform="rotate(72 130 130) translate(130 34)"/>
      <use xlink:href="#lick" transform="rotate(144 130 130) translate(130 34)"/>
      <use xlink:href="#lick" transform="rotate(216 130 130) translate(130 34)"/>
      <use xlink:href="#lick" transform="rotate(288 130 130) translate(130 34)"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.55s" repeatCount="indefinite"/>
      <use xlink:href="#lick" transform="rotate(36 130 130) translate(130 34)"/>
      <use xlink:href="#lick" transform="rotate(108 130 130) translate(130 34)"/>
      <use xlink:href="#lick" transform="rotate(180 130 130) translate(130 34)"/>
      <use xlink:href="#lick" transform="rotate(252 130 130) translate(130 34)"/>
      <use xlink:href="#lick" transform="rotate(324 130 130) translate(130 34)"/>
    </g>
  </g>

  <!-- counter-rotating twinkling embers -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="18s" repeatCount="indefinite"/>
    <circle cx="130" cy="8" r="2.6" fill="#ffc46b">
      <animate attributeName="opacity" values="1;0.1;1" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="8" r="2" fill="#ff9330" transform="rotate(55 130 130)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="-0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="8" r="3" fill="#ffc46b" transform="rotate(130 130 130)">
      <animate attributeName="opacity" values="1;0.15;1" dur="0.7s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="8" r="2.2" fill="#ff9330" transform="rotate(200 130 130)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="-0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="8" r="2.4" fill="#ffc46b" transform="rotate(265 130 130)">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="8" r="2" fill="#ff9330" transform="rotate(310 130 130)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" begin="-0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>