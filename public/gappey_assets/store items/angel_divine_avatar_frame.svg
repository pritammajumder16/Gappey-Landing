<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <title>Angel Divine Avatar Frame</title>
  <defs>
    <radialGradient id="aGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.74" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffe9b8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feaG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e6c86e"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <g id="feaF">
      <path d="M0 0 C -6.5 -9 -6.5 -23 0 -32 C 6.5 -23 6.5 -9 0 0 Z" fill="url(#feaG)"/>
      <line x1="0" y1="-3" x2="0" y2="-29" stroke="#fff8e1" stroke-width="1.1" opacity="0.75"/>
    </g>
    <g id="haloE">
      <ellipse rx="13" ry="5.2" fill="none" stroke="#fff3c4" stroke-width="4" opacity="0.3">
        <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="11" ry="4" fill="none" stroke="#ffd54f" stroke-width="2.4"/>
      <ellipse rx="11" ry="4" fill="none" stroke="#fff8e1" stroke-width="0.8" opacity="0.8"/>
    </g>
    <path id="stS" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#ffd54f"/>
  </defs>

  <!-- breathing glow -->
  <circle cx="130" cy="130" r="127" fill="url(#aGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- base rings -->
  <circle cx="130" cy="130" r="100" fill="none" stroke="#241d0e" stroke-width="26"/>
  <circle cx="130" cy="130" r="100" fill="none" stroke="#3d3114" stroke-width="18"/>
  <circle cx="130" cy="130" r="113" fill="none" stroke="#ffd54f" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="87" fill="none" stroke="#ffe082" stroke-width="2"/>
  <circle cx="130" cy="130" r="90" fill="none" stroke="#fff8e1" stroke-width="1.5">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating feather ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="22s" repeatCount="indefinite"/>
    <use xlink:href="#feaF" transform="rotate(0 130 130) translate(130 46) rotate(12)"/>
    <use xlink:href="#feaF" transform="rotate(30 130 130) translate(130 46) rotate(-12)"/>
    <use xlink:href="#feaF" transform="rotate(60 130 130) translate(130 46) rotate(12)"/>
    <use xlink:href="#feaF" transform="rotate(90 130 130) translate(130 46) rotate(-12)"/>
    <use xlink:href="#feaF" transform="rotate(120 130 130) translate(130 46) rotate(12)"/>
    <use xlink:href="#feaF" transform="rotate(150 130 130) translate(130 46) rotate(-12)"/>
    <use xlink:href="#feaF" transform="rotate(180 130 130) translate(130 46) rotate(12)"/>
    <use xlink:href="#feaF" transform="rotate(210 130 130) translate(130 46) rotate(-12)"/>
    <use xlink:href="#feaF" transform="rotate(240 130 130) translate(130 46) rotate(12)"/>
    <use xlink:href="#feaF" transform="rotate(270 130 130) translate(130 46) rotate(-12)"/>
    <use xlink:href="#feaF" transform="rotate(300 130 130) translate(130 46) rotate(12)"/>
    <use xlink:href="#feaF" transform="rotate(330 130 130) translate(130 46) rotate(-12)"/>
  </g>

  <!-- counter-rotating star studs -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="16s" repeatCount="indefinite"/>
    <use xlink:href="#stS" transform="rotate(0 130 130) translate(130 10) scale(0.8)" opacity="1">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="rotate(45 130 130) translate(130 10) scale(0.8)">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="-0.18s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="rotate(90 130 130) translate(130 10) scale(0.8)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.35s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="rotate(135 130 130) translate(130 10) scale(0.8)">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="-0.53s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="rotate(180 130 130) translate(130 10) scale(0.8)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-0.7s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="rotate(225 130 130) translate(130 10) scale(0.8)">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="-0.88s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="rotate(270 130 130) translate(130 10) scale(0.8)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" begin="-1.05s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#stS" transform="rotate(315 130 130) translate(130 10) scale(0.8)">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="-1.23s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- floating halo emblems at cardinal points -->
  <g transform="translate(130 22)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -2;0 2;0 -2" dur="3s" repeatCount="indefinite"/>
      <use xlink:href="#haloE"/>
    </g>
  </g>
  <g transform="translate(238 130)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -2;0 2;0 -2" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
      <use xlink:href="#haloE"/>
    </g>
  </g>
  <g transform="translate(130 238)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -2;0 2;0 -2" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <use xlink:href="#haloE"/>
    </g>
  </g>
  <g transform="translate(22 130)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -2;0 2;0 -2" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
      <use xlink:href="#haloE"/>
    </g>
  </g>

  <!-- sparkles -->
  <circle cx="222" cy="96" r="2" fill="#fff8e1">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="38" cy="96" r="2" fill="#ffd54f">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="-0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="222" r="2" fill="#fff8e1">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" begin="-0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="40" r="2" fill="#ffd54f">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="-1s" repeatCount="indefinite"/>
  </circle>

  <!-- drifting feathers falling across -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="52 -14;70 128;42 276" keyTimes="0;0.5;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <use xlink:href="#feaF" transform="scale(1.1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="210 -14;188 122;220 276" keyTimes="0;0.5;1" dur="9s" begin="-1.8s" repeatCount="indefinite"/>
    <use xlink:href="#feaF" transform="scale(0.9)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3.4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-3.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="100 -14;84 138;112 276" keyTimes="0;0.5;1" dur="9s" begin="-3.6s" repeatCount="indefinite"/>
    <use xlink:href="#feaF" transform="scale(1)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-5.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="166 -14;184 130;154 276" keyTimes="0;0.5;1" dur="9s" begin="-5.4s" repeatCount="indefinite"/>
    <use xlink:href="#feaF" transform="scale(0.85)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3.8s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-7.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="132 -14;114 126;142 276" keyTimes="0;0.5;1" dur="9s" begin="-7.2s" repeatCount="indefinite"/>
    <use xlink:href="#feaF" transform="scale(1.05)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.1s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
</svg>