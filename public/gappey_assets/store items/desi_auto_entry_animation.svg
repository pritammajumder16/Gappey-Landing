<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="400" viewBox="0 0 800 400">
  <title>Desi Auto Entry</title>
  <defs>
    <linearGradient id="autoG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="1" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="autoY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdd835"/>
      <stop offset="1" stop-color="#f9a825"/>
    </linearGradient>
    <linearGradient id="ribbonG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d2e"/>
      <stop offset="1" stop-color="#052418"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#ffe082"/>
    </linearGradient>
    <path id="petalFly" d="M0 -5 C 4.5 -3 5.5 2 3 5.5 C 1 7.5 -2.5 6 -3.5 3 C -4.3 0 -2.5 -3.5 0 -5 Z"/>
    <g id="mari">
      <g fill="#ef6c00">
        <circle cx="0" cy="-5.2" r="3.4"/><circle cx="5" cy="-1.6" r="3.4"/>
        <circle cx="3.1" cy="4.2" r="3.4"/><circle cx="-3.1" cy="4.2" r="3.4"/>
        <circle cx="-5" cy="-1.6" r="3.4"/>
      </g>
      <g fill="#ffb300">
        <circle cx="0" cy="-2.6" r="2.6"/><circle cx="2.5" cy="1.3" r="2.6"/><circle cx="-2.5" cy="1.3" r="2.6"/>
      </g>
      <circle r="1.7" fill="#ffd54f"/>
    </g>
  </defs>

  <!-- ground -->
  <line x1="0" y1="330" x2="800" y2="330" stroke="#2e5d3a" stroke-width="3"/>
  <ellipse cx="330" cy="331" rx="215" ry="10" fill="#ffd54f" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- marigold burst at the stop point -->
  <g transform="translate(330 250)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.2;0.2;1.15;1.15" keyTimes="0;0.3;0.47;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.95;0;0" keyTimes="0;0.3;0.35;0.47;1" dur="6s" repeatCount="indefinite"/>
      <use xlink:href="#mari" transform="translate(0 -36)"/>
      <use xlink:href="#mari" transform="translate(25.5 -25.5)"/>
      <use xlink:href="#mari" transform="translate(36 0)"/>
      <use xlink:href="#mari" transform="translate(25.5 25.5)"/>
      <use xlink:href="#mari" transform="translate(0 36)"/>
      <use xlink:href="#mari" transform="translate(-25.5 25.5)"/>
      <use xlink:href="#mari" transform="translate(-36 0)"/>
      <use xlink:href="#mari" transform="translate(-25.5 -25.5)"/>
    </g>
    <circle r="12" fill="none" stroke="#ffd54f" stroke-width="3">
      <animate attributeName="r" values="12;12;80;80" keyTimes="0;0.3;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.3;0.34;0.46;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="none" stroke="#ef6c00" stroke-width="2.5">
      <animate attributeName="r" values="10;10;62;62" keyTimes="0;0.32;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.32;0.36;0.46;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ambient marigold petals -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="7s" begin="-1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="180 -20;150 420" dur="7s" begin="-1s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ffb300" transform="scale(1.15)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="7s" begin="-2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="420 -20;390 420" dur="7s" begin="-2.5s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ef6c00" transform="scale(0.9)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.6s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="7s" begin="-4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="560 -20;530 420" dur="7s" begin="-4s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#ffb300" transform="scale(1.05)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="7s" begin="-5.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="300 -20;330 420" dur="7s" begin="-5.5s" repeatCount="indefinite"/>
    <use xlink:href="#petalFly" fill="#f57c00" transform="scale(0.85)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.9s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- speed lines (only while moving) -->
  <g stroke="#a5d6a7" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.31;0.6" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <line x1="70" y1="160" x2="170" y2="160">
      <animateTransform attributeName="transform" type="translate" values="60 0;-320 0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="205" x2="230" y2="205">
      <animateTransform attributeName="transform" type="translate" values="40 0;-300 0" dur="0.75s" begin="-0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="250" x2="150" y2="250">
      <animateTransform attributeName="transform" type="translate" values="50 0;-310 0" dur="0.65s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="292" x2="260" y2="292">
      <animateTransform attributeName="transform" type="translate" values="30 0;-290 0" dur="0.7s" begin="-0.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ============ AUTO RICKSHAW ============ -->
  <g transform="translate(0 330)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="-290 0;270 0;270 0;980 0" keyTimes="0;0.3;0.55;1"
        calcMode="spline" keySplines="0 0 0.58 1;0 0 1 1;0.42 0 1 1"
        dur="6s" repeatCount="indefinite"/>

      <!-- sputtering jitter -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0.6;0 -0.8;0 0" dur="0.38s" repeatCount="indefinite"/>

        <ellipse cx="110" cy="8" rx="150" ry="11" fill="#000000" opacity="0.35"/>

        <!-- smoke trail -->
        <path d="M-50 -44 C -90 -52 -130 -40 -170 -48 C -215 -56 -255 -42 -300 -50"
              fill="none" stroke="#9e9ea6" stroke-width="8" stroke-linecap="round"
              stroke-dasharray="26 30" opacity="0.4">
          <animate attributeName="stroke-dashoffset" from="0" to="-112" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.4;0.25;0.4" dur="0.5s" repeatCount="indefinite"/>
        </path>

        <!-- exhaust puffs -->
        <circle cx="-50" cy="-42" r="4" fill="#9e9ea6" opacity="0">
          <animate attributeName="cx" values="-50;-95" dur="1.1s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="-42;-56" dur="1.1s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;11" dur="1.1s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.45;0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-50" cy="-42" r="4" fill="#9e9ea6" opacity="0">
          <animate attributeName="cx" values="-50;-95" dur="1.1s" begin="-0.37s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="-42;-56" dur="1.1s" begin="-0.37s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;11" dur="1.1s" begin="-0.37s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.45;0" dur="1.1s" begin="-0.37s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-50" cy="-42" r="4" fill="#9e9ea6" opacity="0">
          <animate attributeName="cx" values="-50;-95" dur="1.1s" begin="-0.74s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="-42;-56" dur="1.1s" begin="-0.74s" repeatCount="indefinite"/>
          <animate attributeName="r" values="4;11" dur="1.1s" begin="-0.74s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.45;0" dur="1.1s" begin="-0.74s" repeatCount="indefinite"/>
        </circle>

        <!-- wheels -->
        <circle cx="15" cy="-28" r="25" fill="#1b1b1f" stroke="#2e2e34" stroke-width="6"/>
        <circle cx="15" cy="-28" r="11" fill="none" stroke="#c8951c" stroke-width="2.5"/>
        <g stroke="#8a8a92" stroke-width="2.2">
          <animateTransform attributeName="transform" type="rotate" from="0 15 -28" to="360 15 -28" dur="0.55s" repeatCount="indefinite"/>
          <line x1="4" y1="-28" x2="26" y2="-28"/>
          <line x1="15" y1="-39" x2="15" y2="-17"/>
          <line x1="7" y1="-36" x2="23" y2="-20"/>
          <line x1="7" y1="-20" x2="23" y2="-36"/>
        </g>
        <circle cx="15" cy="-28" r="3.5" fill="#f9c440"/>
        <circle cx="208" cy="-28" r="25" fill="#1b1b1f" stroke="#2e2e34" stroke-width="6"/>
        <circle cx="208" cy="-28" r="11" fill="none" stroke="#c8951c" stroke-width="2.5"/>
        <g stroke="#8a8a92" stroke-width="2.2">
          <animateTransform attributeName="transform" type="rotate" from="0 208 -28" to="360 208 -28" dur="0.55s" repeatCount="indefinite"/>
          <line x1="197" y1="-28" x2="219" y2="-28"/>
          <line x1="208" y1="-39" x2="208" y2="-17"/>
          <line x1="200" y1="-36" x2="216" y2="-20"/>
          <line x1="200" y1="-20" x2="216" y2="-36"/>
        </g>
        <circle cx="208" cy="-28" r="3.5" fill="#f9c440"/>

        <!-- body -->
        <path d="M-20 -126 C 50 -148 138 -156 194 -147 L 226 -106 L 246 -100 Q 256 -88 256 -66 Q 256 -52 246 -52 L -22 -52 Q -32 -52 -32 -64 L -32 -110 Q -32 -122 -20 -126 Z"
              fill="url(#autoG)" stroke="#123c30" stroke-width="2"/>
        <rect x="-30" y="-82" width="284" height="9" fill="#f5e6d3" opacity="0.9"/>
        <line x1="-30" y1="-88" x2="254" y2="-88" stroke="#ffd54f" stroke-width="1.5" opacity="0.55"/>

        <!-- windows -->
        <polygon points="30,-144 88,-140 88,-114 30,-118" fill="#b3e5fc" opacity="0.3"/>
        <polygon points="30,-144 88,-140 88,-114 30,-118" fill="none" stroke="#123c30" stroke-width="2.5" stroke-linejoin="round"/>
        <polygon points="106,-142 182,-138 194,-112 110,-116" fill="#b3e5fc" opacity="0.3"/>
        <polygon points="106,-142 182,-138 194,-112 110,-116" fill="none" stroke="#123c30" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- passenger with turban -->
        <path d="M48 -122 Q 58 -127 68 -122 L 66 -116 L 50 -116 Z" fill="#5d4037"/>
        <circle cx="58" cy="-129" r="9" fill="#e8b184"/>
        <path d="M49 -132 Q 58 -144 67 -132 Q 62 -136 58 -136 Q 54 -136 49 -132 Z" fill="#ef6c00"/>
        <circle cx="58" cy="-141" r="2.6" fill="#ef6c00"/>

        <!-- driver -->
        <path d="M170 -110 L 196 -103" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
        <path d="M138 -122 Q 150 -128 162 -122 L 160 -104 L 140 -104 Z" fill="#14385c"/>
        <path d="M156 -114 L 176 -106" stroke="#14385c" stroke-width="6" stroke-linecap="round"/>
        <circle cx="150" cy="-131" r="9.5" fill="#f2b48c"/>
        <path d="M140.5 -133 A 9.5 9.5 0 0 1 159.5 -133 Z" fill="#14213d"/>
        <circle cx="178" cy="-107" r="3.2" fill="#f2b48c"/>

        <!-- meter box -->
        <rect x="192" y="-107" width="22" height="13" rx="2" fill="#f9c440" stroke="#c8951c" stroke-width="1.5"/>
        <circle cx="209" cy="-100.5" r="1.8" fill="#d32f2f"/>

        <!-- door seam + handle + footboard -->
        <line x1="98" y1="-148" x2="98" y2="-54" stroke="#123c30" stroke-width="2.5"/>
        <rect x="88" y="-92" width="9" height="3.5" rx="1.7" fill="#ffd54f"/>
        <rect x="106" y="-54" width="40" height="6" rx="2" fill="#123c30"/>

        <!-- bumpers + exhaust -->
        <rect x="-38" y="-60" width="12" height="14" rx="2" fill="#c8951c"/>
        <rect x="252" y="-58" width="8" height="12" rx="2" fill="#c8951c"/>
        <rect x="-46" y="-46" width="18" height="7" rx="3" fill="#616161"/>
        <circle cx="-46" cy="-42.5" r="3.5" fill="#8a8a92"/>

        <!-- front cowl -->
        <path d="M226 -106 L 246 -100 Q 256 -88 256 -66 Q 256 -52 246 -52 L 216 -52 L 221 -102 Z"
              fill="url(#autoY)" stroke="#c8951c" stroke-width="2"/>

        <!-- roof + trim -->
        <path d="M-22 -140 C 50 -166 140 -172 198 -162 L 192 -148 C 138 -157 50 -148 -18 -128 Z"
              fill="url(#autoY)" stroke="#c8951c" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-18 -128 C 50 -148 138 -157 192 -148" stroke="#c62828" stroke-width="2.5" fill="none"/>

        <!-- windshield -->
        <path d="M198 -162 L 240 -108 L 228 -102 L 192 -150 Z" fill="url(#autoY)" stroke="#c8951c" stroke-width="1.5"/>
        <path d="M201 -156 L 234 -113 L 228 -109 L 198 -147 Z" fill="#b3e5fc" opacity="0.35"/>

        <!-- marigold garland across the windshield -->
        <circle cx="204" cy="-150" r="3.5" fill="#ffb300"/>
        <circle cx="213" cy="-139" r="3.5" fill="#ef6c00"/>
        <circle cx="222" cy="-128" r="3.5" fill="#ffb300"/>
        <circle cx="231" cy="-117" r="3.5" fill="#ef6c00"/>

        <!-- fenders -->
        <path d="M-11 -40 A 30 30 0 0 1 41 -40" stroke="#c8951c" stroke-width="5" fill="none"/>
        <path d="M182 -40 A 30 30 0 0 1 234 -40" stroke="#c8951c" stroke-width="5" fill="none"/>

        <!-- hanging HORN OK PLEASE board -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-2.5 -33 -57;2.5 -33 -57;-2.5 -33 -57" dur="2.8s" repeatCount="indefinite"/>
          <line x1="-33" y1="-57" x2="-102" y2="-90" stroke="#c8b273" stroke-width="1.5"/>
          <line x1="-33" y1="-57" x2="-42" y2="-90" stroke="#c8b273" stroke-width="1.5"/>
          <rect x="-110" y="-90" width="76" height="26" rx="3" fill="#123c30" stroke="#ffd54f" stroke-width="2"/>
          <text x="-72" y="-72.5" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif"
                font-size="9.5" font-weight="bold" letter-spacing="0.3" fill="#ffd54f">HORN OK PLEASE</text>
        </g>

        <!-- headlight beam -->
        <path d="M254 -96 L 292 -106 L 292 -72 Z" fill="#fff9c4" opacity="0.12"/>

        <!-- horn flash -->
        <g transform="translate(262 -90)">
          <g>
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.38;0.46;0.48;1" dur="6s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="scale" values="0.6;0.6;1.15;1.15" keyTimes="0;0.36;0.42;1" dur="6s" repeatCount="indefinite"/>
            <path d="M7 -8 A 10.6 10.6 0 0 1 7 8" stroke="#ffd54f" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M13 -13 A 18.4 18.4 0 0 1 13 13" stroke="#ffd54f" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M19 -17 A 25.5 25.5 0 0 1 19 17" stroke="#ffd54f" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
        </g>

        <!-- headlight -->
        <circle cx="246" cy="-90" r="7" fill="#fff9c4" stroke="#c8951c" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- ============ BANNER ============ -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.37;0.51;0.6;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -16;0 -16;0 0;0 0;0 -10;0 -10" keyTimes="0;0.31;0.37;0.51;0.6;1" dur="6s" repeatCount="indefinite"/>
    <path d="M252 46 L226 74 L252 102 L548 102 L574 74 L548 46 Z" fill="url(#ribbonG)" stroke="#ffd54f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M264 54 H536" stroke="#ffd54f" stroke-width="1.5" opacity="0.35"/>
    <path d="M264 94 H536" stroke="#ffd54f" stroke-width="1.5" opacity="0.35"/>
    <g transform="translate(276 74) scale(0.75)">
      <animate attributeName="opacity" values="1;0.4;1" dur="0.5s" repeatCount="indefinite"/>
      <use xlink:href="#mari"/>
    </g>
    <g transform="translate(524 74) scale(0.75)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.45s" repeatCount="indefinite"/>
      <use xlink:href="#mari"/>
    </g>
    <text id="entryName" x="400" y="84" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif"
          font-size="30" font-weight="bold" letter-spacing="2" fill="url(#nameG)">WELCOME</text>
    <text x="400" y="126" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif"
          font-size="16" fill="#ffe08a">arriving in the Desi Auto</text>
  </g>
</svg>