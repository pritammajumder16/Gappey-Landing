<circle r="6.6" fill="#dfe9f5" stroke="#4c5a6b" stroke-width=".8"/>
<path d="M0 -4.9 L2.9 -3.6 L4.9 0 L3.6 2.9 L0 4.9 L-3.6 2.9 L-4.9 0 L-2.9 -3.6 Z" fill="url(#c4gem)" stroke="#123f7d" stroke-width=".7"/>
<g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
