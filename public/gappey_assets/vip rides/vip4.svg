<animate attributeName="opacity" values=".4;1;.4" dur="1.7s" repeatCount="indefinite"/></path></g>
<circle cx="-1.3" cy="-1.6" r=".7" fill="#fff" opacity=".9"/>
</g>
</g>
</g>
<g transform="translate(128 -30)" opacity="0">
<animate attributeName="opacity" values="0;1" begin="2.85s" dur=".01s" fill="freeze"/>
<animate attributeName="opacity" values="1;0" begin="4.3s" dur=".2s" fill="freeze"/>
<g><animateTransform attributeName="transform" type="scale" values="0;1.25;1" keyTimes="0;.6;1" begin="2.85s" dur=".45s" fill="freeze"/>
<g><animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2.4s" begin=".5s" repeatCount="indefinite"/>
<circle r="6.6" fill="#dfe9f5" stroke="#4c5a6b" stroke-width=".8"/>
<path d="M0 -4.9 L2.9 -3.6 L4.9 0 L3.6 2.9 L0 4.9 L-3.6 2.9 L-4.9 0 L-2.9 -3.6 Z" fill="url(#c4gem)" stroke="#123f7d" stroke-width=".7"/>
<g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
<path d="M0 -2.4 L.5 -.5 L2.4 0 L.5 .5 L0 2.4 L-.5 .5 L-2.4 0 L-.5 -.5 Z" fill="#fff">
<animate attributeName="opacity" values="1;.4;1" dur="1.7s" repeatCount="indefinite"/></path></g>
<circle cx="-1.3" cy="-1.6" r=".7" fill="#fff" opacity=".9"/>
</g>
</g>
</g>

<!-- satellite sparks -->
<g opacity="0">
<animate attributeName="opacity" values="0;1" begin="2.75s" dur=".3s" fill="freeze"/>
<animate attributeName="opacity" values="1;0" begin="4.3s" dur=".2s" fill="freeze"/>
