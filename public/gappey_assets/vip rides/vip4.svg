<circle cx="80" cy="0" r="2.2" fill="#bfe9ff" opacity=".7"/><circle cx="80" cy="0" r="1" fill="#fff"/></g>
<g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4.6s" begin=".6s" repeatCount="indefinite"/>
<circle cx="62" cy="0" r="1.8" fill="#9fd6ff" opacity=".6"/><circle cx="62" cy="0" r=".8" fill="#fff"/></g>
</g>

</g>
</g>
</g>
</g>

<!-- name plate -->
<g transform="translate(0 -74)" opacity="0">
<animate attributeName="opacity" values="0;1" begin="2.85s" dur=".35s" fill="freeze"/>
<animate attributeName="opacity" values="1;0" begin="4.35s" dur=".3s" fill="freeze"/>
<g>
<animateTransform attributeName="transform" type="scale" values=".8;.8;1.05;1" keyTimes="0;.4;.75;1" begin="2.85s" dur=".45s" fill="freeze"/>
<rect x="-95" y="-19" width="190" height="38" rx="14" fill="url(#c4plate)" stroke="#9fd0ff" stroke-width="2"/>
<rect x="-91" y="-15" width="182" height="30" rx="11" fill="none" stroke="#d6f0ff" stroke-width=".8" opacity=".4"/>
<path d="M-62 -19 L-59 -15.5 L-62 -12 L-65 -15.5 Z" fill="url(#c4gem)" stroke="#123f7d" stroke-width=".6"><animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/></path>
<path d="M62 -19 L65 -15.5 L62 -12 L59 -15.5 Z" fill="url(#c4gem)" stroke="#123f7d" stroke-width=".6"><animate attributeName="opacity" values="1;.5;1" dur="2s" begin="1s" repeatCount="indefinite"/></path>
<g clip-path="url(#c4plateClip)">
