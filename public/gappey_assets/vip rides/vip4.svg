<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 170" width="500" height="170">
<title>VIP 4 Ride — Platinum Helicopter</title>
<defs>
<linearGradient id="c4body" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f6fafd"/><stop offset=".45" stop-color="#aebccb">
<animate attributeName="stop-color" values="#aebccb;#d7e1ec;#aebccb" dur="4s" repeatCount="indefinite"/>
</stop><stop offset="1" stop-color="#7e8fa2"/>
</linearGradient>
<linearGradient id="c4plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131c26"/><stop offset="1" stop-color="#080f16"/></linearGradient>
<linearGradient id="c4beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9ff" stop-opacity=".55"/><stop offset="1" stop-color="#bfe9ff" stop-opacity="0"/></linearGradient>
<linearGradient id="c4scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfe9ff" stop-opacity="0"/><stop offset=".5" stop-color="#bfe9ff" stop-opacity=".35"/><stop offset="1" stop-color="#bfe9ff" stop-opacity="0"/></linearGradient>
<radialGradient id="c4gem" cx=".35" cy=".3" r=".95"><stop offset="0" stop-color="#f0f9ff"/><stop offset=".4" stop-color="#9fd0ff"/><stop offset="1" stop-color="#123f7d"/></radialGradient>
<clipPath id="c4bodyClip"><path d="M66 -6 Q60 -30 32 -33 L-4 -33 Q-28 -31 -38 -10 Q-42 -2 -38 4 L58 8 Q68 6 66 -6 Z"/></clipPath>
<clipPath id="c4plateClip"><rect x="-95" y="-19" width="190" height="38" rx="14"/></clipPath>
</defs>

<!-- landing pad -->
<g opacity="0">
<animate attributeName="opacity" values="0;.8" begin=".25s" dur=".45s" fill="freeze"/>
<animate attributeName="opacity" values=".8;0" begin="4.75s" dur=".6s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 6" keyTimes="0;.88;1" dur="5.4s" fill="freeze"/>
<ellipse cx="250" cy="151" rx="80" ry="11" fill="#7fd4ff" opacity=".14"/>
<ellipse cx="250" cy="151" rx="66" ry="9" fill="none" stroke="#7fd4ff" stroke-width="2" pathLength="100" stroke-dasharray="6 6">
<animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="250" cy="151" rx="42" ry="5.5" fill="none" stroke="#bfe9ff" stroke-width="1.2" opacity=".55" pathLength="100" stroke-dasharray="3 5">
<animate attributeName="stroke-dashoffset" from="0" to="100" dur="2.2s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="250" cy="151" rx="5" ry="1.4" fill="#bfe9ff">
<animate attributeName="opacity" values=".5;1;.5" dur="1.6s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="250" cy="151" rx="10" ry="2" fill="none" stroke="#bfe9ff" stroke-width="1.4" opacity="0">
<animate attributeName="rx" values="12;64" begin="2.85s" dur="1s" fill="freeze"/>
<animate attributeName="ry" values="2;8.5" begin="2.85s" dur="1s" fill="freeze"/>
<animate attributeName="opacity" values="0;.55;0" keyTimes="0;.25;1" begin="2.85s" dur="1s" fill="freeze"/>
</ellipse>
<ellipse cx="250" cy="151" rx="10" ry="2" fill="none" stroke="#7fd4ff" stroke-width="1.1" opacity="0">
<animate attributeName="rx" values="12;58" begin="3.25s" dur="1s" fill="freeze"/>
<animate attributeName="ry" values="2;8" begin="3.25s" dur="1s" fill="freeze"/>
<animate attributeName="opacity" values="0;.45;0" keyTimes="0;.25;1" begin="3.25s" dur="1s" fill="freeze"/>
</ellipse>
</g>

<!-- hologram scan -->
<rect x="-40" y="0" width="90" height="170" fill="url(#c4scan)" opacity="0">
