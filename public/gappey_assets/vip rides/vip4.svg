</g>
</g>
<text x="0" y="-1" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#f4f9ff">Welcome</text>
<text x="0" y="13" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2.5" fill="#9fd0ff">VIP 4 HAS ENTERED</text>
</g>
</g>

<circle cx="0" cy="-10" r="26" fill="none" stroke="#7fc4ff" stroke-width="2.5" opacity="0">
