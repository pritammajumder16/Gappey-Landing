values="-760 -10;-760 -10;0 0;0 0;770 -6"
keyTimes="0;.05;.5;.82;1"
calcMode="spline"
keySplines="0 0 1 1;.17 .67 .24 1;0 0 1 1;.55 .06 .68 .19"
dur="5.4s" fill="freeze"/>
