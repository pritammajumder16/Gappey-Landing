<animateTransform attributeName="transform" type="translate" values="-120 0;560 0" keyTimes="0;1" begin="2.95s" dur=".7s" fill="freeze"/>
</rect>

<!-- CENTER WRAPPER -->
<g transform="translate(250 92)">
