<!-- sapphire gems -->
<g transform="translate(-128 -26)" opacity="0">
<animate attributeName="opacity" values="0;1" begin="2.7s" dur=".01s" fill="freeze"/>
<animate attributeName="opacity" values="1;0" begin="4.3s" dur=".2s" fill="freeze"/>
