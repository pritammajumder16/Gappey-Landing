<animate attributeName="opacity" values="0;.45;0" keyTimes="0;.3;1" begin="3.1s" dur=".85s" fill="freeze"/>
</circle>

<!-- gold sparkle pops -->
<g transform="translate(-88 -40)" opacity="0">
<animate attributeName="opacity" values="0;.95;.9" keyTimes="0;.4;1" begin="2.9s" dur=".5s" fill="freeze"/>
<g><animateTransform attributeName="transform" type="scale" values="0;1.3;1" keyTimes="0;.6;1" begin="2.9s" dur=".5s" fill="freeze"/>
<path d="M0 -5.5 L1.1 -1.1 L5.5 0 L1.1 1.1 L0 5.5 L-1.1 1.1 L-5.5 0 L-1.1 -1.1 Z" fill="#fff6d8"/></g>
</g>
<g transform="translate(74 -48)" opacity="0">
