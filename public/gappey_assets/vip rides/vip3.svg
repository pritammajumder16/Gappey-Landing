<path d="M37.6 -22.6 L43.4 -22.6 L42.6 -24.4 L38.4 -24.4 Z" fill="#8a5f08"/>
<rect x="33" y="-22" width="26" height="2.6" rx="1.3" fill="#fff3cf" opacity=".8"/>

