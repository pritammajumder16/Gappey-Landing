<g fill="url(#c3hub)" stroke="#6b4d05" stroke-width=".4">
<circle cx="-120" cy="9.6" r="1.8"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="-90" cy="9.6" r="2.1"><animate attributeName="opacity" values="1;.4;1" dur="2.2s" begin=".25s" repeatCount="indefinite"/></circle>
<circle cx="-60" cy="9.6" r="1.8"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" begin=".5s" repeatCount="indefinite"/></circle>
<circle cx="-30" cy="9.6" r="2.1"><animate attributeName="opacity" values="1;.4;1" dur="2.2s" begin=".75s" repeatCount="indefinite"/></circle>
<circle cx="0" cy="9.6" r="2.3"><animate attributeName="opacity" values="1;.4;1" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="30" cy="9.6" r="2.1"><animate attributeName="opacity" values="1;.4;1" dur="2.2s" begin="1.25s" repeatCount="indefinite"/></circle>
<circle cx="60" cy="9.6" r="1.8"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" begin="1.5s" repeatCount="indefinite"/></circle>
<circle cx="90" cy="9.6" r="2.1"><animate attributeName="opacity" values="1;.4;1" dur="2.2s" begin="1.75s" repeatCount="indefinite"/></circle>
<circle cx="120" cy="9.6" r="1.8"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" begin="2s" repeatCount="indefinite"/></circle>
</g>
<rect x="-138" y="11.6" width="276" height="1.4" fill="#3a2a08" opacity=".85"/>

<!-- crown emblem + hex gem on the door (frame DNA) -->
<g transform="translate(-36 -5)">
<path d="M0 5.6 L1 .4 L3.4 2.7 L4.8 -.6 L6.2 2.7 L8.6 .4 L9.6 5.6 Z" fill="#fff3cf" stroke="#6b4d05" stroke-width=".8" stroke-linejoin="round">
<animate attributeName="opacity" values=".85;1;.85" dur="2.6s" repeatCount="indefinite"/>
</path>
<path d="M13.5 2.2 L15.8 0 L18.1 2.2 L15.8 4.4 Z" fill="url(#c3hub)" stroke="#6b4d05" stroke-width=".6"/>
</g>

