<g><animateTransform attributeName="transform" type="scale" values="0;1.2;1" keyTimes="0;.6;1" begin="3.05s" dur=".5s" fill="freeze"/>
<path d="M0 -5.5 L1.1 -1.1 L5.5 0 L1.1 1.1 L0 5.5 L-1.1 1.1 L-5.5 0 L-1.1 -1.1 Z" fill="#ffe9a8"/></g>
</g>
<g transform="translate(126 -6)" opacity="0">
