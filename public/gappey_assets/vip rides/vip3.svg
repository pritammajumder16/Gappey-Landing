<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 170" width="500" height="170">
<title>VIP 3 Ride — Gilded Limousine</title>
<defs>
<linearGradient id="c3body" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff3c4"><animate attributeName="stop-color" values="#fff3c4;#fffdf0;#fff3c4" dur="4s" repeatCount="indefinite"/></stop>
<stop offset=".45" stop-color="#d9a32e"><animate attributeName="stop-color" values="#d9a32e;#f2c25a;#d9a32e" dur="4.5s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#8a5f08"/>
</linearGradient>
<linearGradient id="c3plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1305"/><stop offset="1" stop-color="#100b03"/></linearGradient>
<radialGradient id="c3hub" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff6d8"/><stop offset=".45" stop-color="#ffcf6e"/><stop offset="1" stop-color="#b8791a"/></radialGradient>
<radialGradient id="c3flash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffdf0" stop-opacity=".95"/><stop offset=".45" stop-color="#ffd970" stop-opacity=".5"/><stop offset="1" stop-color="#ffd970" stop-opacity="0"/></radialGradient>
<clipPath id="c3clip"><path d="M-145 5 Q-145 13 -137 13 L137 13 Q145 13 145 5 L145 -2 Q145 -8 136 -9 L96 -10 Q86 -25 62 -26 L-58 -26 Q-80 -26 -90 -11 L-136 -9 Q-145 -8 -145 -2 Z"/></clipPath>
<clipPath id="c3plateClip"><rect x="-100" y="-19" width="200" height="38" rx="14"/></clipPath>
</defs>

<!-- road + red carpet: appear before arrival, dissolve after exit -->
<g opacity="0">
<animate attributeName="opacity" values="0;.5" begin=".3s" dur=".4s" fill="freeze"/>
<animate attributeName="opacity" values=".5;0" begin="4.85s" dur=".6s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 7" keyTimes="0;.87;1" dur="5.6s" fill="freeze"/>
<line x1="60" y1="141" x2="440" y2="141" stroke="#3a2413" stroke-width="2.2" stroke-linecap="round"/>
<line x1="80" y1="149.5" x2="420" y2="149.5" stroke="#3a2413" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="13 9" opacity=".6"/>
<!-- red carpet unrolling ahead of the limo -->
<g transform="translate(70 138)">
<g>
<animateTransform attributeName="transform" type="scale" values="0.001 1;0.001 1;1 1" keyTimes="0;.3;1" begin=".35s" dur=".55s" calcMode="spline" keySplines=".2 .7 .3 1;.2 .7 .3 1" fill="freeze"/>
<rect x="0" y="0" width="360" height="13" rx="6" fill="#5f1712" stroke="#3f0e0a" stroke-width="1"/>
<line x1="6" y1="1.6" x2="354" y2="1.6" stroke="#d9a32e" stroke-width="1.5" opacity=".9"/>
<line x1="6" y1="11.4" x2="354" y2="11.4" stroke="#d9a32e" stroke-width="1.5" opacity=".9"/>
<g fill="#ffd970" opacity=".85">
<path d="M30 6.5 L32.2 4.3 L34.4 6.5 L32.2 8.7 Z"/><path d="M80 6.5 L82.2 4.3 L84.4 6.5 L82.2 8.7 Z"/><path d="M130 6.5 L132.2 4.3 L134.4 6.5 L132.2 8.7 Z"/><path d="M180 6.5 L182.2 4.3 L184.4 6.5 L182.2 8.7 Z"/><path d="M230 6.5 L232.2 4.3 L234.4 6.5 L232.2 8.7 Z"/><path d="M280 6.5 L282.2 4.3 L284.4 6.5 L282.2 8.7 Z"/><path d="M330 6.5 L332.2 4.3 L334.4 6.5 L332.2 8.7 Z"/>
</g>
</g>
</g>
</g>

<!-- static center wrapper: limo rests exactly at canvas center -->
<g transform="translate(250 112)">
<g>
<!-- golden flash-bloom as it stops (behind everything) -->
<circle cx="0" cy="-6" r="24" fill="url(#c3flash)" opacity="0">
<animate attributeName="r" values="24;160" begin="2.78s" dur=".7s" fill="freeze"/>
<animate attributeName="opacity" values="0;.85;0" keyTimes="0;.3;1" begin="2.78s" dur=".7s" fill="freeze"/>
</circle>

<!-- master move: stately in (ease-out) → hold → out (ease-in) -->
<animateTransform attributeName="transform" type="translate"
values="-780 0;-780 0;0 0;0 0;800 0"
keyTimes="0;.06;.5;.82;1"
calcMode="spline"
keySplines="0 0 1 1;.17 .67 .24 1;0 0 1 1;.55 .06 .68 .19"
dur="5.6s" fill="freeze"/>

<!-- ground shadow -->
<ellipse cx="0" cy="30" rx="150" ry="6" fill="#000" opacity="0">
<animate attributeName="opacity" values="0;.26;.28;.28;0" keyTimes="0;.06;.5;.82;1" dur="5.6s" fill="freeze"/>
</ellipse>

<!-- dust: entry puffs -->
<circle cx="-150" cy="30" r="3" fill="#8a5a34" opacity="0">
<animate attributeName="opacity" values="0;.5;0" dur="1.3s" begin=".6s"/>
<animate attributeName="cx" values="-150;-192" dur="1.3s" begin=".6s"/>
<animate attributeName="r" values="3;7" dur="1.3s" begin=".6s"/>
</circle>
<circle cx="-154" cy="34" r="2.6" fill="#a06a3c" opacity="0">
<animate attributeName="opacity" values="0;.42;0" dur="1.3s" begin="1.2s"/>
<animate attributeName="cx" values="-154;-198" dur="1.3s" begin="1.2s"/>
<animate attributeName="r" values="2.6;6.4" dur="1.3s" begin="1.2s"/>
</circle>
<!-- dust: exit puffs -->
<circle cx="-150" cy="30" r="3.4" fill="#8a5a34" opacity="0">
<animate attributeName="opacity" values="0;.5;0" dur=".85s" begin="4.6s"/>
<animate attributeName="cx" values="-150;-200" dur=".85s" begin="4.6s"/>
<animate attributeName="r" values="3.4;8" dur=".85s" begin="4.6s"/>
</circle>
<circle cx="-146" cy="36" r="2.8" fill="#a06a3c" opacity="0">
<animate attributeName="opacity" values="0;.42;0" dur=".7s" begin="4.8s"/>
<animate attributeName="cx" values="-146;-196" dur=".7s" begin="4.8s"/>
<animate attributeName="r" values="2.8;7" dur=".7s" begin="4.8s"/>
</circle>

<!-- speed lines -->
<g stroke="#d9b08c" stroke-width="2.5" stroke-linecap="round" opacity="0">
<animate attributeName="opacity" values="0;.32;.32;0;0;.75;0" keyTimes="0;.08;.44;.5;.56;.64;.8" dur="5.6s" fill="freeze"/>
<line x1="-150" y1="-10" x2="-196" y2="-10"/>
<line x1="-144" y1="2" x2="-202" y2="2"/>
<line x1="-150" y1="14" x2="-192" y2="14"/>
</g>

<!-- rear wheel -->
<g transform="translate(-95 16)">
<circle r="14" fill="#1a1206" stroke="#d9a32e" stroke-width="2.5"/>
<g>
<animateTransform attributeName="transform" type="rotate"
values="0;0;760;760;1240" keyTimes="0;.06;.5;.82;1"
calcMode="spline" keySplines="0 0 1 1;.17 .67 .24 1;0 0 1 1;.55 .06 .68 .19"
dur="5.6s" fill="freeze"/>
<g stroke="#c9971f" stroke-width="1.8">
<path d="M0 -11 L0 11"/><path d="M-11 0 L11 0"/>
<path d="M-7.8 -7.8 L7.8 7.8"/><path d="M-7.8 7.8 L7.8 -7.8"/>
</g>
</g>
<path d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z" fill="url(#c3hub)" stroke="#6b4d05" stroke-width=".7"/>
</g>

<!-- front wheel -->
<g transform="translate(95 16)">
<circle r="14" fill="#1a1206" stroke="#d9a32e" stroke-width="2.5"/>
<g>
<animateTransform attributeName="transform" type="rotate"
values="0;0;760;760;1240" keyTimes="0;.06;.5;.82;1"
calcMode="spline" keySplines="0 0 1 1;.17 .67 .24 1;0 0 1 1;.55 .06 .68 .19"
dur="5.6s" fill="freeze"/>
<g stroke="#c9971f" stroke-width="1.8">
<path d="M0 -11 L0 11"/><path d="M-11 0 L11 0"/>
<path d="M-7.8 -7.8 L7.8 7.8"/><path d="M-7.8 7.8 L7.8 -7.8"/>
</g>
</g>
<path d="M0 -4 L3.5 -2 L3.5 2 L0 4 L-3.5 2 L-3.5 -2 Z" fill="url(#c3hub)" stroke="#6b4d05" stroke-width=".7"/>
</g>

<!-- body: suspension settle -->
<g>
<animateTransform attributeName="transform" type="translate"
values="0 0;0 0;0 3;0 -1.6;0 1;0 0;0 -.8;0 .5;0 0"
keyTimes="0;.49;.53;.57;.61;.65;.72;.8;.88"
dur="5.6s" fill="freeze"/>
<g>
<animateTransform attributeName="transform" type="rotate"
values="0;0;-1.2;.7;0;0" keyTimes="0;.49;.55;.61;.66;1"
dur="5.6s" fill="freeze"/>

<path d="M-145 5 Q-145 13 -137 13 L137 13 Q145 13 145 5 L145 -2 Q145 -8 136 -9 L96 -10 Q86 -25 62 -26 L-58 -26 Q-80 -26 -90 -11 L-136 -9 Q-145 -8 -145 -2 Z"
fill="url(#c3body)" stroke="#6b4d05" stroke-width="2.5"/>

<!-- jewel windows with pearl valances -->
<rect x="-54" y="-22" width="28" height="11" rx="2.5" fill="#2b1e06"/>
<rect x="-20" y="-22" width="26" height="11" rx="2.5" fill="#2b1e06"/>
<rect x="12" y="-22" width="16" height="11" rx="2.5" fill="#2b1e06"/>
<rect x="-54" y="-22" width="82" height="3" rx="1.5" fill="#fff3cf" opacity=".8"/>
<circle cx="-48" cy="-16.5" r="1" fill="#fff3cf" opacity=".55"/><circle cx="-42" cy="-16.5" r="1" fill="#fff3cf" opacity=".55"/><circle cx="-36" cy="-16.5" r="1" fill="#fff3cf" opacity=".55"/><circle cx="-30" cy="-16.5" r="1" fill="#fff3cf" opacity=".55"/>
<circle cx="-14" cy="-16.5" r="1" fill="#fff3cf" opacity=".55"/><circle cx="-8" cy="-16.5" r="1" fill="#fff3cf" opacity=".55"/><circle cx="-2" cy="-16.5" r="1" fill="#fff3cf" opacity=".55"/><circle cx="4" cy="-16.5" r="1" fill="#fff3cf" opacity=".55"/>
