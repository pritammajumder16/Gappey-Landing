<circle cx="139" cy="2" r="5.5" fill="#fff6d8" opacity=".2"/>
<circle cx="139" cy="2" r="3.2" fill="#fff6d8">
<animate attributeName="opacity" values=".65;1;.65" dur="1.6s" repeatCount="indefinite"/>
</circle>
<rect x="-145.5" y="-1" width="3" height="5" rx="1.5" fill="#e59b5c" opacity=".8"/>

<!-- glint sweeps across the body -->
<g clip-path="url(#c3clip)">
<g>
<animateTransform attributeName="transform" type="translate" values="-160 0;170 0" keyTimes="0;1" begin="3s" dur=".6s" fill="freeze"/>
<rect x="-8" y="-34" width="15" height="60" fill="#ffffff" opacity=".3" transform="skewX(-18)"/>
</g>
</g>
<g clip-path="url(#c3clip)">
<g>
<animateTransform attributeName="transform" type="translate" values="-160 0;170 0" keyTimes="0;1" begin="3.45s" dur=".55s" fill="freeze"/>
<rect x="-7" y="-34" width="12" height="60" fill="#ffffff" opacity=".2" transform="skewX(-18)"/>
</g>
</g>
</g>
</g>

<!-- falling gold confetti (hold only) -->
<g fill="#ffe9a8">
<g transform="translate(-108 0)" opacity="0"><animate attributeName="opacity" values="0;.95;0" keyTimes="0;.15;1" begin="2.85s" dur="1.15s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" values="0 -72;0 -22" begin="2.85s" dur="1.15s" fill="freeze"/><path d="M0 -3 L1.9 0 L0 3 L-1.9 0 Z"/></g></g>
<g transform="translate(-52 0)" opacity="0"><animate attributeName="opacity" values="0;.9;0" keyTimes="0;.15;1" begin="3s" dur="1.05s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" values="0 -64;0 -18" begin="3s" dur="1.05s" fill="freeze"/><path d="M0 -2.6 L1.7 0 L0 2.6 L-1.7 0 Z"/></g></g>
<g transform="translate(6 0)" opacity="0"><animate attributeName="opacity" values="0;.95;0" keyTimes="0;.15;1" begin="3.15s" dur="1.2s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" values="0 -78;0 -24" begin="3.15s" dur="1.2s" fill="freeze"/><path d="M0 -3 L1.9 0 L0 3 L-1.9 0 Z"/></g></g>
<g transform="translate(62 0)" opacity="0"><animate attributeName="opacity" values="0;.9;0" keyTimes="0;.15;1" begin="3.05s" dur="1.1s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" values="0 -68;0 -20" begin="3.05s" dur="1.1s" fill="freeze"/><path d="M0 -2.6 L1.7 0 L0 2.6 L-1.7 0 Z"/></g></g>
<g transform="translate(116 0)" opacity="0"><animate attributeName="opacity" values="0;.9;0" keyTimes="0;.15;1" begin="3.3s" dur="1.15s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" values="0 -70;0 -22" begin="3.3s" dur="1.15s" fill="freeze"/><path d="M0 -3 L1.9 0 L0 3 L-1.9 0 Z"/></g></g>
</g>

<!-- rising gold motes (hold only) -->
<g>
<circle cx="-84" cy="-14" r="1.6" fill="#fff3cf" opacity="0"><animate attributeName="opacity" values="0;.8;0" keyTimes="0;.2;1" begin="2.9s" dur="1.1s" fill="freeze"/><animate attributeName="cy" values="-14;-58" begin="2.9s" dur="1.1s" fill="freeze"/></circle>
<circle cx="24" cy="-10" r="1.3" fill="#ffe9b8" opacity="0"><animate attributeName="opacity" values="0;.7;0" keyTimes="0;.2;1" begin="3.2s" dur="1s" fill="freeze"/><animate attributeName="cy" values="-10;-52" begin="3.2s" dur="1s" fill="freeze"/></circle>
<circle cx="102" cy="-16" r="1.5" fill="#fff3cf" opacity="0"><animate attributeName="opacity" values="0;.75;0" keyTimes="0;.2;1" begin="3.45s" dur="1.05s" fill="freeze"/><animate attributeName="cy" values="-16;-56" begin="3.45s" dur="1.05s" fill="freeze"/></circle>
</g>

<!-- name plate -->
<g transform="translate(0 -66)" opacity="0">
<animate attributeName="opacity" values="0;1" begin="2.85s" dur=".4s" fill="freeze"/>
<animate attributeName="opacity" values="1;0" begin="4.3s" dur=".3s" fill="freeze"/>
<g>
<animateTransform attributeName="transform" type="scale" values=".8;.8;1.05;1" keyTimes="0;.4;.75;1" begin="2.85s" dur=".45s" fill="freeze"/>
<rect x="-100" y="-19" width="200" height="38" rx="14" fill="url(#c3plate)" stroke="#d9a32e" stroke-width="2"/>
<rect x="-96" y="-15" width="192" height="30" rx="11" fill="none" stroke="#fff3cf" stroke-width=".8" opacity=".4"/>
<rect x="-92.5" y="-11.5" width="185" height="23" rx="8.5" fill="none" stroke="#8a5f08" stroke-width=".6" opacity=".6"/>
<!-- beads on the plate rim -->
<circle cx="-62" cy="-19" r="2" fill="url(#c3hub)" stroke="#6b4d05" stroke-width=".4"><animate attributeName="opacity" values=".5;1;.5" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="0" cy="-19" r="2.3" fill="url(#c3hub)" stroke="#6b4d05" stroke-width=".4"><animate attributeName="opacity" values="1;.5;1" dur="2.2s" begin=".4s" repeatCount="indefinite"/></circle>
<circle cx="62" cy="-19" r="2" fill="url(#c3hub)" stroke="#6b4d05" stroke-width=".4"><animate attributeName="opacity" values=".5;1;.5" dur="2.2s" begin=".8s" repeatCount="indefinite"/></circle>
<!-- shine sweep -->
<g clip-path="url(#c3plateClip)">
