<rect x="-9" y="-24" width="16" height="48" fill="#ffffff" opacity=".2" transform="skewX(-18)"/>
</g>
</g>
<text x="0" y="-1" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#fff6d8">Welcome</text>
<text x="0" y="13" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2.5" fill="#e6b13a">VIP 3 HAS ENTERED</text>
</g>
</g>

<!-- hold burst: triple gold rings -->
<circle cx="0" cy="-6" r="26" fill="none" stroke="#ffd970" stroke-width="2.5" opacity="0">
<animate attributeName="r" values="26;130" begin="2.8s" dur=".85s" fill="freeze"/>
<animate attributeName="opacity" values="0;.65;0" keyTimes="0;.3;1" begin="2.8s" dur=".85s" fill="freeze"/>
</circle>
<circle cx="0" cy="-6" r="20" fill="none" stroke="#fff6d8" stroke-width="1.6" opacity="0">
<animate attributeName="r" values="20;104" begin="2.95s" dur=".85s" fill="freeze"/>
<animate attributeName="opacity" values="0;.55;0" keyTimes="0;.3;1" begin="2.95s" dur=".85s" fill="freeze"/>
</circle>
<circle cx="0" cy="-6" r="16" fill="none" stroke="#ffe9a8" stroke-width="1.1" opacity="0">
